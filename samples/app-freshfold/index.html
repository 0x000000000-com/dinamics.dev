/* the frame every sample app stands on: screens that slide, a bar of tabs, sheets from the bottom, a tour that plays by itself */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--tabh:60px}
html.emb{--sat:44px;--sab:20px}
body{height:100dvh;overflow:hidden;background:var(--out);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
input,textarea{font:inherit;font-size:16px;color:inherit;border:0;background:none;outline:0;min-width:0}
a{color:inherit}
h1,h2,h3,h4,b,strong{font-weight:600}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--focus,currentColor);outline-offset:2px}
[hidden]{display:none!important}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:var(--isw,1.75);stroke-linecap:round;stroke-linejoin:round}
.i.s{width:16px;height:16px}.i.m{width:20px;height:20px}.i.l{width:28px;height:28px}
.i .f{fill:currentColor;stroke:none}

#app{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate}
#stack{position:absolute;inset:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scr>.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.body::-webkit-scrollbar,.hs::-webkit-scrollbar,.sbody::-webkit-scrollbar{display:none}
.scr.tabscr>.body{padding-bottom:calc(var(--tabh) + var(--sab) + 16px)}
.scr.push{z-index:5;transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);box-shadow:-12px 0 32px rgba(0,0,0,.08)}
.scr.push.in{transform:none}
.scr.up{transform:translateY(100%)}
.scr.under{transform:translateX(-22%);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.scr.push>.body{padding-bottom:calc(var(--sab) + 24px)}
.scr>.foot{flex:none;padding:12px 16px calc(var(--sab) + 12px);background:var(--card);border-top:1px solid var(--line)}
.sat{padding-top:var(--sat)}
/* the band behind the phone's clock: a screen gives it a colour with --strip */
.scr::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--sat);z-index:3;pointer-events:none;background:var(--strip,transparent);transition:opacity .2s}
.scr.strip:not(.sc)::before{opacity:0}
.hs{display:flex;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.hs>*{flex:none;scroll-snap-align:start}

#tabs{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;height:calc(var(--tabh) + var(--sab));padding-bottom:var(--sab);background:var(--tabbg,var(--card));border-top:1px solid var(--line)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut);position:relative;min-width:0}
#tabs button[aria-current=page]{color:var(--tabon,var(--ink))}
#tabs .dot{position:absolute;top:8px;left:50%;margin-left:8px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--badge,#D43D2A);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:600}

.sb{position:absolute;left:0;right:0;top:0;height:44px;z-index:30;display:none;align-items:center;justify-content:space-between;padding:8px 28px 0 32px;font:600 15px/1 var(--font);color:var(--sbc,var(--ink));pointer-events:none;transition:color .3s}
html.emb .sb{display:flex}
.sb span{display:flex;gap:8px;align-items:center}
.sb svg{height:12px;width:auto;fill:currentColor}
.homebar{position:absolute;left:50%;bottom:6px;width:128px;height:5px;margin-left:-64px;border-radius:3px;background:var(--ink);opacity:.28;z-index:31;display:none;pointer-events:none}
html.emb .homebar{display:block}

.shade{position:absolute;inset:0;z-index:20;background:rgba(10,14,12,.5);opacity:0;transition:opacity .28s;pointer-events:none}
.shade.in{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:calc(100% - var(--sat) - 16px);display:flex;flex-direction:column;background:var(--card);border-radius:var(--sheetr,24px) var(--sheetr,24px) 0 0;transform:translateY(105%);transition:transform .36s cubic-bezier(.2,.85,.2,1);box-shadow:0 -8px 40px rgba(0,0,0,.16)}
.sheet.in{transform:none}
.sheet .grab{flex:none;height:24px;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet .grab::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--line2,var(--line))}
.sheet .sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 20px calc(var(--sab) + 20px);scrollbar-width:none}
.sheet .sfoot{flex:none;padding:12px 20px calc(var(--sab) + 12px);border-top:1px solid var(--line)}

#toast{position:absolute;left:50%;bottom:calc(var(--tabh) + var(--sab) + 24px);z-index:40;max-width:calc(100% - 48px);transform:translate(-50%,12px);padding:12px 16px;border-radius:12px;background:var(--toastbg,rgba(20,24,22,.94));color:#fff;font-size:14px;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#note{position:absolute;left:8px;right:8px;top:calc(var(--sat) + 4px);z-index:41;display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:20px;background:var(--notebg,rgba(250,250,250,.96));color:#111;box-shadow:0 12px 36px rgba(0,0,0,.22);transform:translateY(calc(-100% - var(--sat) - 24px));visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s .42s;text-align:left}
#note.on{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s}
#note .ni{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--brand);color:var(--onbrand,#fff)}
#note b{display:block;font-size:14px;line-height:1.3}
#note span{display:block;font-size:13px;line-height:1.35;color:#444}
#note small{margin-left:auto;align-self:flex-start;font-size:11px;color:#777;white-space:nowrap}

.finger{position:absolute;left:50%;top:60%;z-index:60;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 12px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.12);pointer-events:none;opacity:0;transition:left .55s cubic-bezier(.3,.7,.2,1),top .55s cubic-bezier(.3,.7,.2,1),opacity .25s,transform .14s}
.finger.on{opacity:1}
.finger.down{transform:scale(.72);background:rgba(255,255,255,.55)}

.outnote{display:none}
@media (min-width:700px){
  html:not(.inframe) body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  html:not(.inframe) #app{flex:none;width:390px;height:min(844px,calc(100dvh - 88px));border-radius:44px;box-shadow:0 0 0 10px #0C0E12,0 0 0 11px rgba(255,255,255,.14),0 40px 80px -24px rgba(0,0,0,.5)}
  html:not(.inframe) .outnote{display:block;font-size:13px;color:var(--outink,rgba(255,255,255,.72));text-align:center}
  html:not(.inframe) .outnote a{text-underline-offset:3px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* parts every sample app is built from. An app sets the look with variables: --disp --card --line --line2 --soft --tint --brand --brand2 --onbrand --hi --ok --ink --mut */
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:-.01em;line-height:1.2}
.pr{font-family:var(--disp);font-weight:600;font-feature-settings:"lnum","tnum";white-space:nowrap}
.art{width:100%;height:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--rb,14px);background:var(--brand);color:var(--onbrand);font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:none;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px;border-radius:12px}
.btn.wide{display:flex;width:100%}
.btn.wide+.btn.wide{margin-top:8px}
.btn.inv{background:var(--hi);color:var(--ink)}
.btn.two{flex-wrap:wrap;gap:0 12px;padding:4px 12px;line-height:1.25}
.btn.two .pr{opacity:.9}
.lk{display:inline-flex;align-items:center;gap:2px;min-width:40px;min-height:40px;font-size:13px;font-weight:600;color:var(--brand2)}
.lk.inv{color:var(--onbrand)}
.ib{position:relative;flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%}
.ib.txt{width:auto;padding:0 12px;font-size:14px;color:var(--mut);border-radius:12px}
.ib.ong{color:var(--onbrand)}
.ib.glass{position:absolute;top:calc(var(--sat) + 8px);z-index:4;background:color-mix(in srgb,var(--card) 90%,transparent);box-shadow:0 2px 10px rgba(20,24,28,.14)}
.ib.glass.l{left:12px}.ib.glass.r{right:12px}
.ib[aria-pressed=true]{color:var(--hot,#C8452C)}
.pip{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--hi);box-shadow:0 0 0 2px var(--bg)}
.ong .pip{box-shadow:0 0 0 2px var(--brand)}
.bar{flex:none;background:var(--card);border-bottom:1px solid var(--line)}
.bar>div{display:flex;align-items:center;height:52px;padding:0 4px}
.bar h1{flex:1;min-width:0;text-align:center;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt{flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:calc(var(--sat) + 12px) 12px 8px 20px;min-height:calc(var(--sat) + 64px)}
.pt h1{font-size:28px;padding-bottom:4px}
.sec{padding:0 16px;margin-top:24px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 12px}
.sech h2{flex:0 1 auto;font-size:19px}
.sech small{flex:1 1 0;min-width:0;font-size:13px;color:var(--mut);text-align:right}
.sl{font:600 13px/1.3 var(--font);letter-spacing:0;color:var(--mut);margin:0 4px 8px}
.card{background:var(--card);border-radius:var(--rc,16px);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 16px;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row>span{flex:1;min-width:0}
.row b{display:block;font-size:15px;line-height:1.35}
.row small{display:block;font-size:13px;color:var(--mut);line-height:1.35}
.row em{font-style:normal;font-size:14px;color:var(--mut);white-space:nowrap}
.row em.ok{color:var(--ok);font-weight:600}
.row>.i:first-child{color:var(--brand2)}
.row>.i.s{color:var(--line2)}
.switch{flex:none;position:relative;width:48px;height:28px;border-radius:14px;background:var(--line2);transition:background .2s}
.switch::before{content:"";position:absolute;inset:-8px -4px}
.switch i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked=true]{background:var(--brand)}
.switch[aria-checked=true] i{transform:translateX(20px)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:12px;background:var(--soft);color:var(--mut);font:600 12px var(--font);font-style:normal;white-space:nowrap}
.chip.on{background:var(--tint);color:var(--brand)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:56px 32px}
.empty .art{width:144px;height:144px}
.empty>.i{width:48px;height:48px;color:var(--line2)}
.empty h2{font-size:20px}
.empty p{color:var(--mut);font-size:14px;margin-bottom:12px}
.empty.sm{padding:32px 16px}
.pad{padding:8px 16px 0}
.qty{flex:none;display:flex;align-items:center;height:48px;border-radius:14px;background:var(--soft)}
.qty button{display:grid;place-items:center;width:44px;height:48px;color:var(--brand)}
.qty button:disabled{opacity:.3}
.qty b{min-width:24px;text-align:center;font:600 17px var(--disp)}
.qty.sm{height:36px;border-radius:10px;margin-top:8px}
.qty.sm button{width:36px;height:36px}
.qty.sm b{min-width:20px;font-size:15px}
.addm{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--onbrand)}
.seg{display:flex;padding:4px;border-radius:12px;background:var(--soft)}
.seg button{flex:1;min-width:0;min-height:38px;padding:0 2px;border-radius:9px;font-size:clamp(12px,3.6vw,14px);font-weight:600;color:var(--mut);text-align:center}
.seg button[aria-pressed=true]{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(20,24,28,.12)}
.livebar{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:12px 16px 0;padding:12px 12px 12px 16px;border-radius:16px;background:var(--brand);color:var(--onbrand)}
.livebar span{flex:1;min-width:0}
.livebar b{display:block;font-size:14px}
.livebar small{display:block;font-size:12px;opacity:.76}
.pulse{flex:none;width:10px;height:10px;border-radius:50%;background:var(--hi);animation:pulse 1.6s infinite}
.thumbs{display:flex}
.sum{padding:4px 4px 0}
.sum p{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 0;font-size:14px;color:var(--mut)}
.sum p b{color:var(--ink);font-family:var(--disp)}
.sum .off b{color:var(--ok)}
.sum .tot{margin-top:8px;padding-top:12px;border-top:1px dashed var(--line2);font-size:16px;font-weight:600;color:var(--ink)}
.sum .tot b{font-size:22px}
.sum .tot small{margin-left:8px;font-weight:400;font-size:12px;color:var(--mut)}
.sum .earn{justify-content:flex-start;gap:8px;font-size:13px;color:var(--brand2)}
.pfoot{display:flex;align-items:center;gap:16px}
.pfoot>div{flex:none;min-width:84px}
.pfoot small{display:block;font-size:12px;color:var(--mut)}
.pfoot b{font:600 24px/1.1 var(--disp)}
.pfoot .btn{flex:1}
.sh{font-size:20px;margin:4px 0 16px}
.hint{margin-top:12px;font-size:13px;color:var(--mut);text-align:center}
.hint.l{text-align:left;margin:-8px 0 12px}
.plist{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line2)}
[aria-pressed=true]>.radio,.radio.on{border:7px solid var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{flex:1 1 72px;min-height:48px;padding:0 12px;border-radius:12px;background:var(--soft);font-size:15px;text-align:center;white-space:nowrap}
.paying{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 20px 48px!important;text-align:center}
.paying h2{font-size:20px}
.paying p{color:var(--mut);font-family:var(--disp)}
.spin{width:44px;height:44px;margin-bottom:8px;border-radius:50%;border:4px solid var(--tint);border-top-color:var(--brand);animation:spin .8s linear infinite}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.amts button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72px;border-radius:14px;background:var(--soft)}
.amts b{font:600 20px var(--disp)}
.amts small{font-size:11px;color:var(--mut)}
.wl{list-style:none;padding:0;margin:0}
.wl li{display:flex;align-items:center;gap:12px;padding:12px 0}
.wl li+li{border-top:1px solid var(--line)}
.wl i{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--mut)}
.wl i.in{background:var(--tint);color:var(--brand)}
.wl span{flex:1;min-width:0}
.wl span b{display:block;font-size:15px}
.wl small{font-size:12px;color:var(--mut)}
.wl li>b{font-family:var(--disp)}
.wl b.in{color:var(--ok)}
.codes{text-align:center}
.codes .sh{text-align:left}
.qrc{margin:0 auto;border-radius:12px;border:1px solid var(--line)}
.codes .big{margin-top:12px;font:600 28px var(--disp);letter-spacing:.04em}
.cbal{display:flex;justify-content:center;gap:28px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.cbal span{display:inline-flex;align-items:center;gap:8px;font:600 16px var(--disp);color:var(--brand)}
.rds{display:flex;flex-direction:column;align-items:center;text-align:center}
.rds h2{margin-top:16px;font-size:22px}
.rds p{margin:8px 0 20px;font-size:14px;color:var(--mut)}
.steps{list-style:none;margin:0;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.steps li{position:relative;display:flex;align-items:center;gap:12px;min-height:40px;color:var(--mut)}
.steps li>i{position:relative;z-index:1;flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);background:var(--card)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:9px;top:30px;width:2px;height:20px;background:var(--line2)}
.steps li.done>i{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.steps li.done::after{background:var(--brand)}
.steps li.now{color:var(--ink)}
.steps li.now>i{border-color:var(--hi);box-shadow:0 0 0 4px color-mix(in srgb,var(--hi) 30%,transparent)}
.steps li.now>i:not(:empty){background:var(--hi);color:var(--ink);box-shadow:none}
.steps li>i .i{width:12px;height:12px;stroke-width:3}
.steps b{flex:1;font-size:15px}
.steps small{font-size:13px}
.tact{display:flex;gap:8px;padding:0 16px 16px}
.tact .btn{flex:1}
.ocard{display:block;width:100%;padding:16px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left}
.ocard+.ocard{margin-top:12px}
.oh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.oh b{font-size:15px}
.oh small{display:block;margin-top:2px;font-size:12px;color:var(--mut)}
.of{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.of>b{font:600 18px var(--disp)}
.of span{display:flex;gap:8px}
.othumbs{display:flex;align-items:center;margin-top:12px}
.othumbs p{flex:1;min-width:0;margin-left:12px;font-size:13px;line-height:1.4;color:var(--mut)}
.omap{height:236px;overflow:hidden;border-bottom:1px solid var(--line)}
.citymap{width:100%;height:100%}
.olist{padding:12px 16px 0}
.orow{display:flex;align-items:center;gap:12px;width:100%;padding:16px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left}
.orow+.orow{margin-top:8px}
.orow.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.orow>span:first-child{flex:1;min-width:0}
.orow b{display:block;font:600 16px/1.3 var(--disp)}
.orow small{display:block;margin-top:2px;font-size:12px;color:var(--mut)}
.okm{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.okm b{font-size:14px}
.nrow{display:flex;gap:12px;padding:16px 0}
.nrow+.nrow{border-top:1px solid var(--line)}
.nrow>i{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--mut)}
.nrow.new>i{background:var(--brand);color:var(--onbrand)}
.nrow b{display:block;font-size:15px;line-height:1.35}
.nrow.new b::after{content:"";display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;background:var(--hi);vertical-align:middle}
.nrow small{display:block;margin-top:2px;font-size:13px;color:var(--mut)}
.nrow em{display:block;margin-top:4px;font-style:normal;font-size:12px;color:var(--mut)}
.faq{border-bottom:1px solid var(--line)}
.faq summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;font-size:15px;font-weight:600;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary .i{color:var(--mut);transition:transform .2s}
.faq[open] summary .i{transform:rotate(180deg)}
.faq p{padding-bottom:16px;font-size:14px;color:var(--mut)}
.pad>.btn{margin-top:20px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 70%,transparent)}70%,100%{box-shadow:0 0 0 10px transparent}}
@keyframes spin{to{transform:rotate(360deg)}}

/* 快洗 FreshFold: clean and exact. Cool paper, ink navy, one cobalt, aqua for what is live; the wash label, with its stitched edge and its own little signs, is the mark that repeats. */
:root{--font:"FF Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;--disp:var(--font);
  --bg:#F2F5FA;--card:#FFFFFF;--ink:#0F1B2D;--mut:#526177;--line:#E1E7F0;--line2:#C6D1E0;--soft:#E9EEF6;--tint:#E3ECFF;
  --brand:#1F5EFF;--brand2:#1848C8;--onbrand:#FFFFFF;--hi:#18C3B3;--ok:#0F7A57;--hot:#D93A44;--out:#0A1322;--focus:#1848C8;--tabon:#1F5EFF;--badge:#1F5EFF;--rb:12px;--rc:14px;--sheetr:20px;--isw:1.7}
body{font-size:14.5px}
h1,h2,h3{letter-spacing:-.02em}
.btn{font-size:15px}
.btn:disabled{opacity:.35}
.btn.inv{background:#fff;color:var(--brand2)}
.btn.sm{border-radius:10px}
.bar{background:var(--bg);border-bottom:0}
.pt h1{font-size:28px}
.sec.first{margin-top:4px}
.padc{padding:16px 16px}
.pad>.sl{margin-top:20px}
.seg{border-radius:12px}
.chips button{flex:0 1 auto;min-height:44px;border-radius:22px;font-size:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line2)}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.ocard,.orow,.plist,.steps{border-radius:14px}
.row>em.pr{color:var(--ink);font-size:15px}
.ib.soft{background:var(--soft);color:var(--brand2)}
.tabscr[data-s=home]{--strip:var(--card)}
/* the wash label: a card with a stitched inner edge */
.tagc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px}
.tagc::after{content:"";position:absolute;inset:5px;border:1.5px dashed var(--line2);border-radius:10px;pointer-events:none}
.ocard.tagc{padding:16px 20px}
.ocard.live .chip.on{background:var(--hi);color:var(--ink)}
.obar{height:6px;margin:12px 0 0;border-radius:3px;background:var(--soft);overflow:hidden}
.obar i{display:block;height:100%;border-radius:3px;background:var(--hi);transition:width .8s}
.of small{font-size:13px;color:var(--mut)}
.carel{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font-size:13px;color:var(--mut)}
.carel .i{color:var(--ink)}
.carel i{font-style:normal;opacity:.5}

/* home */
.hd{background:var(--card);padding:calc(var(--sat) + 8px) 12px 16px 16px;border-bottom:1px solid var(--line)}
.hdrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.apill{display:flex;align-items:center;gap:8px;min-width:0;min-height:44px;text-align:left}
.apill>.i:first-child{color:var(--brand)}
.apill span{min-width:0}
.apill small{display:block;font-size:11px;color:var(--mut);line-height:1.2}
.apill b{display:block;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apill>.i.s{color:var(--mut)}
.hd h1{margin:12px 4px 0;font-size:26px;text-wrap:balance}
.hd .pip{background:var(--hot);box-shadow:0 0 0 2px var(--card)}
.cta{position:relative;display:flex;margin:16px 16px 0;padding:16px 16px 16px;border-radius:18px;background:var(--brand);color:#fff;overflow:hidden}
.cta>span{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;max-width:66%}
.cta b{font-size:21px;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.cta small{margin:8px 0 16px;font-size:13px;line-height:1.4;opacity:.9}
.cta .art{position:absolute;right:-14px;bottom:-22px;width:150px;height:150px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sgrid button{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left}
.sgrid .i{color:var(--brand);margin-bottom:12px}
.sgrid b{font-size:14px;line-height:1.25}
.sgrid small{margin-top:2px;font-size:11.5px;line-height:1.35;color:var(--mut)}
.planc{display:flex;align-items:center;gap:16px;width:100%;padding:16px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left}
.ringp{flex:none;width:56px;height:56px}
.ringp.big{width:96px;height:96px}
.planc span{flex:1;min-width:0}
.planc small{display:block;font-size:12px;color:var(--mut)}
.planc b{display:block;font-size:16px;line-height:1.3}
.planc em{font-style:normal;font-size:12px;color:var(--mut)}
.planc>.i{color:var(--line2)}
.how{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;padding:0;counter-reset:h}
.how li{position:relative;padding:12px;border-radius:14px;background:var(--soft)}
.how i{display:grid;place-items:center;width:36px;height:36px;margin-bottom:12px;border-radius:10px;background:var(--card);color:var(--brand)}
.how b{display:block;font-size:14px}
.how small{display:block;margin-top:2px;font-size:11.5px;line-height:1.35;color:var(--mut)}
.amap{height:150px;margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.amap .citymap,.tmap .citymap{display:block;width:100%;height:100%}

/* starting an order */
.mcards{display:flex;flex-direction:column;gap:12px}
.mcard{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px 12px 8px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left}
.mcard .art{flex:none;width:88px;height:88px}
.mcard>span{flex:1;min-width:0}
.mcard b{font-size:18px;letter-spacing:-.02em}
.mcard small{display:block;margin-top:2px;font-size:13px;line-height:1.4;color:var(--mut)}
.mcard em{display:block;margin-top:8px;font-style:normal;font-size:13px;color:var(--brand2)}
.mcard em b{font-size:15px}
.mcard>.i{color:var(--line2)}
.fprog{display:flex;gap:4px;padding:0 16px 12px}
.fprog i{flex:1;height:3px;border-radius:2px;background:var(--line2)}
.fprog i.on{background:var(--brand)}
.ib.num{width:auto;padding:0 16px;font-style:normal;font-size:13px;font-weight:600;color:var(--mut)}
.fbody{padding:12px 16px 24px}
.fbody>.card{margin-bottom:12px}
.fq{margin:4px 4px 16px;font-size:24px;text-wrap:balance}
.fh{display:flex;align-items:baseline;gap:8px;margin:24px 4px 12px;font-size:16px}
.fh small{font-size:12px;font-weight:400;letter-spacing:0;color:var(--mut)}
.kgbox{display:flex;flex-direction:column;align-items:center;margin-top:12px;padding:8px 16px 20px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.kgbox .bag{width:176px;height:176px;transition:none}
.kgbox .bag g{transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.qty.big{height:56px;border-radius:14px}
.qty.big button{width:56px;height:56px}
.qty.big b{min-width:84px;font-size:28px;letter-spacing:-.02em}
.qty.big b small{margin-left:4px;font-size:14px;font-weight:500;color:var(--mut)}
.kgbox p{margin-top:12px;font-size:13px;color:var(--mut)}
.itl{margin-top:12px}
.itl .row{min-height:64px}
.itl .qty.sm{margin-top:0}
.itl small.pr{font-size:13px;color:var(--mut);font-weight:500}
.cg{border:0;padding:0;margin:16px 0 0;min-width:0}
.cg legend{padding:0;margin:0 4px 8px;font-size:14px;font-weight:600}
.copts{display:flex;gap:8px}
.copts button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:60px;padding:8px 4px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:13px;line-height:1.2;text-align:center}
.copts button[aria-pressed=true],.spd button[aria-pressed=true],.wins button[aria-pressed=true],.stypes button[aria-pressed=true]{border-color:var(--brand);background:var(--tint);color:var(--brand2)}
.softr{margin-top:16px}
.stn{padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.stypes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stypes button{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 8px;border-radius:18px;border:1.5px solid var(--line);font-size:13px}
.stypes i{width:14px;height:14px;border-radius:50%}
.gwrap{margin-top:8px;border-radius:12px;background:var(--bg)}
.garm{display:block;width:100%;max-width:300px;margin:0 auto;font-family:var(--font)}
.zone{cursor:pointer}
.zone:hover circle+circle{stroke-width:3}
.mark circle:first-child{animation:pop .3s}
.marks{list-style:none;margin:8px 0 0;padding:0}
.marks li{display:flex;align-items:center;gap:12px;min-height:44px;font-size:14px}
.marks li+li{border-top:1px solid var(--line)}
.marks li>i{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-style:normal;font-size:12px;font-weight:600}
.marks span{flex:1;min-width:0}
.marks .ib{color:var(--mut)}
.days{gap:8px;margin:0 -16px;padding:0 16px;scroll-padding:0 16px}
.dayb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:56px;height:66px;border-radius:14px;background:var(--card);border:1.5px solid var(--line)}
.dayb small{font-size:12px;color:var(--mut)}
.dayb b{font-size:20px;line-height:1.1;letter-spacing:-.02em}
.dayb[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.dayb[aria-pressed=true] small{color:rgba(255,255,255,.76)}
.wins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.wins button{min-height:48px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:500;text-align:center}
.wins button:disabled{opacity:.38;text-decoration:line-through;background:none}
.spd{display:flex;flex-direction:column;gap:8px}
.spd button{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);text-align:left;color:var(--ink)}
.spd span{flex:1;min-width:0}
.spd b{display:block;font-size:15px}
.spd small{font-size:13px;color:var(--mut)}
.spd em{font-style:normal;font-size:14px}
.notes{margin-top:12px}
.sumc{padding:16px 20px;margin-bottom:12px}
.sumh{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sumh .art{flex:none;width:56px;height:56px;margin-left:-8px}
.sumh span{flex:1;min-width:0}
.sumh b{display:block;font-size:16px;letter-spacing:-.01em}
.sumh small{font-size:13px;color:var(--mut)}
.sumh>.pr{font-size:18px}
.sumc dl{margin:12px 0 0}
.sumc dl div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:4px 0;font-size:13.5px}
.sumc dt{flex:none;color:var(--mut)}
.sumc dd{margin:0;text-align:right}
.sumc dd .carel{justify-content:flex-end;color:var(--ink)}
.fbody .sum{margin-bottom:12px}

/* an order on its way */
.trk{padding-bottom:calc(var(--sab) + 24px)}
.tmap{height:236px;margin:0 16px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.tart{display:grid;place-items:center;height:236px;margin:0 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.tart .art{width:188px;height:188px;animation:pop .35s cubic-bezier(.3,1.3,.5,1)}
.tart.s4{background:var(--tint)}
.spinning{animation:spin 2.4s linear infinite}
.tart.s4 .wave{animation:slosh 1.6s ease-in-out infinite alternate}
.thead{padding:16px 20px 4px}
.thead h2{font-size:22px}
.thead p{margin-top:4px;color:var(--mut)}
.trk>.card,.trk>.steps,.trk>.tagc,.trk>.btn{margin:12px 16px 0}
.trk>.btn.wide{width:calc(100% - 32px)}
.weigh{padding:16px}
.weigh dl{margin:0 0 16px}
.weigh dl div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;font-size:14px}
.weigh dl div+div{border-top:1px dashed var(--line2)}
.weigh dt{color:var(--mut)}
.weigh dd{margin:0}
.weigh dd b{font-size:20px;letter-spacing:-.02em;color:var(--brand2)}
.rider{display:flex;align-items:center;gap:12px;padding:12px 16px}
.rav{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff}
.rider>span{flex:1;min-width:0}
.rider b{display:block;font-size:15px}
.rider small{font-size:13px;color:var(--mut)}
.rate{padding:16px;text-align:center}
.rate h3{font-size:17px}
.stars{display:flex;justify-content:center;gap:2px;margin-top:8px}
.stars button{display:grid;place-items:center;width:48px;height:48px;color:var(--line2)}
.stars button[aria-pressed=true]{color:#F2A400}

/* plans */
.mine{display:flex;align-items:center;gap:16px;padding:16px 16px;border-radius:16px;background:var(--ink);color:#fff;--tint:rgba(255,255,255,.16);--brand:var(--hi)}
.mine span{flex:1;min-width:0}
.mine small{display:block;font-size:13px;opacity:.8}
.mine b{display:block;margin:2px 0;font-size:32px;line-height:1.1;letter-spacing:-.03em}
.mine em{font-style:normal;font-size:15px;font-weight:500;opacity:.8;letter-spacing:0}
.mine i{font-style:normal;font-size:12px;opacity:.76}
.pcard{display:flex;align-items:center;gap:12px;width:100%;padding:16px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);text-align:left}
.pcard+.pcard{margin-top:8px}
.pcard.on{border-color:var(--brand)}
.pcard>span:first-child{flex:1;min-width:0}
.pcard b{font-size:17px;letter-spacing:-.02em}
.pcard .chip{margin-left:8px;vertical-align:2px}
.pcard small{display:block;margin-top:2px;font-size:13px;color:var(--mut)}
.pcard em{display:block;margin-top:4px;font-style:normal;font-size:12px;color:var(--brand2)}
.pp{flex:none;text-align:right}
.pp b{font-size:20px}
.rds .ringp{margin-top:4px}

/* account */
.prof{display:flex;align-items:center;gap:12px;margin:4px 16px 0}
.av{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-size:22px;font-weight:600}
.prof b{display:block;font-size:20px;line-height:1.2;letter-spacing:-.02em}
.prof small{font-size:13px;color:var(--mut)}
.mlistc{margin:12px 16px 0}
.ver{margin:20px 0 8px;text-align:center;font-size:12px;color:var(--mut)}
.kgp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:14px;background:var(--brand);color:#fff}
.kgp span b{display:block;font-size:17px}
.kgp small{font-size:13px;opacity:.9}
.kgp>b{font-size:24px;white-space:nowrap}
.kgp>b small{font-weight:500}
.about{text-align:center}
.about .ab{width:120px;height:120px;margin:0 auto 8px}
.about h2{font-size:22px}
.about p{margin:8px 0 20px;font-size:14px;color:var(--mut)}
@keyframes pop{from{transform:scale(.92);opacity:.5}}
@keyframes slosh{from{transform:translateX(-6px)}to{transform:translateX(6px)}}

</style>

K.on('paysheet', () => K.sheet(() => `<div class="sbody"><h2 class="sh">${esc(T('pay.t'))}</h2><div class="plist">${PAYS.map(p => `<button type="button" class="row" data-a="setpay:${p}" aria-pressed="${S.pay === p}">${I(PAYI[p])}<span><b>${esc(T('pay.' + p))}</b><small>${esc(T('pay.' + p + '.s'))}</small></span><i class="radio"></i></button>`).join('')}</div></div>`));
K.on('setpay', ([p]) => { S.pay = p; K.closeSheet(); K.draw(); });
K.on('caresheet', () => K.sheet(() => `<div class="sbody"><h2 class="sh">${esc(T('care.mine'))}</h2>${careForm(S.care, 'mycare')}<p class="hint">${esc(T('care.hint'))}</p></div>`));
K.on('mycare', ([g, v]) => { if (g === 'soft') S.care.soft = !S.care.soft; else S.care[g] = v; K.draw(); });

/* ---------- an order on its way: collected, weighed, washed, folded, brought back ---------- */
function adv(o) {
  o.stage++; o.ts[o.stage] = new Date();
  if (o.stage === 3) { if (o.mode === 'kg') o.weight = o.weight || o.kg + .4; else o.ok = 1; }
  if (o.stage === 7) { if (o.mode === 'kg') S.used = Math.min(PL[S.plan].kg, S.used + Math.min(o.weight, o.cov || 0)); K.note(T('note.t'), T('note.b', { id: o.id }), 'door', 'go:track:' + o.id); }
  K.draw();
}
function run(o) { if (o.run || o.stage >= 7 || (o.stage === 3 && !o.ok)) return; o.run = 1; K.after(4600, () => { o.run = 0; adv(o); run(o); }); }
const stageTop = o => {
  const s = o.stage;
  if (s === 1 || s === 6) return `<div class="tmap">${routeMap(!K.calm)}</div>`;
  return `<div class="tart s${s}">${s === 0 ? bagArt(o.kg || 7) : s === 2 ? bagArt(o.kg || 7) : s === 3 ? (o.mode === 'kg' ? scaleArt(o.weight) : stackArt()) : s === 4 ? machineArt('', !K.calm) : s === 5 ? stackArt() : doorArt()}</div>`;
};
K.def('track', {
  render(q) {
    const o = ord(q.id), b = bill(o), s = o.stage, rows = [['placed', 0], ['got', 2], ['weigh', 3], ['wash', 4], ['fold', 5], ['done', 7]];
    const isDone = r => s > r[1] || (s === r[1] && (r[1] !== 3 || o.ok)); const nowI = rows.findIndex(r => !isDone(r));
    const diff = o.mode === 'kg' && o.weight ? (o.weight - o.kg) : 0;
    return `<header class="bar sat"><div><button type="button" class="ib" data-back aria-label="${esc(T('k.back'))}">${I('left')}</button><h1>${esc(o.id)}</h1><button type="button" class="ib" data-a="go:help" aria-label="${esc(T('me.help'))}">${I('help')}</button></div></header>
<div class="body trk">${stageTop(o)}<div class="thead"><h2>${esc(T('sg.' + STG[s] + '.l' + (s === 3 && o.mode === 'pc' ? 'pc' : '')))}</h2><p>${esc(s === 4 ? T('eta.wash', { m: o.mins }) : s === 7 ? T('eta.done', { t: hm(o.ts[7]) }) : s === 3 && !o.ok ? T('eta.weigh') : T('sp.by', { d: dayT(backDay(o)) }))}</p></div>
${s === 3 && !o.ok ? `<div class="weigh card"><dl><div><dt>${esc(T('w.est'))}</dt><dd>${o.kg.toFixed(1)} kg</dd></div><div><dt>${esc(T('w.real'))}</dt><dd><b>${o.weight.toFixed(1)} kg</b></dd></div><div><dt>${esc(T(diff >= 0 ? 'w.more' : 'w.less'))}</dt><dd>${money(Math.abs(diff) * KG)}</dd></div></dl><button type="button" class="btn wide" data-a="wok:${o.id}">${esc(T('w.ok'))}</button><p class="hint">${esc(T('w.hint'))}</p></div>` : ''}
${s === 1 || s === 6 ? `<div class="rider card"><i class="rav">${I('bike')}</i><span><b>Marco</b><small>${esc(T(s === 1 ? 'rider.in' : 'rider.out'))} · R-2187</small></span><button type="button" class="ib soft" data-a="demo:call" aria-label="${esc(T('call'))}">${I('phone', 'm')}</button><button type="button" class="ib soft" data-a="demo:chat" aria-label="${esc(T('chat'))}">${I('chat', 'm')}</button></div>` : ''}
${s === 7 ? `<div class="card rate"><h3>${esc(o.stars ? T('rate.thanks') : T('rate.q'))}</h3><div class="stars">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-a="rate:${o.id}:${i}" aria-label="${i}" aria-pressed="${i <= (o.stars || 0)}">${I(i <= (o.stars || 0) ? 'starf' : 'star', 'l')}</button>`).join('')}</div></div>` : ''}
<ol class="steps">${rows.map((r, i) => `<li class="${isDone(r) ? 'done' : i === nowI ? 'now' : ''}"><i>${isDone(r) ? I('check', 's') : ''}</i><b>${esc(T('row.' + r[0]))}</b><small>${o.ts[r[1]] && isDone(r) ? hm(o.ts[r[1]]) : ''}</small></li>`).join('')}</ol>
<div class="tagc sumc"><div class="sumh">${o.mode === 'kg' ? bagArt(o.kg) : stackArt()}<span><b>${esc(o.mode === 'kg' ? T('m.kg') : T('m.pc'))}</b><small>${esc(what(o))}</small></span><b class="pr">${esc(due(o))}</b></div>
<dl><div><dt>${esc(T('r.pick'))}</dt><dd>${esc(dayT(o.day))} ${win(o.win)}</dd></div><div><dt>${esc(T('r.care'))}</dt><dd>${careLine(o.care)}</dd></div>${nmarks(o) ? `<div><dt>${esc(T('st.t'))}</dt><dd>${esc(T('st.n', { n: nmarks(o) }))}</dd></div>` : ''}${b.cover ? `<div><dt>${esc(T('sum.plan', { n: L(PL[S.plan].n) }))}</dt><dd>−${money(b.cover)}</dd></div>` : ''}</dl></div>
${s === 7 ? `<button type="button" class="btn ghost wide" data-a="again:${o.id}">${I('refresh', 's')} ${esc(T('again'))}</button>` : ''}</div>`;
  },
  show(el, q) { run(ord(q.id)); }
});
K.on('wok', ([id]) => { const o = ord(id); o.ok = 1; K.draw(); K.toast(T('w.done')); run(o); });
K.on('rate', ([id, n]) => { ord(id).stars = +n; K.draw(); K.toast(T('rate.toast')); });

/* ---------- orders ---------- */
K.def('orders', { icon: 'receipt', label: 'tab.orders', badge: () => actives().length,
  render() { const a = actives(), d = dones();
    return `<header class="pt sat"><h1>${esc(T('tab.orders'))}</h1></header><div class="body">${a.length ? `<section class="sec first"><h2 class="sl">${esc(T('ord.live'))}</h2>${a.map(ocard).join('')}</section>` : ''}
<section class="sec${a.length ? '' : ' first'}"><h2 class="sl">${esc(T('ord.past'))}</h2>${d.map(ocard).join('')}</section></div>`; }
});

/* ---------- monthly plans ---------- */
K.def('plans', { icon: 'crown', label: 'tab.plans',
  render() { const p = PL[S.plan];
    return `<header class="pt sat"><h1>${esc(T('plans.t'))}</h1></header><div class="body"><div class="sec first"><div class="mine">${ring(S.used / p.kg, 'big')}<span><small>${esc(T('plan.name', { n: L(p.n) }))}</small><b>${S.used.toFixed(1)}<em> / ${p.kg} kg</em></b><i>${esc(T('plan.renew', { d: dstr(S.renew, { month: 'long', day: 'numeric' }) }))}</i></span></div></div>
<section class="sec"><div class="sech"><h2>${esc(T('plans.all'))}</h2><small>${esc(T('plans.vs', { p: money(KG) }))}</small></div>${PLANS.map(x => `<button type="button" class="pcard${x.id === S.plan ? ' on' : ''}" data-a="plan:${x.id}"><span><b>${esc(L(x.n))}${x.id === S.plan ? `<i class="chip on">${esc(T('plans.cur'))}</i>` : ''}</b><small>${esc(L(x.d))}</small><em>${esc(T('plans.per', { p: money(x.p / x.kg) }))}</em></span><span class="pp"><b class="pr">${money(x.p)}</b><small>${x.kg} kg / ${esc(T('month'))}</small></span></button>`).join('')}</section>
<section class="sec"><div class="sech"><h2>${esc(T('plans.perks'))}</h2></div><div class="card">${[['bike', 'perk.1'], ['bolt', 'perk.2'], ['refresh', 'perk.3']].map(k => `<div class="row">${I(k[0])}<span><b>${esc(T(k[1]))}</b><small>${esc(T(k[1] + 's'))}</small></span></div>`).join('')}</div></section></div>`; }
});
K.on('plan', ([id]) => { const x = PL[id]; if (id === S.plan) return K.toast(T('plans.same'));
  K.sheet(`<div class="sbody rds">${ring(Math.min(1, S.used / x.kg), 'big')}<h2>${esc(T('plans.to', { n: L(x.n) }))}</h2><p>${esc(T('plans.tos', { kg: x.kg, p: money(x.p), d: dstr(S.renew, { month: 'long', day: 'numeric' }) }))}</p><button type="button" class="btn wide" data-a="setplan:${id}">${esc(T('plans.do'))}</button><button type="button" class="btn ghost wide" data-close>${esc(T('cancel'))}</button></div>`); });
K.on('setplan', ([id]) => { S.plan = id; K.closeSheet(); K.draw(); K.toast(T('plans.done', { n: L(PL[id].n) })); });

/* ---------- account ---------- */
K.def('me', { icon: 'user', label: 'tab.me',
  render() { return `<header class="pt sat"><h1>${esc(T('tab.me'))}</h1><button type="button" class="ib" data-a="go:inbox" aria-label="${esc(T('inbox.t'))}">${I('bell')}${S.unread ? '<i class="pip"></i>' : ''}</button></header><div class="body">
<div class="prof"><i class="av">${esc(S.name[0])}</i><span><b>${esc(S.name)}</b><small>${esc(T('plan.name', { n: L(PL[S.plan].n) }))} · ${esc(T('me.n', { n: S.orders.length + 21 }))}</small></span></div>
<section class="card mlistc"><button type="button" class="row" data-a="addrsheet">${I('pin')}<span><b>${esc(T('addr.t'))}</b></span><em>${S.addrs.length}</em>${I('right', 's')}</button>
<button type="button" class="row" data-a="paysheet">${I('card')}<span><b>${esc(T('pay.t'))}</b></span><em>${esc(T('pay.' + S.pay))}</em>${I('right', 's')}</button>
<button type="button" class="row" data-a="caresheet">${I('tune')}<span><b>${esc(T('care.mine'))}</b><small>${careLine(S.care)}</small></span>${I('right', 's')}</button>
<button type="button" class="row" data-a="go:prices">${I('tag')}<span><b>${esc(T('prices.t'))}</b></span>${I('right', 's')}</button></section>
<section class="card mlistc"><button type="button" class="row" data-a="langsheet">${I('globe')}<span><b>${esc(T('me.lang'))}</b></span><em>${{ zh: '中文', en: 'English', ms: 'Bahasa Melayu' }[K.lang]}</em>${I('right', 's')}</button>
<button type="button" class="row" data-a="go:help">${I('help')}<span><b>${esc(T('me.help'))}</b></span>${I('right', 's')}</button>
<button type="button" class="row" data-a="about">${I('info')}<span><b>${esc(T('me.about'))}</b></span>${I('right', 's')}</button></section><p class="ver">FreshFold 4.1.0</p></div>`; }
});
K.on('langsheet', () => K.sheet(() => `<div class="sbody"><h2 class="sh">${esc(T('me.lang'))}</h2><div class="plist">${[['zh', '中文'], ['en', 'English'], ['ms', 'Bahasa Melayu']].map(l => `<button type="button" class="row" data-a="setlang:${l[0]}" aria-pressed="${K.lang === l[0]}"><span><b>${l[1]}</b></span><i class="radio"></i></button>`).join('')}</div></div>`));
K.on('setlang', ([l]) => { K.closeSheet(); K.setLang(l); });
K.on('about', () => K.sheet(`<div class="sbody about">${stackArt('ab')}<h2>FreshFold</h2><p>${esc(T('about.p'))}</p><a class="btn ghost wide" href="https://dinamics.dev/craft/app" target="_blank" rel="noopener">${esc(T('about.go'))}</a></div>`));
K.def('prices', { render() { return bar(T('prices.t')) + `<div class="body pad"><div class="kgp"><span><b>${esc(T('m.kg'))}</b><small>${esc(T('m.kg.s'))}</small></span><b class="pr">${money(KG)}<small> / kg</small></b></div>
<h2 class="sl">${esc(T('m.pc'))}</h2><div class="card">${ITEMS.map(it => `<div class="row">${I(it.icon)}<span><b>${esc(L(it.n))}</b></span><em class="pr">${money(it.p)}</em></div>`).join('')}</div>
<h2 class="sl">${esc(T('prices.more'))}</h2><div class="card"><div class="row">${I('bolt')}<span><b>${esc(T('sp.express'))}</b><small>${esc(T('prices.ex'))}</small></span><em class="pr">+${money(EXPRESS)}</em></div><div class="row">${I('bike')}<span><b>${esc(T('sum.ride'))}</b><small>${esc(T('prices.ride'))}</small></span><em class="pr">${esc(T('free'))}</em></div></div></div>`; } });
K.def('inbox', {
  render() { return bar(T('inbox.t')) + `<div class="body pad">${S.inbox.map(n => `<div class="nrow${n.n ? ' new' : ''}"><i>${I({ wash: 'wash', plan: 'crown', done: 'door' }[n.k], 'm')}</i><span><b>${esc(T('in.' + n.k + '.t'))}</b><small>${esc(T('in.' + n.k + '.b'))}</small><em>${esc(dayS(n.t))} ${hm(n.t)}</em></span></div>`).join('')}</div>`; },
  show() { if (S.unread) { S.unread = 0; setTimeout(() => { S.inbox.forEach(n => { n.n = 0; }); K.dirty(); }, 600); } }
});
K.def('help', { render() { return bar(T('me.help')) + `<div class="body pad">${FAQ.map(q => `<details class="faq"><summary>${esc(T('faq.' + q))}${I('down', 's')}</summary><p>${esc(T('faq.' + q + 'a'))}</p></details>`).join('')}<button type="button" class="btn ghost wide" data-a="demo:chat">${I('chat', 's')} ${esc(T('help.chat'))}</button></div>`; } });

/* ---------- deep links for pictures and checks, and the tour ---------- */
const jt = (st, fix) => { K.tab('orders', true); const o = ord('FF-58213'); o.run = 1; Object.assign(o, { stage: st, ok: st > 3 ? 1 : 0 }, fix || {}); for (let i = 0; i <= st; i++) o.ts[i] = o.ts[i] || new Date(); K.go('track', { id: o.id }); };
K.jumps = {
  'new'() { K.tab('new'); }, orders() { K.tab('orders'); }, plans() { K.tab('plans'); }, me() { K.tab('me'); }, prices() { K.go('prices'); },
  f1() { O = newO(); K.go('flow'); }, f1pc() { O = newO({ mode: 'pc' }); K.go('flow'); }, f2() { O = newO({ step: 2 }); O.stains.shirt.push({ z: 1, t: 'oil' }, { z: 3, t: 'drink' }); O.st = 'drink'; K.go('flow'); },
  f3() { O = newO({ step: 3, day: 1, win: 3, speed: 'express' }); K.go('flow'); }, f4() { O = newO({ step: 4, day: 1, win: 3, speed: 'express' }); O.stains.shirt.push({ z: 1, t: 'oil' }); K.go('flow'); },
  addr() { K.acts.addrsheet(); }, paysh() { K.jumps.f4(); K.acts.paysheet(); }, care() { K.tab('me', true); K.acts.caresheet(); }, plansw() { K.tab('plans', true); K.acts.plan(['plus']); }, inbox() { K.go('inbox'); }, help() { K.go('help'); },
  lang() { K.tab('me', true); K.acts.langsheet(); }, about() { K.tab('me', true); K.acts.about(); }, f2pants() { K.jumps.f2(); O.gk = 'pants'; O.stains.pants.push({ z: 3, t: 'mud' }); K.draw(); }, f4pc() { O = newO({ mode: 'pc', step: 4 }); K.go('flow'); },
  placed() { jt(0); }, got() { jt(2); }, pcdone() { K.tab('orders', true); K.go('track', { id: 'FF-57960' }); },
  coming() { jt(1); }, weigh() { jt(3); }, wash() { jt(4); }, fold() { jt(5); }, back() { jt(6); }, done() { jt(7); }, track() { K.tab('orders', true); K.go('track', { id: 'FF-58213' }); }
};
K.tour = async A => {
  const w = n => A.wait(K.fast ? n / 8 : n);
  await A.tap('.cta .btn'); await A.tap('[data-a="fkg:1"]', 350); await A.tap('[data-a="fkg:1"]', 700); await A.tap('[data-a="fnext"]', 700);
  await A.tap('[data-a="fcare:temp:30"]', 500); await A.tap('[data-a="fcare:det:none"]', 500); await A.tap('.zone[data-a="stain:1"]', 600); await A.tap('[data-a="fst:drink"]', 500); await A.tap('.zone[data-a="stain:3"]', 800); await A.tap('[data-a="fnext"]', 700);
  await A.tap('[data-a="fday:1"]', 500); await A.tap('[data-a="fwin:3"]', 500); await A.tap('[data-a="fspeed:express"]', 700); await A.tap('[data-a="fnext"]', 700);
  await A.scroll(260); await A.tap('[data-a="fnext"]', K.fast ? 900 : 2400); await w(4800); await w(4600); await w(5200);
  await A.tap('[data-a^="wok"]', 900); await w(4400); await w(4800); await w(4800); await w(5600);
  await A.tap('.stars button:nth-child(5)', 1300); await A.tap('.bar [data-back]', 700); await A.tap('#tabs [data-tab="plans"]', 900); await A.tap('[data-a="plan:plus"]', 900); await A.tap('[data-a="setplan:plus"]', 1500);
  await A.tap('#tabs [data-tab="me"]', 800); await A.tap('[data-a="go:prices"]', 900); await A.scroll(260);
};
K.boot({ id: 'freshfold', tabs: ['home', 'new', 'orders', 'plans', 'me'] });

</script>
</body>
</html>
