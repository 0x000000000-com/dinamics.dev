*{box-sizing:border-box;margin:0}
html{background:var(--bg);transition:background-color .9s ease}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,2.6vh,24px);
  padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));color:var(--ink);font-family:var(--body);
  background:var(--tex),var(--bg);background-attachment:fixed;transition:color .7s ease;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(38% 32% at 50% 40%,rgba(var(--rgb),.26),transparent 70%);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);opacity:.75}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

/* the card: tilt (pointer or phone), a slow float, and a flip to the QR side */
.c3{width:min(88vw,380px,calc((100svh - 110px) * .628));min-width:250px;perspective:1300px}
.tilt{transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.7,.3,1);--gx:30%;--gy:18%}
.float{transform-style:preserve-3d;animation:float 6.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotateX(1.2deg) rotateY(-1.6deg)}}
.card{position:relative;aspect-ratio:54/86;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.75,.25,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
/* in a 3D scene Chrome hit-tests every box by depth: when the float or the tilt turns the card, the wrappers' own flat boxes sit in front of
   part of the face and swallow taps (measured: the style button, the name and the mosaic missed 70 of 70 times). Only the faces take taps. */
.tilt,.float,.card{pointer-events:none}.face{pointer-events:auto}
.face{position:absolute;inset:0;display:flex;flex-direction:column;padding:6%;border-radius:24px;overflow:hidden;isolation:isolate;container-type:inline-size;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;background:linear-gradient(165deg,var(--wash),var(--tile) 62%);
  border:1px solid rgba(var(--rgb),.4);box-shadow:0 60px 110px -48px rgba(0,0,0,.7),0 30px 70px -50px rgba(var(--rgb),.55);transition:background .9s ease,border-color .9s ease}
.face::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;
  background:radial-gradient(55% 38% at var(--gx) var(--gy),rgba(255,255,255,.2),transparent 62%),linear-gradient(115deg,transparent 40%,rgba(255,255,255,.07) 48%,transparent 56%) 0 0/250% 100%;
  mix-blend-mode:soft-light;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,55%{background-position:0 0,130% 0}100%{background-position:0 0,-130% 0}}

/* everything on a face is sized to the card's width (cqi), so a small card is the same card, smaller */
.top{display:flex;align-items:center;gap:9px;gap:3cqi;position:relative;z-index:2}
.mk{width:26px;width:8.8cqi;height:auto;flex:none}
.wm{font:700 12.5px/1 var(--body);font-size:4.25cqi;font-stretch:125%;letter-spacing:.28em;color:var(--ink)}
.sty{margin-left:auto;display:inline-flex;align-items:center;gap:7px;gap:2.4cqi;height:30px;height:10.2cqi;padding:0 3.7cqi 0 2.7cqi;border-radius:999px;border:1px solid rgba(var(--rgb),.45);
  background:rgba(var(--rgb),.08);font:600 12px/1 var(--body);font-size:4.1cqi;font-variant-numeric:tabular-nums;color:var(--co2)}
.sty i{width:12px;height:12px;width:4.1cqi;height:4.1cqi;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(var(--rgb),.7)}
.sty:hover{border-color:var(--co)}
.mos{display:block;width:calc(100% + 8px);margin:5.5cqi -4px 0;aspect-ratio:18/13;touch-action:pan-y}
.who{margin-top:auto;position:relative;z-index:2}
.who.sw .nm,.who.sw .sn{animation:sw .7s ease}
@keyframes sw{0%{filter:blur(7px);opacity:.25;transform:translateY(4px)}100%{filter:none;opacity:1;transform:none}}
.nm{font:var(--nmw) 56px/1 var(--nmf);font-size:17.5cqi;font-synthesis:none;letter-spacing:.02em;white-space:nowrap;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;padding:.04em 0 .08em;width:max-content;max-width:100%}
.ti{margin-top:1.4cqi;font:600 14.5px/1.3 var(--body);font-size:4.9cqi;color:var(--ink);letter-spacing:.01em}
.ti b{font-weight:400;color:var(--ink2)}
.cts{list-style:none;padding:2.6cqi 0 0;margin-top:4.4cqi;border-top:1px solid rgba(var(--rgb),.24)}
.cts a{display:flex;align-items:baseline;gap:3.4cqi;min-height:max(26px,9.4cqi);padding:1.6cqi 0;text-decoration:none;border-radius:6px}
.cts .k{flex:none;width:19cqi;font:500 11px/1.2 var(--body);font-size:3.75cqi;color:var(--ink2);letter-spacing:.02em}
.cts .v{min-width:0;font:600 14px/1.2 var(--body);font-size:max(12px,4.7cqi);color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;transition:color .2s}
.cts a:hover .v{color:var(--co2)}
.sn{margin-top:3.2cqi;font:400 12.5px/1.3 var(--disp);font-size:4.1cqi;color:var(--co2);letter-spacing:.04em;white-space:nowrap;overflow:hidden;min-height:1.3em}

/* back: the QR code on a plate in the style's colours */
.back{transform:rotateY(180deg);align-items:center;justify-content:center;text-align:center}
.bk{display:flex;align-items:center;gap:3cqi}
.bk .mk{width:10cqi}
.tg2{margin-top:3cqi;font:400 13px/1.4 var(--body);font-size:4.4cqi;color:var(--ink2)}
.qr{width:72%;margin-top:7cqi;padding:5%;border-radius:18px;background:linear-gradient(180deg,var(--q0),var(--q1));box-shadow:inset 0 0 0 2px var(--q2),0 20px 40px -20px rgba(0,0,0,.6)}
.qr svg{display:block;width:100%;height:auto;fill:var(--qi)}
.scan{margin-top:6cqi;font:700 17px/1.4 var(--body);font-size:5.8cqi;max-width:15em}
.url{margin-top:2cqi;font:500 13px/1 var(--body);font-size:4.4cqi;color:var(--co2);letter-spacing:.02em}

/* under the card */
.acts{width:min(88vw,380px);min-width:250px;display:grid;gap:10px}
.save{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:16px;background:var(--gold);color:var(--on);font:700 16.5px/1 var(--body);text-decoration:none;
  box-shadow:0 18px 40px -18px rgba(var(--rgb),.85);transition:transform .2s}
.save:active{transform:scale(.98)}
.save svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.small{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 4px}
.sm{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:999px;font:600 13.5px/1 var(--body);color:var(--ink2);text-decoration:none}
.sm:hover{color:var(--ink);background:rgba(var(--rgb),.08)}
.sm svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.foot{font:400 12px/1.5 var(--body);color:var(--ink2);text-align:center;opacity:.85;max-width:min(88vw,380px)}
.foot a{color:var(--co2);text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--bg);
  font:600 14px/1 var(--body);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2.5px solid var(--co);outline-offset:3px;border-radius:10px}
@media (prefers-reduced-motion:reduce){body::before,.float,.face::after{animation:none}.card,.tilt{transition:none}.who.sw .nm,.who.sw .sn{animation:none}}
</style>

      if(t.ring){c.strokeStyle=t.ring;c.lineWidth=n*.08;c.stroke()}}}
  const k=ins?(sh==='diamond'?.46:.6):.66,o=n*(1-k)/2,sc=n*k/100,mk=sh==='outline'?pal[0]:t.mark;c.lineCap='round';
  for(const s of g){const col=s[5]?(ins?(sh==='outline'?t.bg:gr):t.bg):(ins?mk:(t.out||pal[1])),w=s[4]*sc*1.1;
    if(s[0]===s[2]&&s[1]===s[3]){c.fillStyle=col;c.beginPath();c.arc(o+s[0]*sc,o+s[1]*sc,w/2,0,7);c.fill()}
    else{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(o+s[0]*sc,o+s[1]*sc);c.lineTo(o+s[2]*sc,o+s[3]*sc);c.stroke()}}
  return cs}
function sprites(t){return{t,bare:GL.map(g=>sprite(t,g,0,t.t[0])),solid:t.t.map(p=>GL.map(g=>sprite(t,g,1,p)))}}
function tile(i,S,M,sx){const c=i%NC,r=(i/NC)|0,n=ts*dpr,X=Math.round(c*n),Y=Math.round(r*n),Z=Math.round((c+1)*n)-X;x.clearRect(X,Y,Z,Z);if(sx<=.02)return;
  const ins=M[r][c]==='1',img=ins?S.solid[VI[i]%S.solid.length][GI[i]]:S.bare[GI[i]];x.globalAlpha=ins?1:(S.t.light?.36:.26);
  const w=Z*sx;x.drawImage(img,X+(Z-w)/2,Y,w,Z);x.globalAlpha=1}
function all(){for(let i=0;i<N;i++)tile(i,SP,MK,1)}
function loop(now){raf=0;let busy=false;
  for(let i=0;i<N;i++){const s=A[i];if(s<0)continue;const p=(now-s)/AD[i];if(p<0){busy=true;continue}
    if(p>=1){A[i]=-1;tile(i,SP,MK,1);continue}busy=true;const cs=Math.cos(p*Math.PI);
    if(AK[i]===1&&cs>0)tile(i,SO,MO,cs);else tile(i,SP,MK,Math.abs(cs))}
  if(busy)raf=requestAnimationFrame(loop)}
const kick=()=>{if(!raf)raf=requestAnimationFrame(loop)};
let wv=0;
function wave(t,M){SO=SP;MO=MK;SP=sprites(t);MK=M;if(RM.matches||!SO){A.fill(-1);all();return}
  const t0=performance.now()+20,k=wv++%3,cx=(NC-1)/2,cy=(NR-1)/2;
  for(let i=0;i<N;i++){const c=i%NC,r=(i/NC)|0,d=k===0?c*40+r*26:k===1?(NC-1-c)*40+r*26:Math.hypot(c-cx,(r-cy)*1.3)*62;A[i]=t0+d+Math.random()*50;AD[i]=480;AK[i]=1}kick()}
function size(){const w=cv.clientWidth;if(!w)return;dpr=Math.min(2,window.devicePixelRatio||1);ts=w/NC;cv.width=Math.round(w*dpr);cv.height=Math.round(ts*NR*dpr);
  SP=sprites(TS[ti]);SO=null;A.fill(-1);all();fitAll();if(CF)drawFest()}
new ResizeObserver(size).observe(cv);
/* it never sits still: a couple of tiles turn over every moment, and the ones under a finger or the pointer */
setInterval(()=>{if(document.hidden||RM.matches||!SP)return;for(let k=0;k<2;k++){const i=(Math.random()*N)|0;if(A[i]<0){A[i]=performance.now();AD[i]=640;AK[i]=0}}kick()},300);
cv.addEventListener('pointermove',e=>{if(RM.matches||!SP)return;const r=cv.getBoundingClientRect(),c=((e.clientX-r.left)/r.width*NC)|0,rr=((e.clientY-r.top)/r.height*NR)|0;
  for(const[dc,dr]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const cc=c+dc,r2=rr+dr;if(cc<0||cc>=NC||r2<0||r2>=NR)continue;const i=r2*NC+cc;if(A[i]<0){A[i]=performance.now()+(dc||dr?60:0);AD[i]=520;AK[i]=0}}kick()});

/* the styles: one after another, by themselves */
function theme(i){ti=(i+TS.length)%TS.length;const t=TS[ti];font(t);font(TS[(ti+1)%TS.length]);root.dataset.theme=t.id;
  document.querySelector('meta[name=theme-color]').content=t.bg;label();
  const who=$('#who');who.classList.remove('sw');void who.offsetWidth;who.classList.add('sw');if(CF)requestAnimationFrame(drawFest)}
function next(manual){const n=(ti+1)%TS.length;theme(n);shape=shape==='mark'?'word':'mark';wave(TS[n],D.shapes[shape]);if(manual)run()}
function run(){clearInterval(timer);if(!RM.matches&&!flipped)timer=setInterval(()=>{if(!document.hidden)next()},4200)}
$('#sty').addEventListener('click',e=>{e.stopPropagation();next(true)});

/* tilt: the pointer on a computer, the phone's own tilt on a phone (an iPhone asks once, when the card is tapped) */
const tl=$('#tilt');
function tilt(rx,ry){tl.style.transform=`rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;tl.style.setProperty('--gx',(50+ry*3.2).toFixed(1)+'%');tl.style.setProperty('--gy',(28-rx*3.2).toFixed(1)+'%')}
addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||RM.matches)return;const r=tl.getBoundingClientRect(),px=(e.clientX-r.left-r.width/2)/r.width,py=(e.clientY-r.top-r.height/2)/r.height;
  tilt(Math.max(-1,Math.min(1,py))*-11,Math.max(-1,Math.min(1,px))*15)});
document.addEventListener('mouseleave',()=>tilt(0,0));
let gy=false;function gyro(){if(gy)return;gy=true;addEventListener('deviceorientation',e=>{if(e.beta==null||RM.matches)return;
  const b=Math.max(-30,Math.min(30,e.beta-50)),g=Math.max(-30,Math.min(30,e.gamma));tilt(b*-.38,g*.5)},{passive:true})}
const needAsk=window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function';
if(!needAsk)gyro();

/* the QR side: the face turned away is inert, so nothing on it can be tapped or read out */
function flip(v){flipped=v;$('#card').classList.toggle('flip',v);$('#front').inert=v;$('#back').inert=!v;$('#qrBtn span').textContent=W()[v?'front':'qr'];run()}
$('#qrBtn').addEventListener('click',()=>flip(!flipped));
$('#card').addEventListener('click',e=>{if(e.target.closest('button,a'))return;
  if(needAsk&&!gy)DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted')gyro()}).catch(()=>{});
  flip(!flipped)});

/* share */
const toastEl=$('#toast');let tt=0;function toast(s){toastEl.textContent=s;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),2200)}
$('#share').addEventListener('click',async()=>{const w=W();try{if(navigator.share){await navigator.share({title:w.title,url:C.url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(C.url);toast(w.copied)}catch(e){toast(C.url)}});
$('#lang').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';ST.s('dn-card-lang',lang);words()});
RM.addEventListener&&RM.addEventListener('change',run);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)run()});
addEventListener('pageshow',e=>{if(e.persisted)run()});
/* festivals: from a month before Christmas or the Lunar New Year, and around the other big days, the card puts on the home page's
   ornaments by itself, in the colours of each style. ?holiday=<id> shows one now. The script is fetched only then. */
const FEST=D.fest;let CF=null;
const festNow=(()=>{const d=new Date(),k=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();let q=null;try{q=new URLSearchParams(location.search).get('holiday')}catch(e){}
  if(q){const r=FEST.filter(f=>f[0]===q).sort((a,b)=>a[2]-b[2]);if(r.length)return r.find(f=>f[3]>=k)||r[r.length-1]}
  const live=FEST.filter(f=>f[1]<=k&&k<=f[3]);if(!live.length)return null;
  const on=live.filter(f=>f[2]<=k);return on.length?on.sort((a,b)=>b[2]-a[2])[0]:live.sort((a,b)=>a[2]-b[2])[0]})();
function drawFest(){if(!CF||!festNow)return;window.__fest=CF.renderCard(festNow[0],{root,front:$('#front'),top:$('#front .top'),mk:$('#front .mk'),wm:$('#front .wm'),sty:$('#sty'),
  W:innerWidth,H:innerHeight,mob:innerWidth<600,fy:Math.floor(festNow[2]/10000)})}
window.DNCF=api=>{CF=api;drawFest()};
if(festNow){const s=document.createElement('script');s.async=true;s.src='card-fest.js?v=5fb9da6294';document.head.append(s)}
/* ?s=7 starts at the 7th style */
const s0=Math.max(1,Math.min(TS.length,parseInt(new URLSearchParams(location.search).get('s'))||1))-1;
words();theme(s0);shape=s0%2?'word':'mark';MK=D.shapes[shape];font(TS[(s0+1)%TS.length]);run();
})();
</script>
