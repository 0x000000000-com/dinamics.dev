<style>html,body{margin:0;min-height:100%;background:var(--pb,#0A0A0B);transition:background .9s}
body{display:grid;justify-items:center;padding:clamp(20px,6vw,56px) 18px 40px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.ecv{width:min(100%,400px);display:grid;gap:18px;justify-items:center;color:var(--ci,#F2EDE3)}
.ecv-save{width:100%;display:flex;gap:10px;justify-content:center;align-items:center;min-height:60px;border:0;border-radius:18px;background:linear-gradient(180deg,var(--g0),var(--g1) 55%,var(--g2));color:var(--con);font:800 19px/1 inherit;cursor:pointer;box-shadow:0 18px 50px -18px var(--cc)}

.ecv-acts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 20px}

<script>(()=>{const E=window.ECard,I=ICONS,root=document.getElementById('ecv'),d=E.decode(location.hash.slice(1));
const nl=(navigator.language||'').toLowerCase();let lang=(d&&d.l)||(nl.startsWith('zh')?'zh':nl.startsWith('ms')?'ms':'en'),card=null;const base=lang,alt=base==='en'?'zh':'en',LB={zh:'中',en:'EN',ms:'BM'};
const mk=(tag,cls,html)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(html!=null)x.innerHTML=html;return x};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

function draw(){const T=E.W[lang];document.documentElement.lang=lang==='zh'?'zh-CN':lang;
 if(!d){root.innerHTML='<p class="ecv-bad">'+esc(T.bad)+'<br><a href="/free/card">'+esc(T.make)+'</a></p>';return}
 document.title=d.n+(d.c?' · '+d.c:'');if(card)card.stop();
 card=E.el(d,{lang,url:location.href,onStyle:s=>{root.setAttribute('style',E.vars(s));document.documentElement.style.setProperty('--pb',s.bg);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=s.bg}});
 const save=mk('button','ecv-save',I.save+esc(T.save));save.type='button';
 let vtxt=E.vcf(d);E.vcfReady(d).then(v=>{vtxt=v});
 save.onclick=()=>{const b=new Blob([vtxt],{type:'text/vcard;charset=utf-8'}),u=URL.createObjectURL(b),a=mk('a');a.href=u;a.download=(d.n.replace(/[\/:*?"<>|]+/g,' ').trim()||'contact')+'.vcf';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000)};
 const acts=mk('div','ecv-acts');

 if(d.p){const a=mk('a','',I.call+esc(T.call));a.href='tel:'+E.digits(d.p);acts.append(a)}

 root.replaceChildren(card,save,acts,foot)}
