/* the frame every sample app stands on: screens that slide, a bar of tabs, sheets from the bottom, a tour that plays by itself */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--tabh:60px}
html.emb{--sat:44px;--sab:20px}
body{height:100dvh;overflow:hidden;background:var(--out);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
input,textarea{font:inherit;font-size:16px;color:inherit;border:0;background:none;outline:0;min-width:0}
a{color:inherit}
h1,h2,h3,h4,b,strong{font-weight:600}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--focus,currentColor);outline-offset:2px}
[hidden]{display:none!important}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:var(--isw,1.75);stroke-linecap:round;stroke-linejoin:round}
.i.s{width:16px;height:16px}.i.m{width:20px;height:20px}.i.l{width:28px;height:28px}
.i .f{fill:currentColor;stroke:none}

#app{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate}
#stack{position:absolute;inset:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scr>.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.body::-webkit-scrollbar,.hs::-webkit-scrollbar,.sbody::-webkit-scrollbar{display:none}
.scr.tabscr>.body{padding-bottom:calc(var(--tabh) + var(--sab) + 16px)}
.scr.push{z-index:5;transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);box-shadow:-12px 0 32px rgba(0,0,0,.08)}
.scr.push.in{transform:none}
.scr.up{transform:translateY(100%)}
.scr.under{transform:translateX(-22%);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.scr.push>.body{padding-bottom:calc(var(--sab) + 24px)}
.scr>.foot{flex:none;padding:12px 16px calc(var(--sab) + 12px);background:var(--card);border-top:1px solid var(--line)}
.sat{padding-top:var(--sat)}
/* the band behind the phone's clock: a screen gives it a colour with --strip */
.scr::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--sat);z-index:3;pointer-events:none;background:var(--strip,transparent);transition:opacity .2s}
.scr.strip:not(.sc)::before{opacity:0}
.hs{display:flex;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.hs>*{flex:none;scroll-snap-align:start}

#tabs{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;height:calc(var(--tabh) + var(--sab));padding-bottom:var(--sab);background:var(--tabbg,var(--card));border-top:1px solid var(--line)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut);position:relative;min-width:0}
#tabs button[aria-current=page]{color:var(--tabon,var(--ink))}
#tabs .dot{position:absolute;top:8px;left:50%;margin-left:8px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--badge,#D43D2A);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:600}

.sb{position:absolute;left:0;right:0;top:0;height:44px;z-index:30;display:none;align-items:center;justify-content:space-between;padding:8px 28px 0 32px;font:600 15px/1 var(--font);color:var(--sbc,var(--ink));pointer-events:none;transition:color .3s}
html.emb .sb{display:flex}
.sb span{display:flex;gap:8px;align-items:center}
.sb svg{height:12px;width:auto;fill:currentColor}
.homebar{position:absolute;left:50%;bottom:6px;width:128px;height:5px;margin-left:-64px;border-radius:3px;background:var(--ink);opacity:.28;z-index:31;display:none;pointer-events:none}
html.emb .homebar{display:block}

.shade{position:absolute;inset:0;z-index:20;background:rgba(10,14,12,.5);opacity:0;transition:opacity .28s;pointer-events:none}
.shade.in{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:calc(100% - var(--sat) - 16px);display:flex;flex-direction:column;background:var(--card);border-radius:var(--sheetr,24px) var(--sheetr,24px) 0 0;transform:translateY(105%);transition:transform .36s cubic-bezier(.2,.85,.2,1);box-shadow:0 -8px 40px rgba(0,0,0,.16)}
.sheet.in{transform:none}
.sheet .grab{flex:none;height:24px;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet .grab::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--line2,var(--line))}
.sheet .sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 20px calc(var(--sab) + 20px);scrollbar-width:none}
.sheet .sfoot{flex:none;padding:12px 20px calc(var(--sab) + 12px);border-top:1px solid var(--line)}

#toast{position:absolute;left:50%;bottom:calc(var(--tabh) + var(--sab) + 24px);z-index:40;max-width:calc(100% - 48px);transform:translate(-50%,12px);padding:12px 16px;border-radius:12px;background:var(--toastbg,rgba(20,24,22,.94));color:#fff;font-size:14px;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#note{position:absolute;left:8px;right:8px;top:calc(var(--sat) + 4px);z-index:41;display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:20px;background:var(--notebg,rgba(250,250,250,.96));color:#111;box-shadow:0 12px 36px rgba(0,0,0,.22);transform:translateY(calc(-100% - var(--sat) - 24px));visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s .42s;text-align:left}
#note.on{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s}
#note .ni{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--brand);color:var(--onbrand,#fff)}
#note b{display:block;font-size:14px;line-height:1.3}
#note span{display:block;font-size:13px;line-height:1.35;color:#444}
#note small{margin-left:auto;align-self:flex-start;font-size:11px;color:#777;white-space:nowrap}

.finger{position:absolute;left:50%;top:60%;z-index:60;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 12px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.12);pointer-events:none;opacity:0;transition:left .55s cubic-bezier(.3,.7,.2,1),top .55s cubic-bezier(.3,.7,.2,1),opacity .25s,transform .14s}
.finger.on{opacity:1}
.finger.down{transform:scale(.72);background:rgba(255,255,255,.55)}

.outnote{display:none}
@media (min-width:700px){
  html:not(.inframe) body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  html:not(.inframe) #app{flex:none;width:390px;height:min(844px,calc(100dvh - 88px));border-radius:44px;box-shadow:0 0 0 10px #0C0E12,0 0 0 11px rgba(255,255,255,.14),0 40px 80px -24px rgba(0,0,0,.5)}
  html:not(.inframe) .outnote{display:block;font-size:13px;color:var(--outink,rgba(255,255,255,.72));text-align:center}
  html:not(.inframe) .outnote a{text-underline-offset:3px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* parts every sample app is built from. An app sets the look with variables: --disp --card --line --line2 --soft --tint --brand --brand2 --onbrand --hi --ok --ink --mut */
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:-.01em;line-height:1.2}
.pr{font-family:var(--disp);font-weight:600;font-feature-settings:"lnum","tnum";white-space:nowrap}
.art{width:100%;height:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--rb,14px);background:var(--brand);color:var(--onbrand);font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:none;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px;border-radius:12px}
.btn.wide{display:flex;width:100%}
.btn.wide+.btn.wide{margin-top:8px}
.btn.inv{background:var(--hi);color:var(--ink)}
.btn.two{flex-wrap:wrap;gap:0 12px;padding:4px 12px;line-height:1.25}
.btn.two .pr{opacity:.9}
.lk{display:inline-flex;align-items:center;gap:2px;min-width:40px;min-height:40px;font-size:13px;font-weight:600;color:var(--brand2)}
.lk.inv{color:var(--onbrand)}
.ib{position:relative;flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%}
.ib.txt{width:auto;padding:0 12px;font-size:14px;color:var(--mut);border-radius:12px}
.ib.ong{color:var(--onbrand)}
.ib.glass{position:absolute;top:calc(var(--sat) + 8px);z-index:4;background:color-mix(in srgb,var(--card) 90%,transparent);box-shadow:0 2px 10px rgba(20,24,28,.14)}
.ib.glass.l{left:12px}.ib.glass.r{right:12px}
.ib[aria-pressed=true]{color:var(--hot,#C8452C)}
.pip{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--hi);box-shadow:0 0 0 2px var(--bg)}
.ong .pip{box-shadow:0 0 0 2px var(--brand)}
.bar{flex:none;background:var(--card);border-bottom:1px solid var(--line)}
.bar>div{display:flex;align-items:center;height:52px;padding:0 4px}
.bar h1{flex:1;min-width:0;text-align:center;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt{flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:calc(var(--sat) + 12px) 12px 8px 20px;min-height:calc(var(--sat) + 64px)}
.pt h1{font-size:28px;padding-bottom:4px}
.sec{padding:0 16px;margin-top:24px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 12px}
.sech h2{flex:0 1 auto;font-size:19px}
.sech small{flex:1 1 0;min-width:0;font-size:13px;color:var(--mut);text-align:right}
.sl{font:600 13px/1.3 var(--font);letter-spacing:0;color:var(--mut);margin:0 4px 8px}
.card{background:var(--card);border-radius:var(--rc,16px);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 16px;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row>span{flex:1;min-width:0}
.row b{display:block;font-size:15px;line-height:1.35}
.row small{display:block;font-size:13px;color:var(--mut);line-height:1.35}
.row em{font-style:normal;font-size:14px;color:var(--mut);white-space:nowrap}
.row em.ok{color:var(--ok);font-weight:600}
.row>.i:first-child{color:var(--brand2)}
.row>.i.s{color:var(--line2)}
.switch{flex:none;position:relative;width:48px;height:28px;border-radius:14px;background:var(--line2);transition:background .2s}
.switch::before{content:"";position:absolute;inset:-8px -4px}
.switch i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked=true]{background:var(--brand)}
.switch[aria-checked=true] i{transform:translateX(20px)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:12px;background:var(--soft);color:var(--mut);font:600 12px var(--font);font-style:normal;white-space:nowrap}
.chip.on{background:var(--tint);color:var(--brand)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:56px 32px}
.empty .art{width:144px;height:144px}
.empty>.i{width:48px;height:48px;color:var(--line2)}
.empty h2{font-size:20px}
.empty p{color:var(--mut);font-size:14px;margin-bottom:12px}
.empty.sm{padding:32px 16px}
.pad{padding:8px 16px 0}
.qty{flex:none;display:flex;align-items:center;height:48px;border-radius:14px;background:var(--soft)}
.qty button{display:grid;place-items:center;width:44px;height:48px;color:var(--brand)}
.qty button:disabled{opacity:.3}
.qty b{min-width:24px;text-align:center;font:600 17px var(--disp)}
.qty.sm{height:36px;border-radius:10px;margin-top:8px}
.qty.sm button{width:36px;height:36px}
.qty.sm b{min-width:20px;font-size:15px}
.addm{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--onbrand)}
.seg{display:flex;padding:4px;border-radius:12px;background:var(--soft)}
.seg button{flex:1;min-width:0;min-height:38px;padding:0 2px;border-radius:9px;font-size:clamp(12px,3.6vw,14px);font-weight:600;color:var(--mut);text-align:center}
.seg button[aria-pressed=true]{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(20,24,28,.12)}
.livebar{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:12px 16px 0;padding:12px 12px 12px 16px;border-radius:16px;background:var(--brand);color:var(--onbrand)}
.livebar span{flex:1;min-width:0}
.livebar b{display:block;font-size:14px}
.livebar small{display:block;font-size:12px;opacity:.76}
.pulse{flex:none;width:10px;height:10px;border-radius:50%;background:var(--hi);animation:pulse 1.6s infinite}
.thumbs{display:flex}
.sum{padding:4px 4px 0}
.sum p{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 0;font-size:14px;color:var(--mut)}
.sum p b{color:var(--ink);font-family:var(--disp)}
.sum .off b{color:var(--ok)}
.sum .tot{margin-top:8px;padding-top:12px;border-top:1px dashed var(--line2);font-size:16px;font-weight:600;color:var(--ink)}
.sum .tot b{font-size:22px}
.sum .tot small{margin-left:8px;font-weight:400;font-size:12px;color:var(--mut)}
.sum .earn{justify-content:flex-start;gap:8px;font-size:13px;color:var(--brand2)}
.pfoot{display:flex;align-items:center;gap:16px}
.pfoot>div{flex:none;min-width:84px}
.pfoot small{display:block;font-size:12px;color:var(--mut)}
.pfoot b{font:600 24px/1.1 var(--disp)}
.pfoot .btn{flex:1}
.sh{font-size:20px;margin:4px 0 16px}
.hint{margin-top:12px;font-size:13px;color:var(--mut);text-align:center}
.hint.l{text-align:left;margin:-8px 0 12px}
.plist{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line2)}
[aria-pressed=true]>.radio,.radio.on{border:7px solid var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{flex:1 1 72px;min-height:48px;padding:0 12px;border-radius:12px;background:var(--soft);font-size:15px;text-align:center;white-space:nowrap}
.paying{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 20px 48px!important;text-align:center}
.paying h2{font-size:20px}
.paying p{color:var(--mut);font-family:var(--disp)}
.spin{width:44px;height:44px;margin-bottom:8px;border-radius:50%;border:4px solid var(--tint);border-top-color:var(--brand);animation:spin .8s linear infinite}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.amts button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72px;border-radius:14px;background:var(--soft)}
.amts b{font:600 20px var(--disp)}
.amts small{font-size:11px;color:var(--mut)}
.wl{list-style:none;padding:0;margin:0}
.wl li{display:flex;align-items:center;gap:12px;padding:12px 0}
.wl li+li{border-top:1px solid var(--line)}
.wl i{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--mut)}
.wl i.in{background:var(--tint);color:var(--brand)}
.wl span{flex:1;min-width:0}
.wl span b{display:block;font-size:15px}
.wl small{font-size:12px;color:var(--mut)}
.wl li>b{font-family:var(--disp)}
.wl b.in{color:var(--ok)}
.codes{text-align:center}
.codes .sh{text-align:left}
.qrc{margin:0 auto;border-radius:12px;border:1px solid var(--line)}
.codes .big{margin-top:12px;font:600 28px var(--disp);letter-spacing:.04em}
.cbal{display:flex;justify-content:center;gap:28px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.cbal span{display:inline-flex;align-items:center;gap:8px;font:600 16px var(--disp);color:var(--brand)}
.rds{display:flex;flex-direction:column;align-items:center;text-align:center}
.rds h2{margin-top:16px;font-size:22px}
.rds p{margin:8px 0 20px;font-size:14px;color:var(--mut)}
.steps{list-style:none;margin:0;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.steps li{position:relative;display:flex;align-items:center;gap:12px;min-height:40px;color:var(--mut)}
.steps li>i{position:relative;z-index:1;flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);background:var(--card)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:9px;top:30px;width:2px;height:20px;background:var(--line2)}
.steps li.done>i{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.steps li.done::after{background:var(--brand)}
.steps li.now{color:var(--ink)}
.steps li.now>i{border-color:var(--hi);box-shadow:0 0 0 4px color-mix(in srgb,var(--hi) 30%,transparent)}
.steps li.now>i:not(:empty){background:var(--hi);color:var(--ink);box-shadow:none}
.steps li>i .i{width:12px;height:12px;stroke-width:3}
.steps b{flex:1;font-size:15px}
.steps small{font-size:13px}
.tact{display:flex;gap:8px;padding:0 16px 16px}
.tact .btn{flex:1}
.ocard{display:block;width:100%;padding:16px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left}
.ocard+.ocard{margin-top:12px}
.oh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.oh b{font-size:15px}
.oh small{display:block;margin-top:2px;font-size:12px;color:var(--mut)}
.of{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.of>b{font:600 18px var(--disp)}
.of span{display:flex;gap:8px}
.othumbs{display:flex;align-items:center;margin-top:12px}
.othumbs p{flex:1;min-width:0;margin-left:12px;font-size:13px;line-height:1.4;color:var(--mut)}
.omap{height:236px;overflow:hidden;border-bottom:1px solid var(--line)}
.citymap{width:100%;height:100%}
.olist{padding:12px 16px 0}
.orow{display:flex;align-items:center;gap:12px;width:100%;padding:16px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left}
.orow+.orow{margin-top:8px}
.orow.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.orow>span:first-child{flex:1;min-width:0}
.orow b{display:block;font:600 16px/1.3 var(--disp)}
.orow small{display:block;margin-top:2px;font-size:12px;color:var(--mut)}
.okm{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.okm b{font-size:14px}
.nrow{display:flex;gap:12px;padding:16px 0}
.nrow+.nrow{border-top:1px solid var(--line)}
.nrow>i{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--mut)}
.nrow.new>i{background:var(--brand);color:var(--onbrand)}
.nrow b{display:block;font-size:15px;line-height:1.35}
.nrow.new b::after{content:"";display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;background:var(--hi);vertical-align:middle}
.nrow small{display:block;margin-top:2px;font-size:13px;color:var(--mut)}
.nrow em{display:block;margin-top:4px;font-style:normal;font-size:12px;color:var(--mut)}
.faq{border-bottom:1px solid var(--line)}
.faq summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;font-size:15px;font-weight:600;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary .i{color:var(--mut);transition:transform .2s}
.faq[open] summary .i{transform:rotate(180deg)}
.faq p{padding-bottom:16px;font-size:14px;color:var(--mut)}
.pad>.btn{margin-top:20px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 70%,transparent)}70%,100%{box-shadow:0 0 0 10px transparent}}
@keyframes spin{to{transform:rotate(360deg)}}

/* 毛孩 Pawsome: bath day. Peach milk, tangerine and cocoa; everything round; a foam edge under the header and paw stamps are the marks that repeat. */
:root{--font:"PW Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;--disp:var(--font);
  --bg:#FFF6EE;--card:#FFFFFF;--ink:#33241D;--mut:#75625A;--line:#F4E4D7;--line2:#E3CCBA;--soft:#FBEADD;--tint:#FFE6D6;
  --brand:#FF7B3A;--brand2:#B4420E;--onbrand:#33241D;--hi:#FFC533;--ok:#157A55;--hot:#D93A44;--out:#2B1E18;--focus:#B4420E;--tabon:#B4420E;--badge:#D93A44;--rb:999px;--rc:24px;--sheetr:32px;--isw:1.9}
h1,h2,h3{letter-spacing:0}
.btn{font-size:16px}
.btn:disabled{opacity:.35}
.btn.sm{border-radius:999px}
.btn.ghost,.chip.on,.cbal span{color:var(--brand2)}
.seg{border-radius:18px;padding:4px}
.seg button{min-height:44px;border-radius:14px}
.seg button[aria-pressed=true]{color:var(--ink)}
.bar{background:var(--bg);border-bottom:0}
.pt h1{font-size:30px}
.plist{border-radius:24px}
.steps{border-radius:24px}
.chip .i{margin-right:4px}
.chip.warn{background:#FFE1E1;color:#A8242D}
.sec.first{margin-top:4px}
.padc{padding:16px 16px}
.pad>.tk{margin-top:8px}
.pad>.sum{margin:12px 0}
.pad>.btn:first-of-type{margin-top:12px}
.tact.two{padding:12px 0 0}
#tabs{border-top:0;box-shadow:0 -1px 0 var(--line)}
.ptile{display:block;flex:none;width:64px;height:64px;border-radius:22px;overflow:hidden}
.ptile.sm{width:48px;height:48px;border-radius:16px}
.ptile.lg{width:120px;height:120px;border-radius:38px}
.ptile .art,.face .art{display:block}
.face{display:block;flex:none;width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--tint)}
.face.lg{width:96px;height:96px}
.face.any{display:grid;place-items:center;color:var(--brand2)}
.rt{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;vertical-align:middle}
.rt .i{color:#F2A400}
.ri{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:var(--tint);color:var(--brand2);font-style:normal}
.ri.late,.ri.warn{background:#FFE1E1;color:#B3262F}

/* home */
.tabscr[data-s=home]{--strip:#FFDCC6}
.scr[data-s=pet],.scr[data-s=visit],.scr[data-s=ticket]{--strip:var(--bg)}
.hd{--s:12px;position:relative;background:#FFDCC6;padding:calc(var(--sat) + 8px) 0 calc(var(--s) + 20px);
  -webkit-mask:radial-gradient(var(--s) at 50% calc(100% - var(--s)),#000 98%,#0000 102%) 50% 0/calc(2*var(--s)) 100%,linear-gradient(#000 0 0) 0 0/100% calc(100% - var(--s)) no-repeat;
  mask:radial-gradient(var(--s) at 50% calc(100% - var(--s)),#000 98%,#0000 102%) 50% 0/calc(2*var(--s)) 100%,linear-gradient(#000 0 0) 0 0/100% calc(100% - var(--s)) no-repeat}
.hdrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:0 12px 0 20px}
.hello{min-width:0}
.hello small{display:flex;align-items:center;gap:4px;min-height:24px;font-size:13px;color:#7A4526}
.hello h1{margin-top:2px;font-size:30px;text-wrap:balance}
.hd .pip{box-shadow:0 0 0 2px #FFDCC6;background:var(--hot)}
.petsrow{gap:16px;padding:16px 20px 0;scroll-padding:0 20px}
.pchip{display:flex;flex-direction:column;align-items:center;gap:8px;width:68px}
.pchip .ptile{box-shadow:0 0 0 3px #fff}
.pchip b{max-width:72px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.add .ptile{display:grid;place-items:center;background:rgba(255,255,255,.55);color:var(--brand2);box-shadow:inset 0 0 0 2px rgba(180,66,14,.3)}
.up{display:flex;flex-direction:column;gap:12px;padding:0 16px;margin-top:12px}
.livec{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:24px;background:var(--ink);color:#fff;text-align:left}
.livec>span:not(.ptile){flex:1;min-width:0}
.livec small{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.84}
.livec b{display:block;font-size:18px;line-height:1.25}
.livec em{font-style:normal;font-size:13px;color:var(--hi)}
.livec>.i{color:rgba(255,255,255,.5)}
.nextc,.vcard{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:24px;background:var(--card);border:1px solid var(--line);text-align:left}
.vcard+.vcard{margin-top:12px}
.dt{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:56px;border-radius:16px;background:var(--tint);color:var(--brand2)}
.dt b{font-size:22px;line-height:1}
.dt small{font-size:11px}
.nx,.vcard>span:not(.ptile){flex:1;min-width:0}
.nx b,.vcard b{display:block;font-size:15px;line-height:1.3}
.nx small,.vcard small{font-size:13px;color:var(--mut)}
.svgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc{display:flex;flex-direction:column;align-items:flex-start;min-height:132px;padding:16px;border-radius:24px;text-align:left}
.svc i{display:grid;place-items:center;width:48px;height:48px;margin-bottom:auto;border-radius:16px;background:rgba(255,255,255,.72)}
.svc b{margin-top:12px;font-size:17px;line-height:1.2}
.svc small{margin-top:2px;font-size:12px;color:#5A463B}
.punch{padding:16px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.punch .sech{margin:0 0 16px}
.paws{display:grid;grid-template-columns:repeat(5,44px);justify-content:space-between;gap:12px 0}
.paws i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px dashed var(--line2);color:var(--line2)}
.paws i.on{border:0;background:var(--brand);color:var(--ink)}
.paws i.gift{border-color:var(--hi);color:#A87500}
.paws i.gift.on{background:var(--hi);color:var(--ink)}
.pros{gap:12px;margin:0 -16px;padding:0 16px;scroll-padding:0 16px}
.proc{display:flex;flex-direction:column;align-items:center;gap:4px;width:108px;padding:16px 8px;border-radius:24px;background:var(--card);border:1px solid var(--line);text-align:center}
.proc .face{width:56px;height:56px;margin-bottom:4px}
.proc b{font-size:15px}
.proc small{font-size:11px;color:var(--mut)}
.prosh{text-align:center}
.prosh .face{margin:4px auto 12px}
.prosh h2{font-size:24px}
.prosh p{margin:8px 0 0;font-size:14px;color:var(--mut)}
.prosh .btn{margin-top:20px}

/* services and prices */
.hint.l2{text-align:left;margin:8px 4px 0}
.slist{margin-top:16px}
.srow{position:relative;display:grid;grid-template-columns:56px 1fr;gap:12px;padding:16px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.srow+.srow{margin-top:12px}
.srow>i{display:grid;place-items:center;width:56px;height:56px;border-radius:18px}
.srow h3{font-size:17px}
.srow p{margin-top:2px;font-size:13px;line-height:1.4;color:var(--mut)}
.srow span{display:flex;align-items:baseline;gap:8px;margin-top:12px;min-height:40px}
.srow .pr{font-size:20px}
.srow small{font-size:12px;color:var(--mut)}
.srow .btn{position:absolute;right:14px;bottom:14px}
.row>em.pr{color:var(--ink);font-size:15px}
.smap{height:132px}
.smap .citymap{display:block;width:100%;height:100%}

/* booking */
.fprog{display:flex;gap:4px;padding:0 16px 12px}
.fprog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.fprog i.on{background:var(--brand)}
.ib.num{width:auto;padding:0 16px;font-style:normal;font-size:13px;font-weight:600;color:var(--mut)}
.fbody{padding:12px 16px 24px}
.fbody>.card{margin-bottom:12px}
.fq{margin:4px 4px 16px;font-size:24px;text-wrap:balance}
.fh{margin:20px 4px 12px;font-size:15px}
.pcards,.scards,.gcards{display:flex;flex-direction:column;gap:12px}
.pcard,.scard,.gcard{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:24px;background:var(--card);border:2px solid var(--line);text-align:left;transition:border-color .15s,background .15s}
.pcard[aria-pressed=true],.scard[aria-pressed=true],.gcard[aria-pressed=true],.addl button[aria-pressed=true],.modes button[aria-pressed=true]{border-color:var(--brand);background:#FFF8F3}
.pcard>span:not(.ptile),.scard>span,.gcard>span:not(.face){flex:1;min-width:0}
.pcard b,.scard b,.gcard b{display:block;font-size:17px;line-height:1.25}
.pcard small,.scard small,.gcard small{display:block;font-size:13px;line-height:1.35;color:var(--mut)}
.pcard.dash{border-style:dashed;border-color:var(--line2);background:none}
.pcard.dash .ptile,.petc.dash .ptile{display:grid;place-items:center;background:var(--tint);color:var(--brand2)}
.scard>i:first-child{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:18px;font-style:normal}
.scard em{display:block;margin-top:4px;font-style:normal;font-size:13px;color:var(--mut)}
.scard em b{display:inline;font-size:16px;color:var(--ink)}
.addl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addl button{display:flex;align-items:center;gap:8px;min-height:56px;min-width:0;padding:8px 12px;border-radius:18px;background:var(--card);border:2px solid var(--line);text-align:left}
.addl .i{color:var(--brand2)}
.addl span{flex:1;min-width:0;font-size:14px;line-height:1.2}
.addl small{font-size:12px;color:var(--mut)}
.days{gap:8px;margin:0 -16px;padding:0 16px;scroll-padding:0 16px}
.dayb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:58px;height:70px;border-radius:20px;background:var(--card);border:2px solid var(--line)}
.dayb small{font-size:12px;color:var(--mut)}
.dayb b{font-size:20px;line-height:1.1}
.dayb[aria-pressed=true],.slots button[aria-pressed=true]{background:var(--brand);border-color:var(--brand)}
.dayb[aria-pressed=true] small{color:var(--ink)}
.fday{margin:16px 4px 12px;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots button{min-height:48px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:15px;font-weight:500;text-align:center}
.slots button:disabled{opacity:.38;text-decoration:line-through;background:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.modes button{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:16px;border-radius:24px;background:var(--card);border:2px solid var(--line);text-align:left}
.modes .i{margin-bottom:12px;color:var(--brand2)}
.modes b{font-size:16px;line-height:1.25}
.modes small{margin-top:2px;font-size:12px;line-height:1.35;color:var(--mut)}
.fld{display:block;margin:16px 0}
.fld>span{display:block;margin:0 4px 8px;font-size:14px;font-weight:600}
.fld input{width:100%;height:52px;padding:0 16px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.fld input:focus{border-color:var(--brand)}
.fld input::placeholder,.cin input::placeholder{color:var(--mut);opacity:1}
.fsum{padding:16px 16px}
.fsh{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding-bottom:12px;border-bottom:1px dashed var(--line2)}
.fsh b{display:block;font-size:15px}
.fsh small{font-size:13px;color:var(--mut)}
.fsum .sum{padding:0}

/* the ticket */
.tk{position:relative;border-radius:28px;background:var(--card);border:1px solid var(--line);overflow:hidden;text-align:left}
.tkh{display:flex;align-items:center;gap:8px;padding:8px 16px 0 8px}
.tkh .art{flex:none;width:92px;height:92px}
.tkh span{min-width:0}
.tkh small{font-size:12px;font-weight:500;letter-spacing:.04em;color:#6B5548}
.tkh b{display:block;font-size:24px;line-height:1.15}
.tkh em{font-style:normal;font-size:13px;color:#5A463B}
.tkb{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0;padding:16px}
.tkb dt{font-size:12px;color:var(--mut)}
.tkb dd{margin:0;font-size:16px;font-weight:600}
.tkq{position:relative;padding:16px;border-top:2px dashed var(--line2);text-align:center}
.tkq::before,.tkq::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.tkq::before{left:-11px}.tkq::after{right:-11px}
.tkq p{margin-top:8px;font-size:13px;color:var(--mut)}
.tkscr{padding:calc(var(--sat) + 28px) 20px 24px!important;text-align:center}
.okmark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--ok);color:#fff;animation:pop .4s cubic-bezier(.3,1.4,.5,1)}
.tkscr h1{font-size:28px}
.tks{margin:8px 0 20px;color:var(--mut);text-wrap:balance}
.tkscr .tk{margin-bottom:20px}

/* a visit as it happens */
.vhero{position:relative;display:grid;place-items:end center;height:calc(var(--sat) + 292px);overflow:hidden}
.vbar{position:absolute;left:8px;right:8px;top:calc(var(--sat) + 4px);z-index:2;display:flex;align-items:center;justify-content:space-between}
.vbar span{font-size:13px;font-weight:500;letter-spacing:.04em;color:#6B5548}
.glassb{background:rgba(255,255,255,.82)}
.vart{width:264px;height:264px;margin-bottom:-12px}
.vart .art{animation:pop .4s cubic-bezier(.3,1.3,.5,1)}
.vsheet{position:relative;margin-top:-28px;padding:24px 16px 8px;border-radius:32px 32px 0 0;background:var(--bg)}
.vsheet h1{padding:0 4px;font-size:26px}
.veta{margin:4px 4px 16px;color:var(--mut)}
.vprog{display:flex;gap:8px;margin:0 4px 16px}
.vprog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.vprog i.done{background:var(--brand)}
.vprog i.now{background:var(--hi);animation:glow 1.4s ease-in-out infinite}
.gline{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0;padding:12px;border-radius:24px;background:var(--card);border:1px solid var(--line);text-align:left}
.gline>span:not(.face){flex:1;min-width:0}
.gline b{display:block;font-size:15px}
.gline small{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}
.ch .face{width:36px;height:36px}
.ch span{font-size:16px;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ch small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.msgs{display:flex;flex-direction:column;gap:12px;padding:12px 16px 16px!important}
.msg{display:flex;flex-direction:column;max-width:80%}
.msg p{padding:12px 16px;border-radius:20px;font-size:15px;line-height:1.4}
.msg.pro{align-self:flex-start;align-items:flex-start}
.msg.pro p{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;align-items:flex-end;animation:pop .25s}
.msg.me p{background:var(--brand);border-bottom-right-radius:6px}
.msg small{margin:4px 8px 0;font-size:11px;color:var(--mut)}
.photo{display:block;width:176px;height:176px;border-radius:22px;border:3px solid #fff;box-shadow:0 2px 10px rgba(51,36,29,.14);overflow:hidden}
.cfoot{padding:12px 0 calc(var(--sab) + 12px)!important}
.quick{gap:8px;padding:0 12px 12px;scroll-padding:0 12px}
.quick button{min-height:40px;padding:0 16px;border-radius:20px;background:var(--tint);color:var(--brand2);font-size:13px;font-weight:600;white-space:nowrap}
.cin{display:flex;align-items:center;gap:8px;padding:0 12px}
.cin input{flex:1;height:44px;padding:0 16px;border-radius:22px;background:var(--soft)}
.send{background:var(--brand)}

/* the report */
.ba{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px;padding:16px 12px;border-radius:28px}
.ba span{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ba .art{width:128px;height:128px;max-width:100%}
.ba small{padding:2px 12px;border-radius:10px;background:rgba(255,255,255,.72);font-size:12px;font-weight:600}
.ba>.i{flex:none;color:#6B5548}
.rh{margin:20px 4px 4px;font-size:24px}
.rs{margin:0 4px 16px;font-size:14px;color:var(--mut)}
.gnote{display:flex;gap:12px;margin:12px 0}
.gnote>div{flex:1;min-width:0;padding:12px 16px;border-radius:6px 20px 20px 20px;background:var(--tint)}
.gnote b{font-size:13px}
.gnote p{margin-top:2px;font-size:14px;line-height:1.5}
.rate{padding:16px;text-align:center}
.rate h3{font-size:17px}
.stars{display:flex;justify-content:center;gap:2px;margin-top:8px}
.stars button{display:grid;place-items:center;width:48px;height:48px;color:var(--line2)}
.stars button[aria-pressed=true]{color:#F2A400}
.nextv{display:flex;align-items:center;gap:12px;margin-top:12px;padding:16px 16px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.nextv span{flex:1;min-width:0}
.nextv b{display:block;font-size:15px}
.nextv small{font-size:13px;color:var(--mut)}

/* the pets */
.petc{display:flex;align-items:center;gap:16px;width:100%;padding:16px;border-radius:28px;background:var(--card);border:1px solid var(--line);text-align:left}
.petc+.petc{margin-top:12px}
.petc .ptile{width:88px;height:88px;border-radius:28px}
.petc>span:not(.ptile){flex:1;min-width:0}
.petc b{display:block;font-size:22px;line-height:1.2}
.petc small{display:block;font-size:13px;color:var(--mut)}
.petc .chip{margin-top:8px}
.petc>.i{color:var(--line2)}
.petc.dash{border:2px dashed var(--line2);background:none}
.petc.dash b{font-size:17px}
.phero{position:relative;padding:calc(var(--sat) + 8px) 16px 44px;text-align:center}
.phero .glassb{position:absolute;left:8px;top:calc(var(--sat) + 4px)}
.pav{width:176px;height:176px;margin:0 auto}
.phero h1{margin-top:-4px;font-size:32px}
.phero p{color:#5A463B}
.pfacts{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:-28px 16px 0;padding:12px 4px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 20px -14px rgba(51,36,29,.4)}
.pfacts span{min-width:0;text-align:center}
.pfacts span+span{border-left:1px solid var(--line)}
.pfacts b{display:block;font-size:16px}
.pfacts small{font-size:11px;color:var(--mut)}
.wchart{display:block;width:100%;height:auto}
.wchart text{font:11px var(--font);fill:var(--mut)}
.wchart text.v{font-size:13px;font-weight:600;fill:var(--ink)}
.pnote{display:flex;align-items:flex-start;gap:12px}
.pnote .i{flex:none;color:var(--brand2)}
.pnote p{font-size:14px;line-height:1.5}
.prev{display:flex;flex-direction:column;align-items:center;padding:8px 16px 16px}
.prev .pav{width:168px;height:168px}
.prev .art{animation:pop .3s cubic-bezier(.3,1.3,.5,1)}
.prev b{min-height:28px;font-size:22px}
.form{padding:0 16px 16px}
.sws{display:flex;flex-wrap:wrap;gap:12px;padding:2px 4px}
.sws button{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(51,36,29,.14);color:var(--mut)}
.sws button[aria-pressed=true]{box-shadow:inset 0 0 0 2px rgba(51,36,29,.14),0 0 0 3px var(--bg),0 0 0 6px var(--brand)}

/* account */
.prof{display:flex;align-items:center;gap:12px;margin:4px 16px 0}
.av{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--brand);font-style:normal;font-size:24px;font-weight:600}
.prof b{display:block;font-size:20px;line-height:1.2}
.prof small{font-size:13px;color:var(--mut)}
.club{margin:16px 16px 0;padding:16px;border-radius:28px;background:var(--ink);color:#fff}
.club>span{display:flex;align-items:baseline;justify-content:space-between}
.club small{font-size:13px;opacity:.84}
.club b{font-size:32px;line-height:1;color:var(--hi)}
.club em{font-style:normal;font-size:16px;color:#fff;opacity:.7}
.club .paws{margin:16px 0 12px}
.club .paws i{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.3)}
.club .paws i.on{color:var(--ink)}
.club .paws i.gift{border-color:var(--hi);color:var(--hi)}
.club p{font-size:13px;opacity:.88}
.mlistc{margin:12px 16px 0}
.ver{margin:20px 0 8px;text-align:center;font-size:12px;color:var(--mut)}
.vch{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:16px;border-radius:20px;background:var(--tint)}
.vch .i{color:var(--brand2)}
.vch b{display:block;font-size:15px}
.vch small{font-size:12px;color:#6B5548}
.about{text-align:center}
.about .ptile{margin:8px auto 12px}
.about h2{font-size:24px}
.about p{margin:8px 0 20px;font-size:14px;color:var(--mut)}
@keyframes pop{from{transform:scale(.92);opacity:.5}}
@keyframes glow{50%{opacity:.45}}

</style>

/* ---------- pictures: every pet is drawn from how it was described (kind, coat, ears, bandana), and redrawn while it is groomed ---------- */
const INK = '#2E2226';
const sv = (inner, cls) => `<svg class="art${cls ? ' ' + cls : ''}" viewBox="0 0 120 120" aria-hidden="true">${inner}</svg>`;
const flip = s => s + `<g transform="translate(120 0) scale(-1 1)">${s}</g>`;
const STAR4 = (x, y, r, c) => `<path transform="translate(${x} ${y}) scale(${r})" d="M0-5C.6-1.600 1.600-.6 5 0 1.600.6.6 1.600 0 5-.6 1.600-1.600.6-5 0-1.600-.6-.6-1.600 0-5z" fill="${c}"/>`;
const BUB = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" fill-opacity=".7" stroke="#9CC7F0" stroke-width="1.200"/><path d="M${x - r * .45} ${y - r * .2}a${r * .5} ${r * .5} 0 0 1 ${r * .4}-${r * .4}" fill="none" stroke="#fff" stroke-width="1.200" stroke-linecap="round"/>`;
/* p: {sp, fur, fur2, ears, band, mark}; st: '' | mess | bath | dry | trim | done */
function petArt(p, st, cls) {
  const f = FURS[p.fur] || p.fur, dk = mix(f, '#3A2418', .26), lt = p.fur2 ? (FURS[p.fur2] || p.fur2) : mix(f, '#FFFFFF', .62), band = BANDS[p.band], cat = p.sp === 'cat', wet = st === 'bath';
  const eye = (x) => cat ? `<ellipse cx="${x}" cy="60" rx="4.400" ry="5.400" fill="${INK}"/><circle cx="${x + 1.400}" cy="58" r="1.500" fill="#fff"/>` : `<circle cx="${x}" cy="58" r="4.200" fill="${INK}"/><circle cx="${x + 1.400}" cy="56.500" r="1.400" fill="#fff"/>`;
  const closed = (x) => `<path d="M${x - 4.500} 59c2.500 3 6.500 3 9 0" fill="none" stroke="${INK}" stroke-width="2.200" stroke-linecap="round"/>`;
  let ears;
  if (cat) ears = flip(`<path d="M27 54 24 20c11 3 21 10 26 20z" fill="${f}"/><path d="M30 46 29 28c6 2 11 6 14 11z" fill="#F4B7B0"/>`);
  else if (p.ears === 'point') ears = flip(`<path d="M30 50 27 18c11 2 20 10 24 21z" fill="${f}"/><path d="M33 43 32 26c6 2 10 6 13 11z" fill="${lt}"/>`);
  else ears = flip(`<path d="M32 40c-14 0-19 18-14 34 3 9 12 8 15-1 3-10 5-22 11-30z" fill="${dk}"/>`);
  const head = cat ? `<ellipse cx="60" cy="62" rx="34" ry="29" fill="${f}"/>` : `<ellipse cx="60" cy="62" rx="32" ry="30" fill="${f}"/>`;
  const marks = cat ? (p.mark ? `<path d="M52 35v8M60 33v10M68 35v8" stroke="${dk}" stroke-width="3.200" stroke-linecap="round"/><path d="M27 62h7M27 69h6M93 62h-7M93 69h-6" stroke="${dk}" stroke-width="2.600" stroke-linecap="round"/>` : '')
    : (p.mark ? `<ellipse cx="45" cy="56" rx="12" ry="13" fill="${dk}"/>` : '');
  const muzzle = cat ? (p.fur2 ? `<path d="M43 73c5-7 29-7 34 0-2 11-11 17-17 17s-15-6-17-17z" fill="${lt}"/>` : '') : `<ellipse cx="60" cy="74" rx="17" ry="13.500" fill="${lt}"/>`;
  const brow = !cat && p.ears === 'point' ? `<circle cx="47" cy="48.500" r="2.600" fill="${lt}"/><circle cx="73" cy="48.500" r="2.600" fill="${lt}"/>` : '';
  const nose = cat ? `<path d="M56.500 68.500h7l-3.500 4z" fill="#E77F91"/><path d="M60 72.500c-1.600 3.600-6 3.600-7.600 1M60 72.500c1.600 3.600 6 3.600 7.600 1" fill="none" stroke="${INK}" stroke-width="1.700" stroke-linecap="round"/><path d="M38 70l-13-3M38 74.500l-13 2M82 70l13-3M82 74.500l13 2" stroke="${INK}" stroke-opacity=".4" stroke-width="1.200" stroke-linecap="round"/>`
    : `<path d="M54 66.500h12c1.400 0 2.200 1.200 1.600 2.600-1.500 3.600-5 5.600-7.600 5.600s-6.100-2-7.600-5.600c-.6-1.400.2-2.600 1.600-2.600z" fill="${INK}"/><path d="M60 74.700v3.600c-2 4-7.600 4-9.600.6M60 78.300c2 4 7.600 4 9.600.6" fill="none" stroke="${INK}" stroke-width="1.800" stroke-linecap="round"/>${st === 'done' || !st ? '<path d="M56.300 80.600c.3 6.400 7.100 6.400 7.400 0z" fill="#F2849E"/>' : ''}`;
  const blush = flip('<ellipse cx="37" cy="70" rx="5" ry="3.200" fill="#F59C93" opacity=".5"/>');
  const body = `<path d="M26 122c0-20 14-31 34-31s34 11 34 31z" fill="${f}"/>` + (band ? `<path d="M33 90c17 9 37 9 54 0l-5 10c-13 7-31 7-44 0z" fill="${band}"/><path d="M51 100l9 15 9-15c-6 2-12 2-18 0z" fill="${band}"/><circle cx="60" cy="105" r="1.500" fill="#fff" opacity=".85"/><circle cx="54" cy="97" r="1.200" fill="#fff" opacity=".85"/><circle cx="66" cy="97" r="1.200" fill="#fff" opacity=".85"/>` : '');
  let extra = '';
  if (st === 'bath') extra = `<g fill="#fff" stroke="#BBD9F5" stroke-width="1.200"><circle cx="46" cy="33" r="9"/><circle cx="60" cy="28" r="11"/><circle cx="74" cy="33" r="9"/><circle cx="53" cy="38" r="7"/><circle cx="67" cy="38" r="7"/></g>${BUB(16, 34, 7)}${BUB(102, 26, 5)}${BUB(106, 58, 8)}${BUB(12, 78, 5)}${BUB(96, 96, 6)}<path d="M-2 122c8-14 20-12 28-6s18 6 26 0 20-8 30-2 22 4 40-8v18H-2z" fill="#fff" stroke="#BBD9F5" stroke-width="1.200"/>`;
  if (st === 'dry') extra = `<g fill="none" stroke="#8FC0EE" stroke-width="2.600" stroke-linecap="round"><path d="M2 44c6-3 10 3 16 0"/><path d="M0 60c6-3 10 3 16 0"/><path d="M4 76c6-3 10 3 16 0"/></g>${STAR4(100, 30, 1.300, '#FFC533')}${STAR4(108, 70, .9, '#FFC533')}`;
  if (st === 'trim') extra = `<g transform="translate(92 22) rotate(28)" fill="none" stroke="${INK}" stroke-width="2.200" stroke-linecap="round"><circle cx="-5" cy="8" r="4"/><circle cx="5" cy="8" r="4"/><path d="M-3 4.500 5-10M3 4.500-5-10"/></g><g stroke="${dk}" stroke-width="2" stroke-linecap="round"><path d="M14 40l4 3M20 58l5-1M12 74l4-3M104 62l-5 1M100 84l-4-3"/></g>`;
  if (st === 'mess') extra = `<g fill="none" stroke="${dk}" stroke-width="2.400" stroke-linecap="round"><path d="M40 34l-4-7M50 30l-1-8M62 29l2-8M73 31l5-6M26 60l-7-2M27 70l-7 2M94 60l7-2M93 70l7 2"/></g>`;
  if (st === 'done') extra = `<g transform="translate(${cat ? 86 : 84} ${cat ? 30 : 34}) rotate(18)"><path d="M0 0c-9-8-14-6-14 0s5 8 14 0c9 8 14 6 14 0s-5-8-14 0z" fill="#FF6FA0"/><circle r="3.400" fill="#E84C85"/></g>${STAR4(18, 30, 1.500, '#FFC533')}${STAR4(104, 74, 1.100, '#FFC533')}${STAR4(12, 84, .9, '#FFC533')}`;
  return sv(`${body}${ears}${head}${marks}${muzzle}${brow}${st === 'bath' || st === 'dry' ? closed(47) + closed(73) : eye(47) + eye(73)}${nose}${blush}${wet ? '<path d="M38 44c2 5-1 8-3 8s-4-3 0-8M84 40c2 5-1 8-3 8s-4-3 0-8" fill="#9CC7F0"/>' : ''}${extra}`, cls);
}

<ellipse cx="60" cy="58" rx="25" ry="27" fill="${fc.skin}"/>${hair}<circle cx="50" cy="60" r="2.800" fill="${INK}"/><circle cx="70" cy="60" r="2.800" fill="${INK}"/><path d="M52 71c4 4.500 12 4.500 16 0" fill="none" stroke="${INK}" stroke-width="2.200" stroke-linecap="round"/>${flip('<ellipse cx="43" cy="68" rx="4.500" ry="2.800" fill="#F08B7F" opacity=".4"/>')}`, cls);

/* weight over the last six months */
function weightChart(ws) {
  const lo = Math.min(...ws) - .3, hi = Math.max(...ws) + .3, x = i => 14 + i * (292 / (ws.length - 1)), y = v => 96 - (v - lo) / (hi - lo) * 72, pts = ws.map((v, i) => [x(i), y(v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const mon = i => dstr(new Date(new Date().getFullYear(), new Date().getMonth() - (ws.length - 1 - i), 1), { month: 'short' });
  return `<svg class="wchart" viewBox="0 0 320 128" role="img" aria-label="${esc(ws.join(' · '))}"><path d="M14 24H306M14 60H306M14 96H306" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5"/>
<path d="${line}L306 108H14z" fill="var(--tint)"/><path d="${line}" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
${pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === pts.length - 1 ? 5.500 : 3.500}" fill="${i === pts.length - 1 ? 'var(--brand)' : '#fff'}" stroke="var(--brand)" stroke-width="2.500"/>`).join('')}
${pts.map((p, i) => `<text x="${p[0].toFixed(1)}" y="122" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${esc(mon(i))}</text>`).join('')}
<text class="v" x="${(pts[pts.length - 1][0]).toFixed(1)}" y="${(pts[pts.length - 1][1] - 12).toFixed(1)}" text-anchor="end">${ws[ws.length - 1].toFixed(1)} kg</text></svg>`;
}
