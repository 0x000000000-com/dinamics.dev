/* the frame every sample app stands on: screens that slide, a bar of tabs, sheets from the bottom, a tour that plays by itself */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--tabh:60px}
html.emb{--sat:44px;--sab:20px}
body{height:100dvh;overflow:hidden;background:var(--out);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
input,textarea{font:inherit;font-size:16px;color:inherit;border:0;background:none;outline:0;min-width:0}
a{color:inherit}
h1,h2,h3,h4,b,strong{font-weight:600}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--focus,currentColor);outline-offset:2px}
[hidden]{display:none!important}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:var(--isw,1.75);stroke-linecap:round;stroke-linejoin:round}
.i.s{width:16px;height:16px}.i.m{width:20px;height:20px}.i.l{width:28px;height:28px}
.i .f{fill:currentColor;stroke:none}

#app{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate}
#stack{position:absolute;inset:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scr>.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.body::-webkit-scrollbar,.hs::-webkit-scrollbar,.sbody::-webkit-scrollbar{display:none}
.scr.tabscr>.body{padding-bottom:calc(var(--tabh) + var(--sab) + 16px)}
.scr.push{z-index:5;transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);box-shadow:-12px 0 32px rgba(0,0,0,.08)}
.scr.push.in{transform:none}
.scr.up{transform:translateY(100%)}
.scr.under{transform:translateX(-22%);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.scr.push>.body{padding-bottom:calc(var(--sab) + 24px)}
.scr>.foot{flex:none;padding:12px 16px calc(var(--sab) + 12px);background:var(--card);border-top:1px solid var(--line)}
.sat{padding-top:var(--sat)}
/* the band behind the phone's clock: a screen gives it a colour with --strip */
.scr::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--sat);z-index:3;pointer-events:none;background:var(--strip,transparent);transition:opacity .2s}
.scr.strip:not(.sc)::before{opacity:0}
.hs{display:flex;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.hs>*{flex:none;scroll-snap-align:start}

#tabs{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;height:calc(var(--tabh) + var(--sab));padding-bottom:var(--sab);background:var(--tabbg,var(--card));border-top:1px solid var(--line)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut);position:relative;min-width:0}
#tabs button[aria-current=page]{color:var(--tabon,var(--ink))}
#tabs .dot{position:absolute;top:8px;left:50%;margin-left:8px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--badge,#D43D2A);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:600}

.sb{position:absolute;left:0;right:0;top:0;height:44px;z-index:30;display:none;align-items:center;justify-content:space-between;padding:8px 28px 0 32px;font:600 15px/1 var(--font);color:var(--sbc,var(--ink));pointer-events:none;transition:color .3s}
html.emb .sb{display:flex}
.sb span{display:flex;gap:8px;align-items:center}
.sb svg{height:12px;width:auto;fill:currentColor}
.homebar{position:absolute;left:50%;bottom:6px;width:128px;height:5px;margin-left:-64px;border-radius:3px;background:var(--ink);opacity:.28;z-index:31;display:none;pointer-events:none}
html.emb .homebar{display:block}

.shade{position:absolute;inset:0;z-index:20;background:rgba(10,14,12,.5);opacity:0;transition:opacity .28s;pointer-events:none}
.shade.in{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:calc(100% - var(--sat) - 16px);display:flex;flex-direction:column;background:var(--card);border-radius:var(--sheetr,24px) var(--sheetr,24px) 0 0;transform:translateY(105%);transition:transform .36s cubic-bezier(.2,.85,.2,1);box-shadow:0 -8px 40px rgba(0,0,0,.16)}
.sheet.in{transform:none}
.sheet .grab{flex:none;height:24px;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet .grab::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--line2,var(--line))}
.sheet .sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 20px calc(var(--sab) + 20px);scrollbar-width:none}
.sheet .sfoot{flex:none;padding:12px 20px calc(var(--sab) + 12px);border-top:1px solid var(--line)}

#toast{position:absolute;left:50%;bottom:calc(var(--tabh) + var(--sab) + 24px);z-index:40;max-width:calc(100% - 48px);transform:translate(-50%,12px);padding:12px 16px;border-radius:12px;background:var(--toastbg,rgba(20,24,22,.94));color:#fff;font-size:14px;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#note{position:absolute;left:8px;right:8px;top:calc(var(--sat) + 4px);z-index:41;display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:20px;background:var(--notebg,rgba(250,250,250,.96));color:#111;box-shadow:0 12px 36px rgba(0,0,0,.22);transform:translateY(calc(-100% - var(--sat) - 24px));visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s .42s;text-align:left}
#note.on{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s}
#note .ni{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--brand);color:var(--onbrand,#fff)}
#note b{display:block;font-size:14px;line-height:1.3}
#note span{display:block;font-size:13px;line-height:1.35;color:#444}
#note small{margin-left:auto;align-self:flex-start;font-size:11px;color:#777;white-space:nowrap}

.finger{position:absolute;left:50%;top:60%;z-index:60;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 12px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.12);pointer-events:none;opacity:0;transition:left .55s cubic-bezier(.3,.7,.2,1),top .55s cubic-bezier(.3,.7,.2,1),opacity .25s,transform .14s}
.finger.on{opacity:1}
.finger.down{transform:scale(.72);background:rgba(255,255,255,.55)}

.outnote{display:none}
@media (min-width:700px){
  html:not(.inframe) body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  html:not(.inframe) #app{flex:none;width:390px;height:min(844px,calc(100dvh - 88px));border-radius:44px;box-shadow:0 0 0 10px #0C0E12,0 0 0 11px rgba(255,255,255,.14),0 40px 80px -24px rgba(0,0,0,.5)}
  html:not(.inframe) .outnote{display:block;font-size:13px;color:var(--outink,rgba(255,255,255,.72));text-align:center}
  html:not(.inframe) .outnote a{text-underline-offset:3px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* parts every sample app is built from. An app sets the look with variables: --disp --card --line --line2 --soft --tint --brand --brand2 --onbrand --hi --ok --ink --mut */
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:-.01em;line-height:1.2}
.pr{font-family:var(--disp);font-weight:600;font-feature-settings:"lnum","tnum";white-space:nowrap}
.art{width:100%;height:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--rb,14px);background:var(--brand);color:var(--onbrand);font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:none;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px;border-radius:12px}
.btn.wide{display:flex;width:100%}
.btn.wide+.btn.wide{margin-top:8px}
.btn.inv{background:var(--hi);color:var(--ink)}
.btn.two{flex-wrap:wrap;gap:0 12px;padding:4px 12px;line-height:1.25}
.btn.two .pr{opacity:.9}
.lk{display:inline-flex;align-items:center;gap:2px;min-width:40px;min-height:40px;font-size:13px;font-weight:600;color:var(--brand2)}
.lk.inv{color:var(--onbrand)}
.ib{position:relative;flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%}
.ib.txt{width:auto;padding:0 12px;font-size:14px;color:var(--mut);border-radius:12px}
.ib.ong{color:var(--onbrand)}
.ib.glass{position:absolute;top:calc(var(--sat) + 8px);z-index:4;background:color-mix(in srgb,var(--card) 90%,transparent);box-shadow:0 2px 10px rgba(20,24,28,.14)}
.ib.glass.l{left:12px}.ib.glass.r{right:12px}
.ib[aria-pressed=true]{color:var(--hot,#C8452C)}
.pip{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--hi);box-shadow:0 0 0 2px var(--bg)}
.ong .pip{box-shadow:0 0 0 2px var(--brand)}
.bar{flex:none;background:var(--card);border-bottom:1px solid var(--line)}
.bar>div{display:flex;align-items:center;height:52px;padding:0 4px}
.bar h1{flex:1;min-width:0;text-align:center;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt{flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:calc(var(--sat) + 12px) 12px 8px 20px;min-height:calc(var(--sat) + 64px)}
.pt h1{font-size:28px;padding-bottom:4px}
.sec{padding:0 16px;margin-top:24px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 12px}
.sech h2{flex:0 1 auto;font-size:19px}
.sech small{flex:1 1 0;min-width:0;font-size:13px;color:var(--mut);text-align:right}
.sl{font:600 13px/1.3 var(--font);letter-spacing:0;color:var(--mut);margin:0 4px 8px}
.card{background:var(--card);border-radius:var(--rc,16px);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 16px;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row>span{flex:1;min-width:0}
.row b{display:block;font-size:15px;line-height:1.35}
.row small{display:block;font-size:13px;color:var(--mut);line-height:1.35}
.row em{font-style:normal;font-size:14px;color:var(--mut);white-space:nowrap}
.row em.ok{color:var(--ok);font-weight:600}
.row>.i:first-child{color:var(--brand2)}
.row>.i.s{color:var(--line2)}
.switch{flex:none;position:relative;width:48px;height:28px;border-radius:14px;background:var(--line2);transition:background .2s}
.switch::before{content:"";position:absolute;inset:-8px -4px}
.switch i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked=true]{background:var(--brand)}
.switch[aria-checked=true] i{transform:translateX(20px)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:12px;background:var(--soft);color:var(--mut);font:600 12px var(--font);font-style:normal;white-space:nowrap}
.chip.on{background:var(--tint);color:var(--brand)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:56px 32px}
.empty .art{width:144px;height:144px}
.empty>.i{width:48px;height:48px;color:var(--line2)}
.empty h2{font-size:20px}
.empty p{color:var(--mut);font-size:14px;margin-bottom:12px}
.empty.sm{padding:32px 16px}
.pad{padding:8px 16px 0}
.qty{flex:none;display:flex;align-items:center;height:48px;border-radius:14px;background:var(--soft)}
.qty button{display:grid;place-items:center;width:44px;height:48px;color:var(--brand)}
.qty button:disabled{opacity:.3}
.qty b{min-width:24px;text-align:center;font:600 17px var(--disp)}
.qty.sm{height:36px;border-radius:10px;margin-top:8px}
.qty.sm button{width:36px;height:36px}
.qty.sm b{min-width:20px;font-size:15px}
.addm{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--onbrand)}
.seg{display:flex;padding:4px;border-radius:12px;background:var(--soft)}
.seg button{flex:1;min-width:0;min-height:38px;padding:0 2px;border-radius:9px;font-size:clamp(12px,3.6vw,14px);font-weight:600;color:var(--mut);text-align:center}
.seg button[aria-pressed=true]{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(20,24,28,.12)}
.livebar{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:12px 16px 0;padding:12px 12px 12px 16px;border-radius:16px;background:var(--brand);color:var(--onbrand)}
.livebar span{flex:1;min-width:0}
.livebar b{display:block;font-size:14px}
.livebar small{display:block;font-size:12px;opacity:.76}
.pulse{flex:none;width:10px;height:10px;border-radius:50%;background:var(--hi);animation:pulse 1.6s infinite}
.thumbs{display:flex}
.sum{padding:4px 4px 0}
.sum p{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 0;font-size:14px;color:var(--mut)}
.sum p b{color:var(--ink);font-family:var(--disp)}
.sum .off b{color:var(--ok)}
.sum .tot{margin-top:8px;padding-top:12px;border-top:1px dashed var(--line2);font-size:16px;font-weight:600;color:var(--ink)}
.sum .tot b{font-size:22px}
.sum .tot small{margin-left:8px;font-weight:400;font-size:12px;color:var(--mut)}
.sum .earn{justify-content:flex-start;gap:8px;font-size:13px;color:var(--brand2)}
.pfoot{display:flex;align-items:center;gap:16px}
.pfoot>div{flex:none;min-width:84px}
.pfoot small{display:block;font-size:12px;color:var(--mut)}
.pfoot b{font:600 24px/1.1 var(--disp)}
.pfoot .btn{flex:1}
.sh{font-size:20px;margin:4px 0 16px}
.hint{margin-top:12px;font-size:13px;color:var(--mut);text-align:center}
.hint.l{text-align:left;margin:-8px 0 12px}
.plist{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line2)}
[aria-pressed=true]>.radio,.radio.on{border:7px solid var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{flex:1 1 72px;min-height:48px;padding:0 12px;border-radius:12px;background:var(--soft);font-size:15px;text-align:center;white-space:nowrap}
.paying{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 20px 48px!important;text-align:center}
.paying h2{font-size:20px}
.paying p{color:var(--mut);font-family:var(--disp)}
.spin{width:44px;height:44px;margin-bottom:8px;border-radius:50%;border:4px solid var(--tint);border-top-color:var(--brand);animation:spin .8s linear infinite}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.amts button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72px;border-radius:14px;background:var(--soft)}
.amts b{font:600 20px var(--disp)}
.amts small{font-size:11px;color:var(--mut)}
.wl{list-style:none;padding:0;margin:0}
.wl li{display:flex;align-items:center;gap:12px;padding:12px 0}
.wl li+li{border-top:1px solid var(--line)}
.wl i{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--mut)}
.wl i.in{background:var(--tint);color:var(--brand)}
.wl span{flex:1;min-width:0}
.wl span b{display:block;font-size:15px}
.wl small{font-size:12px;color:var(--mut)}
.wl li>b{font-family:var(--disp)}
.wl b.in{color:var(--ok)}
.codes{text-align:center}
.codes .sh{text-align:left}
.qrc{margin:0 auto;border-radius:12px;border:1px solid var(--line)}
.codes .big{margin-top:12px;font:600 28px var(--disp);letter-spacing:.04em}
.cbal{display:flex;justify-content:center;gap:28px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.cbal span{display:inline-flex;align-items:center;gap:8px;font:600 16px var(--disp);color:var(--brand)}
.rds{display:flex;flex-direction:column;align-items:center;text-align:center}
.rds h2{margin-top:16px;font-size:22px}
.rds p{margin:8px 0 20px;font-size:14px;color:var(--mut)}
.steps{list-style:none;margin:0;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.steps li{position:relative;display:flex;align-items:center;gap:12px;min-height:40px;color:var(--mut)}
.steps li>i{position:relative;z-index:1;flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);background:var(--card)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:9px;top:30px;width:2px;height:20px;background:var(--line2)}
.steps li.done>i{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.steps li.done::after{background:var(--brand)}
.steps li.now{color:var(--ink)}
.steps li.now>i{border-color:var(--hi);box-shadow:0 0 0 4px color-mix(in srgb,var(--hi) 30%,transparent)}
.steps li.now>i:not(:empty){background:var(--hi);color:var(--ink);box-shadow:none}
.steps li>i .i{width:12px;height:12px;stroke-width:3}
.steps b{flex:1;font-size:15px}
.steps small{font-size:13px}
.tact{display:flex;gap:8px;padding:0 16px 16px}
.tact .btn{flex:1}
.ocard{display:block;width:100%;padding:16px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left}
.ocard+.ocard{margin-top:12px}
.oh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.oh b{font-size:15px}
.oh small{display:block;margin-top:2px;font-size:12px;color:var(--mut)}
.of{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.of>b{font:600 18px var(--disp)}
.of span{display:flex;gap:8px}
.othumbs{display:flex;align-items:center;margin-top:12px}
.othumbs p{flex:1;min-width:0;margin-left:12px;font-size:13px;line-height:1.4;color:var(--mut)}
.omap{height:236px;overflow:hidden;border-bottom:1px solid var(--line)}
.citymap{width:100%;height:100%}
.olist{padding:12px 16px 0}
.orow{display:flex;align-items:center;gap:12px;width:100%;padding:16px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left}
.orow+.orow{margin-top:8px}
.orow.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.orow>span:first-child{flex:1;min-width:0}
.orow b{display:block;font:600 16px/1.3 var(--disp)}
.orow small{display:block;margin-top:2px;font-size:12px;color:var(--mut)}
.okm{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.okm b{font-size:14px}
.nrow{display:flex;gap:12px;padding:16px 0}
.nrow+.nrow{border-top:1px solid var(--line)}
.nrow>i{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--mut)}
.nrow.new>i{background:var(--brand);color:var(--onbrand)}
.nrow b{display:block;font-size:15px;line-height:1.35}
.nrow.new b::after{content:"";display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;background:var(--hi);vertical-align:middle}
.nrow small{display:block;margin-top:2px;font-size:13px;color:var(--mut)}
.nrow em{display:block;margin-top:4px;font-style:normal;font-size:12px;color:var(--mut)}
.faq{border-bottom:1px solid var(--line)}
.faq summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;font-size:15px;font-weight:600;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary .i{color:var(--mut);transition:transform .2s}
.faq[open] summary .i{transform:rotate(180deg)}
.faq p{padding-bottom:16px;font-size:14px;color:var(--mut)}
.pad>.btn{margin-top:20px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 70%,transparent)}70%,100%{box-shadow:0 0 0 10px transparent}}
@keyframes spin{to{transform:rotate(360deg)}}

/* 早安咖啡 Daybreak: first light. Deep green, warm paper, one sun-yellow; the half sun with its rings is the one mark that repeats. */
:root{--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;--disp:"DB Display",var(--font);
  --bg:#F6F1E7;--card:#FFFDF8;--ink:#17231E;--mut:#5C6B63;--line:#E7DFCF;--line2:#D3C8B2;--soft:#F1EADB;--mint:#E1EEE5;
  --brand:#0F3D2E;--brand2:#1C5C45;--sun:#F0B429;--hi:#F0B429;--tint:#E1EEE5;--hot:#C8452C;--rb:14px;--rc:16px;--ok:#17734A;--out:#082219;--focus:#1C5C45;--tabon:#0F3D2E;--badge:#C8452C;--onbrand:#FFFDF8;--cream:#FFFDF8;--sheetr:24px;--vbg:var(--bg)}
.promo b,.feat b,.greet,.ititle h1,.empty h2,.rds h2{text-wrap:balance}
.tile{display:block;flex:none;width:88px;height:88px;border-radius:16px;overflow:hidden;padding:4px}
.tile.sm{width:48px;height:48px;border-radius:12px;padding:2px}
.tile.lg{width:120px;height:120px;border-radius:24px}
.tile.ic{display:grid;place-items:center;background:var(--mint);color:var(--brand)}
.sun>path{fill:var(--sun)}
#toast{bottom:calc(var(--tabh) + var(--sab) + 80px)}
#tabs button[aria-current=page] .i{stroke-width:2.1}
.tabscr[data-s=home],.tabscr[data-s=rewards],.scr[data-s=track]{--strip:var(--brand)}
.scr[data-s=item]{--strip:var(--card)}

.tg{display:inline-block;vertical-align:middle;margin-left:8px;padding:2px 8px;border-radius:6px;font:600 11px/1.35 var(--font);font-style:normal;letter-spacing:0;background:var(--mint);color:var(--brand);white-space:nowrap}
.tg.sig,.tg.deal{background:var(--sun);color:var(--ink)}
.tg.new{background:var(--ink);color:var(--cream)}
.seg.wide{margin-bottom:12px}

/* home */
.hd{position:relative;background:var(--brand);color:var(--cream);padding:calc(var(--sat) + 8px) 16px 68px;overflow:hidden}
.hdsun{position:absolute;right:-56px;bottom:-2px;width:280px;color:rgba(255,253,248,.16)}
.hdrow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px}
.outlet{display:flex;align-items:center;gap:8px;min-height:44px;min-width:0;padding:0 12px 0 12px;border-radius:22px;background:rgba(255,253,248,.1)}
.outlet span{min-width:0}
.outlet b{display:block;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outlet small{display:block;font-size:11px;line-height:1.3;opacity:.76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet{position:relative;margin-top:20px;padding:0 4px;font-size:30px;line-height:1.12;max-width:250px}
.mcard{position:relative;margin:-48px 16px 0;padding:2px 16px 0;background:var(--card);border-radius:20px;border:1px solid var(--line);box-shadow:0 12px 28px -14px rgba(23,35,30,.4)}
.mtop{display:flex;align-items:center;gap:8px;width:100%;min-height:52px}
.mtop>.i{color:var(--line2)}
.mbeans{flex:1;text-align:right;font-size:13px;color:var(--mut)}
.mbeans b{font:600 22px var(--disp);color:var(--ink)}
.tbadge{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 12px 0 8px;border-radius:13px;font:600 12px var(--font);background:var(--mint);color:var(--brand)}
.tbadge.t1{background:var(--sun);color:var(--ink)}
.tbadge.t2{background:var(--ink);color:var(--sun)}
.mprog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.mprog i{display:block;height:100%;border-radius:3px;background:var(--sun)}
.mnext{margin-top:8px;font-size:12px;color:var(--mut)}
.mact{display:flex;margin:12px -16px 0;border-top:1px solid var(--line)}
.mact button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;font-size:14px;font-weight:600;color:var(--brand);white-space:nowrap}
.mact button+button{border-left:1px solid var(--line)}
.mact b{font-family:var(--disp)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 16px 0}
.modes button{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.modes i{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--mint);color:var(--brand);margin-bottom:8px}
.modes b{font-size:15px;line-height:1.25}
.modes small{font-size:12px;color:var(--mut);line-height:1.3;margin-top:2px}
.promos{gap:12px;padding:0 16px;margin-top:16px;scroll-padding:0 16px}
.promo{position:relative;display:flex;width:300px;height:136px;border-radius:20px;overflow:hidden;padding:16px;text-align:left}
.promo>span{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;max-width:172px}
.promo b{font:600 19px/1.2 var(--disp)}
.promo small{margin-top:8px;font-size:13px;line-height:1.35;opacity:.82}
.promo em{margin-top:auto;display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:13px;font-weight:600}
.promo .art{position:absolute;right:-10px;bottom:-16px;width:152px;height:152px}
.again{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.thumbs .tile+.tile,.othumbs .tile+.tile{margin-left:-16px;box-shadow:-2px 0 0 var(--card)}
.again p{min-width:0;font-size:14px;line-height:1.4}
.again .btn{grid-column:1/-1}
.stamps{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.stamps i{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;border:1.5px dashed var(--line2);color:var(--line2)}
.stamps i.on{border:0;background:var(--brand);color:var(--cream)}
.stamps i.gift{border-color:var(--sun);color:#A8780A}
.stamps i.gift.on{background:var(--sun);color:var(--ink)}
.picks{gap:12px;margin:0 -16px;padding:0 16px;scroll-padding:0 16px}
.pick{display:flex;flex-direction:column;width:132px;text-align:left}
.pick .tile{width:132px;height:132px;border-radius:20px;padding:8px}
.pick b{margin-top:8px;font:600 15px/1.25 var(--disp)}
.pick>span{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.feat{position:relative;display:flex;width:100%;min-height:152px;border-radius:20px;overflow:hidden;padding:16px;text-align:left}
.feat>span{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:196px}
.feat .tg{margin:0}
.feat b{font:600 22px/1.2 var(--disp)}
.feat small{font-size:13px;line-height:1.4;color:#4E4335}
.feat .pr{margin-top:auto;font-size:18px}
.feat .art{position:absolute;right:-6px;bottom:-14px;width:164px;height:164px}

/* menu */
.mh{flex:none;background:var(--card);padding:calc(var(--sat) + 8px) 16px 12px;border-bottom:1px solid var(--line)}
.mwhere{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin-top:4px;font-size:14px}
.mwhere span{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mwhere .i:first-child{color:var(--brand2)}
.mwhere .i.s{color:var(--line2)}
.srch{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--soft);color:var(--mut)}
.srch input{flex:1;height:100%;color:var(--ink)}
.srch input::placeholder,.inote input::placeholder{color:var(--mut);opacity:1}
.srch input::-webkit-search-cancel-button{display:none}
.srch:focus-within,.inote input:focus{box-shadow:inset 0 0 0 1.5px var(--brand2)}
.mwrap{flex:1;min-height:0;display:flex}
.rail{flex:none;width:84px;overflow-y:auto;scrollbar-width:none;background:var(--soft);padding-bottom:calc(var(--tabh) + var(--sab) + 88px)}
.rail::-webkit-scrollbar{display:none}
.rail button{position:relative;display:block;width:100%;min-height:56px;padding:8px 8px 8px 12px;font-size:13px;line-height:1.25;color:var(--mut)}
.rail button.on{background:var(--bg);color:var(--ink);font-weight:600}
.rail button.on::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 2px 2px 0;background:var(--sun)}
.mlist{position:relative;flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:0 12px calc(var(--tabh) + var(--sab) + 96px)}
.mcat{position:sticky;top:0;z-index:1;display:flex;align-items:baseline;gap:8px;padding:16px 0 8px;background:var(--bg);font-size:17px}
.mcat small{font:400 12px var(--font);letter-spacing:0;color:var(--mut)}
.mi{position:relative;display:flex;gap:12px;padding:12px 0;cursor:pointer}
.mi+.mi{border-top:1px solid var(--line)}
.mi>div{flex:1;min-width:0;display:flex;flex-direction:column}
.mi h3{font-size:16px;line-height:1.25}
.mi p{margin-top:4px;font-size:12px;line-height:1.4;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mi>div>span{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding:8px 36px 0 0;white-space:nowrap;overflow:hidden}
.mi .pr{font-size:17px}
.mi small{font-size:11px;color:var(--mut)}
.addb{position:absolute;right:-6px;bottom:2px;display:grid;place-items:center;width:44px;height:44px}
.addb::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--brand)}
.addb .i{position:relative;color:var(--cream)}
.cbwrap{position:absolute;left:12px;right:12px;bottom:calc(var(--tabh) + var(--sab) + 12px);z-index:3;pointer-events:none}
.cartbar{pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;height:52px;padding:0 20px 0 8px;border-radius:26px;background:var(--brand);color:var(--cream);box-shadow:0 10px 24px -8px rgba(23,35,30,.4)}
.cn{display:grid;place-items:center;min-width:36px;height:36px;padding:0 8px;border-radius:18px;background:var(--sun);color:var(--ink);font:600 15px var(--disp);font-style:normal}
.cartbar span{flex:1;font-weight:600}
.cartbar b{font:600 17px var(--disp)}

/* one item */
.scr[data-s=item],.scr[data-s=item]>.body{background:var(--card)}
.ihero{position:relative;height:calc(var(--sat) + 280px);overflow:hidden;display:grid;place-items:end center}
.isun{position:absolute;left:50%;bottom:-2px;width:440px;margin-left:-220px;color:rgba(255,255,255,.6)}
.isun>path{fill:rgba(255,255,255,.5)}
.iart{position:relative;width:232px;height:232px;margin-bottom:16px}
.iart .art{animation:pop .3s cubic-bezier(.3,1.3,.5,1)}
.ibody{position:relative;margin-top:-24px;padding:20px 20px 8px;border-radius:24px 24px 0 0;background:var(--card)}
.ititle{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ititle h1{font-size:26px;line-height:1.15}
.ititle .pr{font-size:22px}
.idesc{margin-top:8px;font-size:14px;color:var(--mut)}
.facts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.facts span{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 12px;border-radius:14px;background:var(--soft);font-size:12px;color:#49584F}
.facts .tg{margin:0;padding:4px 8px;border-radius:14px}
.og{border:0;padding:0;margin:20px 0 0;min-width:0}
.og legend{padding:0;margin-bottom:8px;font-size:14px;font-weight:600}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.ops button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;min-width:84px;padding:4px 8px;border-radius:12px;background:var(--soft);font-size:14px;line-height:1.25;text-align:center;transition:background .15s,color .15s}
.ops button small{font-size:11px;color:var(--mut)}
.ops button[aria-pressed=true],.chips button[aria-pressed=true],.amts button[aria-pressed=true]{background:var(--brand);color:var(--cream)}
.ops button[aria-pressed=true] small,.amts button[aria-pressed=true] small{color:rgba(255,253,248,.76)}
.inote{display:block;margin-top:20px}
.inote span{display:block;margin-bottom:8px;font-size:14px;font-weight:600}
.inote input{width:100%;height:48px;padding:0 16px;border-radius:12px;background:var(--soft)}
.ifoot{display:flex;align-items:center;gap:12px}
.ifoot .btn{flex:1;min-width:0}

/* cart */
.cartb>.card,.cartb>.xs,.cartb>.sum{margin:12px 16px 0}
.cl{display:flex;align-items:flex-start;gap:12px;padding:12px 16px}
.cl+.cl{border-top:1px solid var(--line)}
.cl>div:nth-child(2){flex:1;min-width:0}
.cl b{display:block;font-size:15px;line-height:1.3}
.cl small{display:block;margin-top:2px;font-size:12px;line-height:1.4;color:var(--mut)}
.clr{flex:none;display:flex;flex-direction:column;align-items:flex-end}
.xs h3{font:600 14px/1.3 var(--font);letter-spacing:0;margin:4px 4px 8px}
.xs .hs{gap:8px;margin:0 -16px;padding:0 16px;scroll-padding:0 16px}
.xsi{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left}
.xsi>span:not(.tile){display:flex;flex-direction:column}
.xsi b{font-size:13px;white-space:nowrap}
.xsi .pr{font-size:13px;color:var(--mut)}

/* sheets */
.sheet{--vbg:var(--card)}
.vts{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.vt{position:relative;display:flex;align-items:stretch;width:100%;min-height:76px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left}
.sheet .vt{background:var(--bg)}
.vl{position:relative;flex:none;display:grid;place-items:center;width:84px;border-radius:13px 0 0 13px;background:var(--mint);color:var(--brand);border-right:1.5px dashed var(--line2)}
.vl::before,.vl::after{content:"";position:absolute;right:-8px;width:14px;height:14px;border-radius:50%;background:var(--vbg);border:1px solid var(--line)}
.vl::before{top:-8px}.vl::after{bottom:-8px}
.vt{overflow:hidden}
.vl b{font:600 22px var(--disp)}
.vr{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:12px}
.vr b{font-size:15px;line-height:1.3}
.vr small{margin-top:2px;font-size:12px;color:var(--mut)}
.vt>i{flex:none;display:grid;place-items:center;width:40px;color:var(--brand)}
.vt.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.vt:disabled{opacity:.5}
.scan{position:relative;display:grid;place-items:center;width:168px;height:168px;margin:0 auto;border-radius:20px;background:var(--ink);color:rgba(255,253,248,.4);overflow:hidden}
.scan .i{width:80px;height:80px}
.scan>i{position:absolute;left:16px;right:16px;top:24px;height:2px;border-radius:1px;background:var(--sun);animation:scan 1.8s ease-in-out infinite alternate}
.about{text-align:center}
.asun{width:128px;margin:8px auto 16px;color:var(--brand)}
.about h2{font-size:22px}
.about p{margin:8px 0 20px;font-size:14px;color:var(--mut)}

/* the order being made */
.trk{background:var(--bg)}
.trtop{position:relative;padding:var(--sat) 16px 28px;border-radius:0 0 28px 28px;background:var(--brand);color:var(--cream);text-align:center;overflow:hidden}
.trsun{position:absolute;left:50%;bottom:-2px;width:560px;margin-left:-280px;color:rgba(255,253,248,.1)}
.trsun>path{display:none}
.trbar{position:relative;display:flex;align-items:center;justify-content:space-between;height:52px;margin:0 -12px}
.trbar span{font:500 13px var(--disp);letter-spacing:.03em;opacity:.8}
.tl{position:relative;margin-top:4px;font-size:13px;opacity:.76}
.trtop .code{position:relative;font:600 56px/1.05 var(--disp);letter-spacing:.02em;color:var(--sun)}
.ring{position:relative;width:188px;height:188px;margin:16px auto 0}
.ring>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.r0,.r1{fill:none;stroke-width:6}
.r0{stroke:rgba(255,253,248,.16)}
.r1{stroke:var(--sun);stroke-linecap:round;transition:stroke-dasharray 1.2s cubic-bezier(.3,.7,.2,1)}
.rart{position:absolute;inset:18px;display:grid;place-items:center;border-radius:50%;background:var(--cream);overflow:hidden}
.rart .art{width:124px;height:124px}
.rart.brewing .art{animation:bob 1.8s ease-in-out infinite}
.tst{position:relative;margin-top:16px;font-size:24px}
.eta{position:relative;margin-top:4px;font-size:14px;opacity:.84}
.trbody{display:flex;flex-direction:column;gap:12px;padding:16px 16px 8px}
.earned{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--mint);border-color:#C9DFD0;color:var(--brand)}
.earned span{flex:1}
.earned b{display:block}
.earned small{font-size:13px;opacity:.84}
.tsum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 16px;border-top:1px dashed var(--line2);font-size:14px;color:var(--mut)}
.tsum b{font:600 18px var(--disp);color:var(--ink)}

/* orders and the receipt */
.ocard.live{background:var(--brand);border-color:var(--brand);color:var(--cream)}
.ocard.live .oh b{font:600 24px/1.1 var(--disp);color:var(--sun)}
.ocard.live .chip.on{background:rgba(255,253,248,.14);color:var(--cream)}
.obar{height:6px;margin:12px 0;border-radius:3px;background:rgba(255,253,248,.16);overflow:hidden}
.obar i{display:block;height:100%;border-radius:3px;background:var(--sun);transition:width .8s}
.ocard.live p{font-size:14px}
.ocard.live small{font-size:13px;opacity:.76}
.rcb{padding:16px 16px 0}
.paper{--z:8px;position:relative;padding:28px 20px 36px;background:#FFFEFB;text-align:center;border-radius:16px 16px 0 0;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/calc(2*var(--z)) var(--z) repeat-x,linear-gradient(#000 0 0) top/100% calc(100% - var(--z)) no-repeat;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/calc(2*var(--z)) var(--z) repeat-x,linear-gradient(#000 0 0) top/100% calc(100% - var(--z)) no-repeat}
.psun{width:72px;margin:0 auto 8px;color:var(--brand)}
.paper h2{font-size:22px}
.pc{margin-top:4px;font-size:12px;color:var(--mut)}
.paper dl{margin:16px 0 0;padding-top:12px;border-top:1px dashed var(--line2);text-align:left}
.paper dl div{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:13px}
.paper dt{color:var(--mut)}
.paper dd{margin:0;font-family:var(--disp);text-align:right}
.paper ul{list-style:none;margin:12px 0 0;padding:8px 0 0;border-top:1px dashed var(--line2);text-align:left}
.paper li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}
.paper li small{display:block;font-size:12px;color:var(--mut)}
.paper li>b{font-family:var(--disp)}
.paper .tt .g{padding-top:8px;font-size:16px;font-weight:600}
.paper .tt .g dt{color:var(--ink)}
.paper .tt .g dd{font-size:20px;font-weight:600}
.thanks{margin-top:20px;font:600 15px var(--disp);color:var(--brand)}

/* rewards */
.rwhd{position:relative;padding:calc(var(--sat) + 12px) 16px 20px;background:var(--brand);color:var(--cream);overflow:hidden}
.rwhd h1{position:relative;padding:0 4px;font-size:28px}
.rwhd .hdsun{right:-80px;bottom:auto;top:calc(var(--sat) - 96px);width:320px;transform:scaleY(-1)}
.rwhd .hdsun>path{display:none}
.tcard{position:relative;margin-top:16px;padding:16px;border-radius:20px;background:rgba(255,253,248,.08);border:1px solid rgba(255,253,248,.16)}
.tcr{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}
.tcr>span:last-child{font-family:var(--disp);opacity:.84}
.tb{margin-top:16px;font-size:14px}
.tb b{font:600 40px/1 var(--disp);color:var(--sun)}
.tcard .mprog{margin-top:12px;background:rgba(255,253,248,.16)}
.tcard .mnext{color:rgba(255,253,248,.76)}
.perks{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,253,248,.16)}
.perks span{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:12px;line-height:1.3}
.perks .i{color:var(--sun)}
.task{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:16px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.task+.task{margin-top:8px}
.task b{display:block;font-size:15px}
.task small{font-size:12px;color:var(--brand2)}
.tp{grid-column:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.tp i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.task em{grid-column:2;grid-row:1/span 2;font:600 16px var(--disp);font-style:normal;color:var(--mut)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rd{display:flex;flex-direction:column;align-items:center;min-width:0;padding:12px 8px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center}
.rd .tile{width:72px;height:72px}
.rd b{margin-top:8px;font-size:13px;line-height:1.3}
.cost{display:inline-flex;align-items:center;gap:4px;margin-top:auto;padding-top:8px;font:600 14px var(--disp);color:var(--brand)}
.rd.dim{opacity:.5}
.refer{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;border-radius:16px;background:var(--mint)}
.refer>span{min-width:0}
.refer b{display:block;font-size:15px}
.refer small{font-size:12px;line-height:1.35;color:#38584A}
.refer .code{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;background:var(--card);border:1.5px dashed var(--brand2);font:600 13px var(--disp);color:var(--brand);white-space:nowrap}

/* account */
.prof{display:flex;align-items:center;gap:12px;margin:4px 12px 0 16px}
.av{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--sun);color:var(--ink);font:600 24px var(--disp);font-style:normal}
.prof>span{flex:1;min-width:0}
.prof b{display:block;font:600 20px/1.2 var(--disp)}
.prof small{font-size:13px;color:var(--mut)}
.wcard{position:relative;display:flex;align-items:flex-end;justify-content:space-between;min-height:116px;margin:16px 16px 0;padding:16px;border-radius:20px;background:var(--brand);color:var(--cream);overflow:hidden}
.wsun{position:absolute;right:-70px;bottom:-2px;width:300px;color:rgba(255,253,248,.14)}
.wsun>path{display:none}
.wcard>span{position:relative;align-self:flex-start}
.wcard small{display:block;font-size:13px;opacity:.76}
.wcard span b{font:600 34px/1.15 var(--disp)}
.wcard>div{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 16px 0}
.mgrid button{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;padding:16px 4px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center}
.mgrid .i{color:var(--brand2)}
.mgrid b{font-size:12px;font-weight:500;line-height:1.25}
.mgrid small{position:absolute;top:6px;right:8px;font:600 12px var(--disp);color:var(--mut)}
.mlistc{margin:12px 16px 0}
.ver{margin:20px 0 8px;text-align:center;font-size:12px;color:var(--mut)}
.mp path{fill:var(--brand2);stroke:#fff;stroke-width:2}
.mp circle{fill:#fff}
.mp.on path{fill:var(--sun);stroke:var(--ink);stroke-width:1.5}
.mp.on circle{fill:var(--ink)}
.me .halo{fill:rgba(40,104,214,.2)}
.me circle+circle{fill:#2868D6;stroke:#fff;stroke-width:2.5}

@keyframes scan{to{transform:translateY(118px)}}
@keyframes pop{from{transform:scale(.94);opacity:.6}}
@keyframes bob{50%{transform:translateY(-4px)}}

</style>

function place(c) {
  const o = { id: 'DB-' + (0x8A2C + S.seq * 97).toString(16).toUpperCase() + '-0' + (128 + S.seq), code: 'A' + (128 + S.seq), t: new Date(), out: S.out, mode: S.mode, table: S.table, addr: S.addr, when: S.when,
    lines: S.cart, sub: c.sub, vd: c.vd, vn: c.v ? c.v.n : null, bd: c.bd, dlv: c.dlv, total: c.total, earn: c.earn, pay: S.pay, stage: 0, shown: 0, done: false };
  S.seq++; if (S.pay === 'wallet') { S.wallet -= c.total; S.wlog.unshift({ t: new Date(), k: 'spend', a: -c.total }); }
  if (c.v) S.vouchers = S.vouchers.filter(v => v.id !== c.v.id); S.useV = null; if (c.bd) S.beans -= c.bd * 100; S.useBeans = false;

function step(o, n) {
  if (n <= o.stage) return; o.stage = n; if (n === 1) o.made = new Date();
  if (n === 2) { o.ready = new Date(); S.beans += o.earn; S.beansAll += o.earn; S.stamps = Math.min(8, S.stamps + o.lines.filter(l => isDrink(M[l.id])).reduce((s, l) => s + l.qty, 0)); S.unread++; S.inbox.unshift({ k: 'ready', t: new Date(), n: 1, code: o.code });
    K.note(T('note.ready.t'), T('note.ready.b', { code: o.code, o: L(OUT[o.out].n) }), 'cup', 'go:track'); }
  K.draw();
}

  receipt() { K.tab('orders', true); K.go('receipt', { id: S.orders[0].id }); }, inbox() { K.go('inbox'); }, help() { K.go('help'); }, favs() { K.go('favs'); },
  vouch() { K.jumps.cart(); K.acts.vsheet(); }, when() { K.jumps.cart(); K.acts.whensheet(); }, paysh() { K.jumps.cart(); K.acts.paysheet(); }, addr() { K.jumps.cart(); K.acts.addrsheet(); },
  topup() { K.tab('me', true); K.acts.topup(); }, mcode() { K.acts.mcode(); }, wlog() { K.tab('me', true); K.acts.wlog(); }, table() { K.tab('menu', true); K.acts.tablesheet(); },
  lang() { K.tab('me', true); K.acts.langsheet(); }, about() { K.tab('me', true); K.acts.about(); }, mine() { S.rw = 'mine'; K.tab('rewards'); }, redeem() { K.tab('rewards', true); K.acts.redeem(['r1']); },
  delivery() { S.mode = 'delivery'; K.jumps.cart(); }, empty() { K.go('cart'); }, search() { S.q = 'latte'; K.tab('menu'); }
};
K.tour = async A => {
  await A.tap('.picks [data-a="item:dawn"]'); await A.tap('[data-a="opt:temp:iced"]', 600); await A.tap('[data-a="opt:size:L"]', 600);
  await A.tap('[data-a="opt:sweet:50"]', 500); await A.tap('[data-a="addon:cream"]', 700); await A.tap('[data-a="addcart"]', 900);
  await A.tap('#tabs [data-tab="menu"]'); await A.tap('[data-a="cat:food"]', 900); await A.tap('[data-a="quick:croissant"]', 500); await A.tap('[data-a="quick:cake"]', 700);
  await A.tap('[data-a="go:cart"]', 900); await A.scroll(240); await A.tap('[data-a="vsheet"]'); await A.tap('[data-a="usev:v1"]', 700); await A.tap('[data-a="beans"]', 700);
  await A.tap('[data-a="pay"]', 2600); await A.wait(K.fast ? 900 : 6500); await A.scroll(220); await A.wait(K.fast ? 1200 : 9500); await A.scroll(-400);
  await A.tap('[data-a="collected"]', 900); await A.tap('#tabs [data-tab="rewards"]'); await A.scroll(330); await A.tap('[data-a="redeem:r2"]'); await A.tap('[data-a^="doredeem"]', 1200);
  await A.tap('#tabs [data-tab="me"]'); await A.tap('[data-a="topup"]'); await A.tap('[data-a="amt:50"]', 600); await A.tap('[data-a="dotopup"]', 1400); await A.tap('[data-a="go:outlets"]', 1600); await A.tap('[data-a="setout:station"]', 1200);
};
K.boot({ id: 'daybreak', tabs: ['home', 'menu', 'orders', 'rewards', 'me'] });

</script>
