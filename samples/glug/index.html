/* ---------- 茶咕 GLUG · porcelain blue, milk tea, tapioca pearls ---------- */
:root {
  --wrap: 1280px; --gut: 18px;
  --cobalt: #1F3BD0; --cobalt-hi: #2E4BE8; --cobalt-deep: #14238A; --navy: #0E1A5E;
  --porc: #F4F6FC; --porc-2: #E6EBFA; --paper: #FFFFFF;
  --tea: #EDCFA8; --tea-hi: #F7E2C4; --tea-deep: #D9A86E; --caramel: #B8661F;
  --pearl: #1B110C; --ink-2: #4E4743; --ink-3: #6E6762;
  --sugar: #5A2811; --mango: #FFC531; --pandan: #2F7D32; --berry: #C2264F;
  --line: rgba(27, 17, 12, .12);
  --focus: #1B110C;
  --r-card: 22px; --r-blk: 28px; --r-tk: 16px; --r-in: 14px;
  --sys: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", sans-serif;
  --ui: "Glug Sans", system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  --disp: "Glug Display", "Glug Sans", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--porc); color: var(--pearl); font: 400 16px/1.55 var(--ui); font-variation-settings: "opsz" 14; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
p { text-wrap: pretty; }
svg.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.clip { position: fixed; top: 0; left: 0; opacity: 0; pointer-events: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 10px; }
.hero, .top, .side, .pos-mem, .ph-cobalt, .banner, .poster.p-double, .poster.p-pandan, .dt-head.tier-friend, .dt-head.tier-devotee, .kpi-hero { --focus: #FFC531; }
#main:focus { outline: none; }
.apage-h:focus { outline: none; }

/* ---------- type ---------- */
.disp { font-family: var(--disp); font-weight: 800; font-stretch: 80%; font-synthesis: none; letter-spacing: .01em; line-height: 1.02; font-variation-settings: "opsz" 96; }
html[lang="en"] .disp { font-family: var(--ui); font-stretch: 76%; letter-spacing: -.012em; line-height: .98; }
.num { font-family: var(--ui); font-variation-settings: "opsz" 24; }
.muted { color: var(--ink-3); }
.ic { width: 20px; height: 20px; flex: none; }
.empty { color: var(--ink-3); padding: 18px 0; }
.lede { color: var(--ink-2); font-size: 17px; max-width: 60ch; margin-bottom: 20px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 2px solid transparent; font-weight: 650; font-size: 16px; line-height: 1.1; text-decoration: none; white-space: nowrap; transition: transform .15s ease, background-color .15s ease, box-shadow .15s ease; }
.btn:active { transform: translateY(1px) scale(.99); }
.btn[disabled] { opacity: .42; cursor: not-allowed; }
.btn-sm { min-height: 44px; padding: 0 16px; font-size: 15px; }
.btn-block { width: 100%; }
.btn-cobalt { background: var(--cobalt); color: #fff; box-shadow: 0 10px 22px -12px rgba(31, 59, 208, .9); }
.btn-cobalt:hover { background: var(--cobalt-hi); }
.btn-milk { background: #FFF8EE; color: var(--cobalt-deep); box-shadow: 0 10px 24px -14px rgba(0, 0, 0, .6); }
.btn-milk:hover { background: #fff; }
.btn-line { background: transparent; color: #FFF8EE; border-color: rgba(255, 248, 238, .55); }
.btn-line:hover { border-color: #FFF8EE; background: rgba(255, 255, 255, .08); }
.btn-ghost { background: transparent; color: var(--pearl); border-color: rgba(27, 17, 12, .2); }
.btn-ghost:hover { border-color: var(--pearl); }
.btn-ink { background: var(--pearl); color: #FFF8EE; }
.btn-danger { background: var(--berry); color: #fff; }
.linkish { background: none; border: 0; padding: 10px 0; min-height: 44px; color: var(--cobalt); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; text-align: left; }
.linkish.on-dark, .hero .linkish { color: #FFF8EE; text-decoration-color: rgba(255, 248, 238, .5); }
.tag { display: inline-flex; align-items: center; min-height: 26px; padding: 2px 10px; border-radius: 999px; background: var(--porc-2); color: var(--pearl); font-size: 13px; font-weight: 650; }
.tag-cobalt { background: var(--cobalt); color: #fff; }
.tag-pandan { background: var(--pandan); color: #fff; }

/* ---------- sample label on small screens ---------- */
.sample-strip { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 30px; padding: 4px 12px; background: var(--mango); color: var(--pearl); font-size: 13px; font-weight: 700; text-align: center; }
@media (min-width: 560px) { .sample-strip { display: none; } }
.copybox textarea { width: 100%; min-height: 160px; padding: 14px; border-radius: 14px; border: 2px solid var(--cobalt); font-size: 16px; line-height: 1.5; background: #fff; }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 30; background: var(--cobalt); color: #FFF8EE; }
.top-admin { background: var(--navy); }
.top-in { display: flex; align-items: center; gap: 12px; max-width: var(--wrap); margin: 0 auto; padding: 10px var(--gut); min-height: 64px; }
.top-admin .top-in { max-width: none; padding: 10px 18px; }
@media (min-width: 1024px) { .top-admin .top-in { padding: 10px 28px; } }
.brand { display: inline-flex; align-items: center; gap: 8px; color: #FFF8EE; text-decoration: none; flex: none; min-height: 44px; }
.brand .logo { height: 30px; width: auto; }
.brand-en { font: 800 19px/1 var(--ui); font-stretch: 75%; letter-spacing: .04em; font-variation-settings: "opsz" 96; }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
.sample { display: none; font-size: 13px; font-weight: 650; color: var(--pearl); background: var(--mango); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.seg { display: inline-flex; background: rgba(255, 255, 255, .12); border-radius: 999px; padding: 3px; }
.seg-b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #FFF8EE; font-weight: 650; font-size: 14px; white-space: nowrap; }
.seg-b.on { color: var(--cobalt-deep); }
.view-seg .seg-b span { display: none; }
.view-seg .seg-b .ic { width: 20px; height: 20px; }
@media (min-width: 560px) { .sample { display: inline-block; } }
@media (min-width: 720px) { .view-seg .seg-b span { display: inline; } }
.view-member .view-seg .seg-b span { display: none; }
@media (min-width: 720px) and (max-width: 1023px) { .view-member .view-seg .seg-b span { display: inline; } }
@media (min-width: 1400px) { .view-member .view-seg .seg-b span { display: inline; } }
@media (max-width: 359px) { .brand-en { display: none; } .top-in { gap: 8px; } .seg-b { padding: 0 10px; } }
@media (min-width: 600px) { :root { --gut: 28px; } }
@media (min-width: 900px) { :root { --gut: 40px; } }
@media (min-width: 1100px) { :root { --gut: 56px; } }
@media (min-width: 900px) { .top-in { min-height: 72px; gap: 20px; } .brand .logo { height: 36px; } .brand-en { font-size: 22px; } }

/* member tabs: bottom bar on phones, pills in the header from 900px */
.mtabs-top { display: none; }
.mtabs-bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(5, 1fr); background: #FFFFFF; border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px -20px rgba(14, 26, 94, .5); }
.mtab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; border: 0; background: none; color: var(--ink-3); font-size: 12.5px; font-weight: 650; border-radius: 14px; position: relative; }
.mtab .ic { width: 24px; height: 24px; }
.mtab.on { color: var(--cobalt); }
.mtab.on::after { content: ""; position: absolute; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6E4A35, #2A160C 45%, #0D0604); }
.view-member .mmain { padding-bottom: 76px; }
@media (min-width: 900px) and (max-width: 1023px) { .toast { bottom: 96px; } }
.mtab span { white-space: nowrap; }
@media (min-width: 1024px) {
  .mtabs-bottom { display: none; }
  .mtabs-top { display: flex; gap: 2px; margin: 0 auto; }
  .mtabs-top .mtab { flex-direction: row; gap: 8px; min-height: 44px; padding: 0 14px; color: rgba(255, 248, 238, .82); font-size: 15px; }

/* ---------- member card ---------- */
.mcard-wrap { container-type: inline-size; perspective: 1600px; width: 100%; max-width: 460px; }
.mcard { position: relative; width: 100%; aspect-ratio: 1.586; border-radius: var(--r-card); transform-style: preserve-3d; transition: transform .75s cubic-bezier(.3, .8, .25, 1.05); }

.levelup { animation: bump .9s ease-out; }
@keyframes sheen { to { transform: translateX(120%); } }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.045); } 100% { transform: scale(1); } }

.mc-pts { position: absolute; left: 6.4cqw; bottom: 17cqw; display: flex; align-items: baseline; gap: 1.6cqw; }

.ticket { --stub: 96px; position: relative; display: grid; grid-template-columns: var(--stub) minmax(0, 1fr) auto; align-items: center; min-height: 104px; border-radius: var(--r-tk); background: #FFFFFF; box-shadow: 0 12px 26px -20px rgba(14, 26, 94, .55); -webkit-mask: radial-gradient(circle 10px at var(--stub) 0, transparent 9.5px, #000 10px) top / 100% 51% no-repeat, radial-gradient(circle 10px at var(--stub) 100%, transparent 9.5px, #000 10px) bottom / 100% 51% no-repeat; mask: radial-gradient(circle 10px at var(--stub) 0, transparent 9.5px, #000 10px) top / 100% 51% no-repeat, radial-gradient(circle 10px at var(--stub) 100%, transparent 9.5px, #000 10px) bottom / 100% 51% no-repeat; }

/* ================= motion ================= */
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeUp { from { transform: translateY(14px); opacity: 0; } }
@keyframes slideUp { from { transform: translateY(18px); opacity: 0; } }
@keyframes slideIn { from { transform: translateX(16px); opacity: 0; } }
@keyframes rowIn { from { transform: translateX(-22px); opacity: 0; } }
@keyframes pop { 0% { transform: scale(.6) rotate(-8deg); } 100% { transform: none; } }
@keyframes float { from { transform: translateY(0) rotate(0); } to { transform: translateY(-8px) rotate(-2deg); } }

/* ambient canvas behind the hero and cobalt page heads */
canvas.amb { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; }
.hero-in { z-index: 1; }
.hero-wave { z-index: 1; }
.ph-cobalt { position: relative; overflow: hidden; }
.ph-cobalt .ph-in { position: relative; z-index: 1; }

/* card: tilt layer + sheen */
.mc-tilt { transform-style: preserve-3d; will-change: transform; }
.mc-sheen { position: absolute; left: -50%; top: -50%; width: 100%; height: 100%; z-index: 2; pointer-events: none; transform: translate(30%, 20%); background: radial-gradient(closest-side, rgba(255, 255, 255, .34), rgba(255, 255, 255, 0)); }
.mcard.tier-fan .mc-sheen { background: radial-gradient(closest-side, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0)); }
.mcard.tier-devotee .mc-sheen { background: radial-gradient(closest-side, rgba(255, 214, 140, .32), rgba(255, 214, 140, 0)); }

/* the first three seconds */
.hero-h .ch { display: inline-block; }
@keyframes chIn { from { transform: translateY(.6em) rotate(5deg); opacity: 0; } }
.intro .hero-h .ch { animation: chIn .7s cubic-bezier(.2, .9, .25, 1.2) backwards; animation-delay: calc(140ms + var(--i) * 40ms); }
.intro .greet { animation: fadeUp .6s ease .05s backwards; }
@keyframes cardIn { from { transform: translateY(130px) rotate(-18deg) scale(.8); opacity: 0; } 55% { opacity: 1; } }
.intro .h-card .mcard-wrap { animation: cardIn 1.1s cubic-bezier(.2, .85, .25, 1.08) .3s backwards; }
@keyframes cupIn { from { transform: translateY(80px) scale(.88); opacity: 0; } }
.intro .h-cup .cupbox { animation: cupIn .9s cubic-bezier(.2, .8, .25, 1.1) .12s backwards; }
@keyframes teaUp { from { transform: translateY(210px); } }
.intro .cup .tea-g { animation: teaUp 1.15s cubic-bezier(.3, .7, .3, 1) .5s backwards; }
.intro .h-cta, .intro .h-tier, .intro .cup-cap { animation: fadeUp .7s ease 1.05s backwards; }
.intro .sb-fill { animation-delay: 1.6s; animation-duration: 1.4s; }

/* cups that live: the hero cup and the cup in the paid moment */
@keyframes wave { to { transform: translateX(120px); } }
@keyframes bubUp { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-160px); opacity: 0; } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-1.6px); } }
.cup .bubs circle { fill: rgba(255, 255, 255, .75); opacity: 0; }
.hero .cup .tea, .paid .cup .tea { animation: wave 3.6s linear infinite; }
.hero .cup .bubs circle, .paid .cup .bubs circle { transform-box: fill-box; animation: bubUp 4.2s ease-in infinite; animation-delay: calc(var(--i) * -.85s); }
.hero .cup .pearl:nth-child(odd) { animation: bob 2.9s ease-in-out infinite alternate; }
.hero .cup .pearl:nth-child(even) { animation: bob 2.4s ease-in-out -1.1s infinite alternate; }
.offscreen, .offscreen *, .offscreen::before, .offscreen::after, .offscreen *::before, .offscreen *::after,
html.page-hidden *, html.page-hidden *::before, html.page-hidden *::after { animation-play-state: paused !important; }
.hero.intro svg.cup .tea, .hero.intro svg.cup .bubs circle, .hero.intro svg.cup .pearl { animation-play-state: paused; }
.cup .thump { fill: none; stroke: #FFC531; stroke-width: 3; }

/* tier straw: fills with motion, tea flows inside */
.sb-fill { width: 100%; min-width: 0; overflow: hidden; transform: translateX(calc(var(--p, 0%) - 100%)); animation: fillIn 1.2s cubic-bezier(.2, .8, .2, 1) .2s backwards; }
@keyframes fillIn { from { transform: translateX(-100%); } }
.sb-fill::before { right: -15px; animation: flow 1.2s linear infinite; }
@keyframes flow { to { transform: translateX(-15px); } }

/* reward tiles flip */
.rtile { padding: 0; background: none; display: block; perspective: 1000px; }
.rt-in { display: grid; height: 100%; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.3, .8, .25, 1.05); }
.rt-face { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 14px 16px; border-radius: 24px; background: var(--tint, var(--tea)); min-width: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.rt-back { transform: rotateY(180deg); align-items: center; justify-content: center; text-align: center; background: var(--cobalt); color: #FFF8EE; gap: 8px; }
.rt-back b { font-size: 30px; color: var(--tea-hi); }
.rt-back p { font-size: 14.5px; max-width: 22ch; }
.rt-ok { width: 44px; height: 44px; padding: 8px; border-radius: 50%; background: var(--mango); color: var(--pearl); }
.rt-code { font-size: 20px; font-weight: 800; letter-spacing: .08em; }
.rtile.flip .rt-in { transform: rotateY(180deg); }
.flipin:not(.in) .rt-in { opacity: 0; }
@keyframes tileIn { from { transform: rotateY(-105deg); opacity: 0; } 45% { opacity: 1; } }
.flipin.in .rt-in { animation: tileIn .85s cubic-bezier(.2, .8, .2, 1.04) backwards; animation-delay: calc(var(--i, 0) * 90ms); }

/* lists arrive instead of appearing */
.tickets .ticket { animation: slideUp .55s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 70ms + 60ms); }
.receipt .order, .dt-orders .order { animation: slideUp .5s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 45ms); }
.mtable tbody tr { animation: rowIn .5s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 32ms); }
.tl { animation: slideUp .5s cubic-bezier(.2, .8, .2, 1) backwards; }
.tl:nth-child(2) { animation-delay: .08s; } .tl:nth-child(3) { animation-delay: .16s; }
.lk-msg.hit, .lk-msg.miss, .lk-msg.err { animation: slideUp .35s cubic-bezier(.2, .8, .2, 1); }

/* banners and posters */
.banners:not(.in) .banner { opacity: 0; }
.banners.in .banner { animation: slideUp .7s cubic-bezier(.2, .8, .2, 1) backwards; }
.banners.in .banner:nth-child(2) { animation-delay: .12s; }
@keyframes pearlPop { from { transform: scale(0) rotate(-120deg); } }
.banners.in .b-pearl { animation: pearlPop .9s cubic-bezier(.2, 1.4, .4, 1) .25s backwards; }
.b-art .cart, .poster.is-on .cart { animation: float 4.6s ease-in-out infinite alternate; }
.posters .poster { animation: slideUp .6s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms); }
.poster.flash { animation: none; }
.poster.flash .cart { animation: pop .7s cubic-bezier(.2, 1.5, .4, 1), float 4.6s ease-in-out .7s infinite alternate; }
.poster.flash .po-state { animation: pop .5s cubic-bezier(.2, 1.5, .4, 1); }

/* charts draw themselves */
.wk .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: barUp .8s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(150ms + var(--i) * 45ms); }
@keyframes barUp { from { transform: scaleY(0); } }
.wk .dlabel { animation: fadeIn .4s ease 1s backwards; }
.wk.quiet .bar, .wk.quiet .dlabel { animation: none; }
.tseg { transform-origin: left center; animation: segIn .8s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(200ms + var(--i, 0) * 140ms); }
.tseg.quiet { animation: none; }
@keyframes segIn { from { transform: scaleX(0); } }
.hb-bar { transform-origin: left center; animation: segIn .9s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(250ms + var(--i, 0) * 90ms); }
.hb-val { animation: fadeIn .4s ease backwards; animation-delay: calc(700ms + var(--i, 0) * 90ms); }
.hbars.quiet .hb-bar, .hbars.quiet .hb-val { animation: none; }
.kpis .kpi { animation: slideUp .55s cubic-bezier(.2, .8, .2, 1) backwards; }
.kpis .kpi:nth-child(2) { animation-delay: .06s; } .kpis .kpi:nth-child(3) { animation-delay: .12s; } .kpis .kpi:nth-child(4) { animation-delay: .18s; } .kpis .kpi:nth-child(5) { animation-delay: .24s; }
.live-dot { position: relative; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #3DDC84; margin-right: 8px; vertical-align: 1px; }
.live-dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #3DDC84; animation: ring 1.7s ease-out infinite; }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(2.8); opacity: 0; } }

/* live feed */
.ch-live .today { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 12px; }
.ch-live .today div { background: var(--porc); border-radius: 16px; padding: 10px 14px; }
.ch-live .today span { display: block; font-size: 13.5px; font-weight: 650; color: var(--ink-3); }

.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.feed-i { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; grid-template-areas: "cup what amt" "cup what when"; column-gap: 10px; align-items: center; padding: 8px 12px; border-radius: 14px; background: var(--porc); }
.feed-i .dcup-xs { grid-area: cup; }

/* counter feedback */
.drink.pop { animation: tilePop .38s cubic-bezier(.2, 1.6, .4, 1); }

.bl.new { animation: slideIn .4s cubic-bezier(.2, .8, .2, 1) backwards; }
.bubble { animation: bubbleIn .45s cubic-bezier(.2, 1.2, .4, 1) backwards; transform-origin: 100% 0; }
@keyframes bubbleIn { from { transform: translateY(10px) scale(.9); opacity: 0; } }
.stamp-prev svg { animation: pop .45s cubic-bezier(.2, 1.5, .4, 1); }

/* dialogs open and close with motion */
@keyframes dlgIn { from { transform: translateY(20px) scale(.96); opacity: 0; } }
@keyframes dlgOut { to { transform: translateY(14px) scale(.97); opacity: 0; } }
@keyframes sheetUp { from { transform: translateY(100%); } }
@keyframes sheetDown { to { transform: translateY(100%); } }

@keyframes bdOut { to { opacity: 0; } }
.dlg[open] .dlg-in { animation: dlgIn .34s cubic-bezier(.2, .85, .25, 1.06); }

.dlg.closing .dlg-in { animation: dlgOut .17s ease-in forwards; }
.dlg.closing::backdrop { animation: bdOut .17s ease-in forwards; }

.seg-pill { position: absolute; left: 0; top: 3px; bottom: 3px; width: 0; border-radius: 999px; background: #FFF8EE; transition: transform .25s cubic-bezier(.3, .8, .3, 1); }
.seg-b { position: relative; z-index: 1; }
.seg-b.on { background: transparent; }

/* page morphs */
@media (prefers-reduced-motion: no-preference) {

  function couponEffect(c) {
    if (c.kind === 'welcome') return { type: 'amount', amount: 2 };
    if (c.kind === 'birthday' || c.kind === 'stamp') return { type: 'free', count: 1 };

  function quote(mid, items, couponId) {
    var lines = [];
    items.forEach(function (x) { for (var k = 0; k < x.q; k++) lines.push(priceOf(x.id)); });
    lines.sort(function (a, b) { return b - a; });
    var subtotal = round2(lines.reduce(function (s, x) { return s + x; }, 0));

          for (var i = 0; i < freeCups; i++) discount += lines[i];
        } else if (ef.type === 'amount') {
          discount = Math.min(ef.amount, subtotal);
        }

    var total = round2(subtotal - discount);

      pts: q.pts, stamps: q.stamps, mult: q.mult, live: true, before: before, issued: 0
    };

      m.lifetime += q.pts;
      m.balance += q.pts;
      var total = m.stamps + q.stamps;
      var size = S.settings.stampSize;

/* ---------- clipboard: copy only, never send ---------- */
function copyText(text, okMsg) {
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.className = 'clip';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  var done = function (ok) {
    if (ok) { toast(okMsg); return; }
    // the viewer blocked the clipboard: show the text selected so it can be copied by hand
    sheet('<div class="copybox"><h2 class="disp dlg-h">' + esc(t('copy_title')) + '</h2><p class="dlg-p">' + esc(t('copy_manual')) + '</p><textarea readonly aria-label="' + esc(t('copy_title')) + '">' + esc(text) + '</textarea></div>', { cls: 'dlg-sm', focus: 'textarea' });
    var ta2 = document.querySelector('.copybox textarea');
    if (ta2) setTimeout(function () { try { ta2.focus(); ta2.select(); } catch (e) { /* ignore */ } }, 40);
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallback()); });
      return;
    }
  } catch (e) { /* fall through */ }
  done(fallback());
}

/* ---------- the landing moment: points roll, pearls drop, a full card pops a free cup ---------- */
function rollNumber(els, from, to, ms) {
  if (REDUCED || from === to) { els.forEach(function (e) { e.textContent = fmtN(to); }); return; }
  var t0 = null;
  function step(ts) {
    if (t0 === null) t0 = ts;
    var p = Math.min(1, (ts - t0) / ms), e = 1 - Math.pow(1 - p, 3);
    var v = from + (to - from) * e;
    els.forEach(function (el) { el.textContent = fmtN(v); });
    if (p < 1) requestAnimationFrame(step);
  }

}

function dropPearl(svg, slot, idx, delay) {
  var g = svg.querySelector('.pearls'), slots = svg.querySelector('.slots'), fx = svg.querySelector('.fx');
  if (!g) return;
  var gx = String(Math.round(slot.x * 10) / 10), gy = String(Math.round(slot.y * 10) / 10);
  var ghost = slots ? Array.prototype.filter.call(slots.querySelectorAll('.slot'), function (c) { return c.getAttribute('cx') === gx && c.getAttribute('cy') === gy; })[0] : null;
  if (ghost) {
    if (REDUCED) ghost.parentNode.removeChild(ghost);
    else setTimeout(function () { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, delay + 460);
  }
  g.insertAdjacentHTML('beforeend', ART.pearl(slot.x, slot.y, slot.r, 'pearl p' + idx + ' new'));
  var el = g.lastElementChild;
  if (REDUCED || !el.animate) return;

  el.animate([
    { transform: 'translate(0px,' + (-h) + 'px)', opacity: 0 },
    { transform: 'translate(0px,' + (-h * .8) + 'px)', opacity: 1, offset: .12 },
    { transform: 'translate(0px,0px) scale(1.14,.84)', offset: .66 },
    { transform: 'translate(0px,-9px) scale(.95,1.05)', offset: .82 },
    { transform: 'translate(0px,0px) scale(1,1)' }
  ], { duration: 760, delay: delay, easing: 'cubic-bezier(.45,0,.7,1)', fill: 'backwards' });
  if (fx) {
    setTimeout(function () {
      fx.insertAdjacentHTML('beforeend', '<ellipse class="ripple" cx="' + slot.x + '" cy="138" rx="9" ry="3" style="transform-origin:' + slot.x + 'px 138px"/>');
      var rp = fx.lastElementChild;
      var a = rp.animate([{ transform: 'scale(.4)', opacity: .9 }, { transform: 'scale(3.2)', opacity: 0 }], { duration: 640, easing: 'ease-out' });
      a.onfinish = function () { if (rp.parentNode) rp.parentNode.removeChild(rp); };
    }, delay + 90);
    // the thump: the pearl hits bottom, a ring spreads, the cup squashes
    setTimeout(function () {
      fx.insertAdjacentHTML('beforeend', '<circle class="thump" cx="' + slot.x + '" cy="' + slot.y + '" r="' + slot.r + '" style="transform-origin:' + slot.x + 'px ' + slot.y + 'px"/>');
      var th = fx.lastElementChild;
      var b2 = th.animate([{ transform: 'scale(1)', opacity: .95 }, { transform: 'scale(2.3)', opacity: 0 }], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)' });

    }, delay + 500);
  }
}

function land(root, before, after, info, done) {
  var S = DB.get(), size = S.settings.stampSize;
  var svg = root.querySelector('svg.cup');
  var ptsEls = Array.prototype.slice.call(root.querySelectorAll('[data-pts]'));
  var card = root.querySelector('.mcard');
  var note = root.querySelector('.land-note');
  var timeline = 0;
  function at(ms, fn) { if (REDUCED) fn(); else setTimeout(fn, ms); }

  // points

    var anchor = root.querySelector('.mc-pts');
    if (anchor && !REDUCED) {
      anchor.insertAdjacentHTML('beforeend', '<span class="gain num">+' + fmtN(info.pts) + '</span>');
      var gEl = anchor.lastElementChild;

        ga.onfinish = function () { if (gEl.parentNode) gEl.parentNode.removeChild(gEl); };
      }
    }
    rollNumber(ptsEls, before.balance, after.balance, 1100);
  } else {
    ptsEls.forEach(function (e) { e.textContent = fmtN(after.balance); });
  }

  // pearls
  var slots = ART.pile(size);
  var start = Math.min(before.stamps, size), added = info.stamps, filled = start, k = 0;
  var firstRun = Math.min(added, size - start);
  for (var i = 0; i < firstRun; i++) {
    dropPearl(svg, slots[filled], filled, REDUCED ? 0 : 300 + k * 240);
    filled++; k++;
  }
  timeline = 300 + k * 240 + 700;
  var completes = info.issued > 0;
  if (completes && svg) {
    at(timeline, function () {
      svg.classList.add('full');
      if (!REDUCED && svg.animate) svg.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-14px)' }, { transform: 'translateY(0)' }, { transform: 'translateY(-5px)' }, { transform: 'translateY(0)' }], { duration: 620, easing: 'ease-out' });
      var tk = root.querySelector('.free-ticket');
      if (tk) tk.classList.add('on');

      var olds = Array.prototype.slice.call(g.querySelectorAll('.pearl'));

      var sl = svg.querySelector('.slots');
      if (sl) sl.innerHTML = slots.map(function (s) { return '<circle class="slot" cx="' + Math.round(s.x * 10) / 10 + '" cy="' + Math.round(s.y * 10) / 10 + '" r="' + Math.round((s.r - 1) * 10) / 10 + '"/>'; }).join('');
    });
    timeline += 520;
    var rest = after.stamps;
    at(timeline, function () {
      for (var r = 0; r < rest; r++) dropPearl(svg, slots[r], r, REDUCED ? 0 : r * 240);
    });
    timeline += rest * 240 + 700;
  }

  if (after.tier !== before.tier && card) {
    at(timeline, function () {
      card.classList.add('levelup');
      setTimeout(function () {
        card.className = card.className.replace(/tier-\w+/, 'tier-' + after.tier);
        card.setAttribute('data-tier', after.tier);
        var lab = card.querySelector('[data-tierlabel]');

      setTimeout(function () { card.classList.remove('levelup'); }, REDUCED ? 0 : 1100);
      var up = root.querySelector('.tierup');
      if (up) up.classList.add('on');
    });
    timeline += 1100;
  }
  if (note) at(REDUCED ? 0 : Math.min(timeline, 900), function () { note.classList.add('on'); });
  at(timeline, function () { if (done) done(); });
  return timeline;
}

  function tickKpi(key, a, b, pct) {

    var chip = tile.lastElementChild;

  function drawWeekly(el, quiet) {
    var data = DB.weekly(12), W = Math.max(260, el.clientWidth), H = W > 600 ? 300 : 230, padL = 34, padB = 28, padT = 22, padR = 8;
    var max = Math.max.apply(null, data.map(function (d) { return d.orders; }));
    var stepV = max > 80 ? 40 : max > 40 ? 20 : 10, top = Math.ceil(max / stepV) * stepV || 10;
    var plotW = W - padL - padR, plotH = H - padT - padB, slot = plotW / data.length, bw = Math.min(24, slot * .62);
    var y = function (v) { return padT + plotH - v / top * plotH; };
    var s = '<svg class="wk' + (quiet ? ' quiet' : '') + '" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" tabindex="0" aria-label="' + esc(t('chart_keys')) + '">';
    for (var v = 0; v <= top; v += stepV) s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="grid"/><text x="' + (padL - 8) + '" y="' + (y(v) + 4) + '" class="tick" text-anchor="end">' + v + '</text>';
    var every = W < 420 ? 3 : W < 640 ? 2 : 1;
    data.forEach(function (d, i) {
      var x = padL + i * slot + (slot - bw) / 2, gm = d.member, gg = d.orders - d.member;
      var ym = y(gm), yg = y(gm + gg);
      var hm = padT + plotH - ym;
      s += '<g class="bar" style="--i:' + i + '">';
      // member segment from baseline, guest segment above with a 2px surface gap; rounded data-end on the top segment
      if (gg > 0) {
        s += '<rect x="' + x.toFixed(1) + '" y="' + ym.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0, hm).toFixed(1) + '" fill="' + CHART.member + '"/>';
        var gh = Math.max(0, ym - yg - 2);
        s += '<path d="' + roundTop(x, yg, bw, gh) + '" fill="' + CHART.guest + '"/>';
      } else {
        s += '<path d="' + roundTop(x, ym, bw, hm) + '" fill="' + CHART.member + '"/>';
      }
      s += '</g>';
      if (i % every === (data.length - 1) % every) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" class="tick" text-anchor="middle">' + esc(fmtDayShort(d.start)) + '</text>';
      if (i === data.length - 1) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (yg - 6).toFixed(1) + '" class="dlabel" text-anchor="middle">' + d.orders + '</text>';
      s += '<rect class="hit" x="' + (padL + i * slot).toFixed(1) + '" y="' + padT + '" width="' + slot.toFixed(1) + '" height="' + plotH + '" data-i="' + i + '"/>';
    });
    s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + (padT + plotH) + '" y2="' + (padT + plotH) + '" class="axis"/></svg>';
    el.innerHTML = s;
    var tip = el.parentNode.querySelector('.ctip');
    var cur = data.length - 1;
    function show(e) {
      var r = e.target.closest ? e.target.closest('.hit') : null;
      if (!r) return;
      showAt(+r.getAttribute('data-i'), r);
    }
    function showAt(i, r) {
      cur = i;
      r = r || el.querySelectorAll('.hit')[i];
      var d = data[i];
      el.querySelectorAll('.hit').forEach(function (h) { h.classList.toggle('on', h === r); });
      tip.innerHTML = '';
      var b = document.createElement('b'); b.textContent = t('tip_total', { n: d.orders });
      var p1 = document.createElement('span'); p1.textContent = fmtDay(d.start);
      var l1 = document.createElement('span'); l1.className = 'tk'; l1.innerHTML = '<i style="background:' + CHART.member + '"></i>'; l1.appendChild(document.createTextNode(d.member + ' ' + t('lg_member')));
      var l2 = document.createElement('span'); l2.className = 'tk'; l2.innerHTML = '<i style="background:' + CHART.guest + '"></i>'; l2.appendChild(document.createTextNode((d.orders - d.member) + ' ' + t('lg_guest')));
      tip.appendChild(b); tip.appendChild(p1); tip.appendChild(l1); tip.appendChild(l2);
      var rb = r.getBoundingClientRect(), pb = el.parentNode.getBoundingClientRect();
      var left = rb.left - pb.left + rb.width / 2;
      tip.style.left = Math.max(70, Math.min(pb.width - 70, left)) + 'px';
      tip.style.top = (rb.top - pb.top + 8) + 'px';
      tip.classList.add('on');
    }
    function hide() { tip.classList.remove('on'); el.querySelectorAll('.hit.on').forEach(function (h) { h.classList.remove('on'); }); }
    el.onpointermove = show; el.onpointerleave = hide;
    var svgEl = el.querySelector('svg');
    svgEl.addEventListener('focus', function () { showAt(cur); });
    svgEl.addEventListener('blur', hide);
    svgEl.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        showAt(Math.max(0, Math.min(data.length - 1, cur + (e.key === 'ArrowLeft' ? -1 : 1))));
      }
    });
  }

      '<section class="set-blk"><h2 class="blk-h">' + esc(t('set_tiers')) + '</h2>' +
      '<ol class="ladder"><li class="tier-fan"><b class="disp">' + esc(tierLabel('fan')) + '</b><span>' + esc(t('tier_from_join')) + '</span></li>' +
      '<li class="tier-friend"><b class="disp">' + esc(tierLabel('friend')) + '</b>' + stepper('friendAt', s.friendAt, 100, 50000, 100, t('set_friend'), '') + '</li>' +
      '<li class="tier-devotee"><b class="disp">' + esc(tierLabel('devotee')) + '</b>' + stepper('devoteeAt', s.devoteeAt, 200, 100000, 100, t('set_devotee'), '') + '</li></ol></section>' +
      '<section class="set-blk set-stamp"><h2 class="blk-h">' + esc(t('set_stamp')) + '</h2><div class="stamp-row"><div class="stamp-prev" data-stamp-prev>' + ART.cup({ size: s.stampSize, filled: Math.max(0, s.stampSize - 2), cls: 'cup cup-sm' }) + '</div>' +
      '<div>' + stepper('stampSize', s.stampSize, 5, 12, 1, t('set_stamp_size'), '') + '<p class="set-eg" data-eg-stamp>' + esc(t('set_stamp_eg', { n: s.stampSize, m: s.stampSize + 1 })) + '</p></div></div></section>' +
      '<p class="form-err" role="alert"></p><div class="set-save"><button class="btn btn-cobalt" type="submit">' + ic('check') + '<span>' + esc(t('save_settings')) + '</span></button>' +
      '<button class="btn btn-ghost" type="button" data-act="view" data-view="member">' + ic('phone') + '<span>' + esc(t('see_effect')) + '</span></button></div></form>' +
      '<section class="set-blk danger"><h2 class="blk-h">' + esc(t('sample_data')) + '</h2><p>' + esc(t('reset_body')) + '</p><button class="btn btn-danger" data-act="reset">' + ic('reset') + '<span>' + esc(t('reset_btn')) + '</span></button></section>';
  }

  /* ================= wiring ================= */
  function after() {
    var navOn = document.querySelector('.anav-b.on'), nav = document.querySelector('.anav');
    if (navOn && nav && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = Math.max(0, navOn.offsetLeft - 24);
    clearInterval(liveTimer); liveTimer = null;
    if (page === 'insights') {
      drawCharts();
      document.querySelectorAll('.kpi-v[data-v]').forEach(function (el) {
        var pct = el.hasAttribute('data-pct');
        MOTION.countUp(el, +el.getAttribute('data-v'), 1100, pct ? function (v) { return Math.round(v) + '%'; } : fmtN);
      });
      window.onresize = function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { if (VIEW === 'admin' && page === 'insights') drawCharts(true); }, 120); };
      if (!REDUCED) liveTimer = setInterval(liveTick, 5200);
    } else window.onresize = null;
    clearInterval(clockTimer);
    clockTimer = setInterval(function () {
      var c = document.querySelector('.clock-t');
      if (!c) { clearInterval(clockTimer); return; }
      var n = new Date();
      c.textContent = fmtDay(n.getTime()) + ' ' + clock(n);
    }, 20000);
  }

  function act(a, b) {
    if (a === 'page') { go(b.getAttribute('data-page')); return; }
    if (a === 'reset') {
      confirmSheet({
        title: t('reset_q'), body: t('reset_confirm_body'), yes: t('reset_yes'), danger: true,
        onYes: function () { DB.reset(); pos = { mid: null, guest: false, items: [], coupon: null, q: '', miss: '' }; mem = { q: '', tier: 'all', sort: 'recent' }; msg = { tpl: 'welcome', mid: null, edits: {} }; render(); toast(t('reset_done')); }
      });
      return;
    }
    /* counter */
    if (a === 'key') {
      var k = b.getAttribute('data-k'), inp = document.getElementById('posQ');
      if (!inp) return;
      if (k === 'clear') inp.value = '';
      else if (k === 'del') inp.value = inp.value.slice(0, -1);
      else inp.value += k;
      pos.q = inp.value;
      return;
    }
    if (a === 'pick') { doFind(b.getAttribute('data-q')); return; }
    if (a === 'guest') { pos.guest = true; pos.mid = null; pos.coupon = null; refreshPOS('.drink'); return; }
    if (a === 'change-member') { MOTION.morph(function () { pos.mid = null; pos.guest = false; pos.coupon = null; pos.miss = ''; pos.q = ''; refreshPOS('#posQ'); }, 'pos'); return; }
    if (a === 'add') {
      var id = b.getAttribute('data-id'), ex = pos.items.filter(function (x) { return x.id === id; })[0];
      lastAdd = { id: id, fresh: !ex };
      if (ex) ex.q += 1; else pos.items.push({ id: id, q: 1 });
      refreshPOS('.drink[data-id="' + id + '"]');
      return;
    }
    if (a === 'qty') {
      var qid = b.getAttribute('data-id'), d = +b.getAttribute('data-d');
      pos.items.forEach(function (x) { if (x.id === qid) x.q += d; });
      pos.items = pos.items.filter(function (x) { return x.q > 0; });
      refreshPOS(pos.items.some(function (x) { return x.id === qid; }) ? '.stp[data-id="' + qid + '"][data-d="' + d + '"]' : '.drink[data-id="' + qid + '"]');
      return;
    }
    if (a === 'clear-bill') { pos.items = []; pos.coupon = null; refreshPOS('.drink'); return; }
    if (a === 'pay') { pay(); return; }
    if (a === 'to-bill') {
      var bill = document.querySelector('.pos-bill');
      if (bill) { try { bill.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); } catch (e) { bill.scrollIntoView(); } var pb = bill.querySelector('.btn-pay'); if (pb && !pb.disabled) setTimeout(function () { try { pb.focus({ preventScroll: true }); } catch (e2) { /* ignore */ } }, 350); }
      return;
    }
    if (a === 'next-customer') { closeSheet(); pos.mid = null; pos.guest = false; pos.q = ''; pos.miss = ''; refreshPOS('#posQ'); return; }
    if (a === 'see-member') { DB.setCurrent(b.getAttribute('data-id')); closeSheet(); MEMBER.setTab('home'); setView('member'); return; }
    if (a === 'pos-redeem') { redeemSheet(); return; }
    if (a === 'pos-coupons') { couponSheet(); return; }
    if (a === 'pos-register') { registerSheet(); return; }
    if (a === 'pos-redeem-go') {
      var m = posMember(), r = DB.reward(b.getAttribute('data-id'));
      var c = DB.redeem(m.id, r.id, true);
      closeSheet();
      if (c) {
        var ef = DB.couponEffect(c);
        if (ef.type === 'free') pos.coupon = c.id;
        refreshPOS();
        toast(ef.type === 'free' ? t('redeemed_apply', { name: lbl(r) }) : t('redeemed_hand', { name: lbl(r) }));
      }
      return;
    }
    if (a === 'pos-apply') { pos.coupon = b.getAttribute('data-id'); closeSheet(); refreshPOS(); toast(t('voucher_applied')); return; }
    if (a === 'pos-use') {
      var used = DB.useCoupon(b.getAttribute('data-id'));
      closeSheet(); refreshPOS();
      if (used) toast(t('voucher_used', { name: MEMBER.couponTitle(used) }));
      return;
    }
    /* members */
    if (a === 'mfilter') { mem.tier = b.getAttribute('data-tier'); var host = document.querySelector('.amain'); render(); return; }
    if (a === 'open-detail') { detailSheet(b.getAttribute('data-id')); return; }
    if (a === 'to-counter') { closeSheet(); pos.mid = b.getAttribute('data-id'); pos.guest = false; pos.items = []; pos.coupon = null; pos.miss = ''; go('counter'); return; }
    if (a === 'to-message') { closeSheet(); msg.mid = b.getAttribute('data-id'); go('messages'); return; }
    /* campaigns */
    if (a === 'camp') {
      var cid = b.getAttribute('data-id'), now = !DB.camp(cid).on;
      DB.setCampaign(cid, now);
      flashCamp = cid;
      render();
      flashCamp = null;
      var sw = document.querySelector('.switch[data-id="' + cid + '"]');
      if (sw) sw.focus();
      toast(t(now ? 'camp_on' : 'camp_off', { name: t('c_' + cid) }));
      return;
    }
    /* messages */
    if (a === 'tpl') { msg.tpl = b.getAttribute('data-id'); render(); var tb = document.querySelector('.tpl[data-id="' + msg.tpl + '"]'); if (tb) tb.focus(); return; }
    if (a === 'copy-msg') {
      var S = DB.get(), mm = DB.member(msg.mid) || S.members[0];
      copyText(fillTpl(tplText(msg.tpl), mm), t('copied_msg_wa'));
      return;
    }
    if (a === 'tpl-restore') { delete msg.edits[L + msg.tpl]; render(); return; }
    /* settings */
    if (a === 'step') {
      var target = document.getElementById(b.getAttribute('data-for'));
      if (!target) return;
      var v = (parseInt(target.value, 10) || 0) + (+b.getAttribute('data-d'));
      v = Math.max(+target.min, Math.min(+target.max, v));
      target.value = v;
      liveSettings();
      return;
    }
  }

  function liveSettings() {
    var f = document.querySelector('form.settings');
    if (!f) return;
    var rate = parseInt(f.rate.value, 10) || 1, size = Math.max(5, Math.min(12, parseInt(f.stampSize.value, 10) || 9));
    var eg = f.querySelector('[data-eg-rate]'); if (eg) eg.textContent = t('set_rate_eg', { pts: fmtN(Math.floor(5.4 * rate)) });
    var es = f.querySelector('[data-eg-stamp]'); if (es) es.textContent = t('set_stamp_eg', { n: size, m: size + 1 });
    var pv = f.querySelector('[data-stamp-prev]'); if (pv) pv.innerHTML = ART.cup({ size: size, filled: Math.max(0, size - 2), cls: 'cup cup-sm' });
  }

  function submit(name, f) {
    if (name === 'pos-find') { doFind(f.q.value); return; }
    if (name === 'pos-register') {
      var err = f.querySelector('.form-err');
      if (!f.name.value.trim()) { err.textContent = t('err_name'); f.name.focus(); return; }
      var p = DB.normPhone(f.phone.value);
      if (!p) { err.textContent = t('phone_bad'); f.phone.focus(); return; }
      var res = DB.join({ name: f.name.value, phone: f.phone.value, bmonth: f.bmonth.value });
      if (res.error) { err.textContent = t('err_' + res.error); return; }
      closeSheet();
      pos.mid = res.member.id; pos.guest = false; pos.miss = ''; pos.q = '';
      refreshPOS('.drink');
      toast(t('registered', { name: nm(res.member) }));
      return;
    }
    if (name === 'settings') {
      var e2 = f.querySelector('.form-err');
      var fa = parseInt(f.friendAt.value, 10), da = parseInt(f.devoteeAt.value, 10);
      if (!(da > fa)) { e2.textContent = t('err_tiers'); f.devoteeAt.focus(); return; }
      e2.textContent = '';
      DB.setSettings({ rate: f.rate.value, friendAt: fa, devoteeAt: da, stampSize: f.stampSize.value });
      render();
      toast(t('saved'));
      return;
    }
  }

  function input(e) {
    var el = e.target, role = el.getAttribute && el.getAttribute('data-role');
    if (el.id === 'posQ') { pos.q = el.value; return; }
    if (role === 'msearch') {
      mem.q = el.value;
      var host = document.querySelector('.mlist');
      if (host) host.innerHTML = membersTable();
      return;
    }
    if (role === 'tpl-text') {
      msg.edits[L + msg.tpl] = el.value;
      var S = DB.get(), m = DB.member(msg.mid) || S.members[0];
      var bub = document.querySelector('[data-bubble]');
      if (bub) bub.innerHTML = esc(fillTpl(el.value, m)).replace(/\n/g, '<br>') + '<span class="b-time">' + esc(clock(new Date())) + '</span>';
      return;
    }
    if (el.form && el.form.getAttribute('data-form') === 'settings') liveSettings();
  }

  function change(e) {
    var el = e.target, role = el.getAttribute && el.getAttribute('data-role');
    if (role === 'coupon') { pos.coupon = el.value || null; refreshPOS('[data-role="coupon"]'); return; }
    if (role === 'msort') { mem.sort = el.value; var host = document.querySelector('.mlist'); if (host) host.innerHTML = membersTable(); return; }
    if (role === 'msg-member') { msg.mid = el.value; render(); var s = document.querySelector('[data-role="msg-member"]'); if (s) s.focus(); return; }
  }

  function key(e) {
    if (page !== 'counter' || document.getElementById('dlg').open) return;
    if (e.key === 'Enter' && e.target && e.target.id === 'posQ') return; // the form handles it
  }

  return { html: html, after: after, act: act, submit: submit, input: input, change: change, key: key, setPage: setPage, go: go };
})();

boot();
</script>
</body>
</html>
