<title>Dinamics 后台</title>
<style>
:root{--bg:#0A0A0B;--card:#121214;--ink:#F2EDE3;--ink2:#A39D92;--ink3:#77726A;--co:#D9B26B;--co2:#F3D48E;--line:rgba(217,178,107,.22);--hair:rgba(217,178,107,.12);--ok:#45C08F;--no:#E8735F;
  --sans:"Archivo","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px max(3vw,14px);background:rgba(10,10,11,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
header b{font-size:17px;letter-spacing:.02em;color:var(--co2)}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button,.chips button{border:1px solid var(--line);background:none;color:var(--ink2);border-radius:999px;padding:7px 13px;font:600 14px/1 var(--sans);cursor:pointer}
nav button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--co);color:#0A0A0B;border-color:var(--co)}
nav button .n{margin-left:6px;font-size:12px;opacity:.75}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl th{color:var(--ink2);font-weight:600}.tbl td a{color:inherit}
main{max-width:1200px;margin:0 auto;padding:18px max(3vw,14px) 80px}
h2{font-size:20px;margin:6px 0 14px}
h3{font-size:16px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.card{border:1px solid var(--hair);background:var(--card);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.sp{flex:1}
.muted{color:var(--ink2)}.small{font-size:13px}.mono{font-family:var(--mono);font-size:13px}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid var(--line);font:600 12.5px/1.3 var(--sans);color:var(--co2)}
.tag.ok{color:var(--ok);border-color:rgba(69,192,143,.35)}.tag.no{color:var(--no);border-color:rgba(232,115,95,.35)}.tag.dim{color:var(--ink3)}
button.b,a.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--ink);font:600 14px/1 var(--sans);cursor:pointer;text-decoration:none}
button.b.main{background:var(--co);border-color:var(--co);color:#0A0A0B}
button.b:disabled{opacity:.45;cursor:default}
button.b:hover:not(:disabled),a.b:hover{border-color:var(--co)}
input,select,textarea{background:#0E0E10;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:500 14px/1.3 var(--sans)}
textarea{width:100%;min-height:70px}
label{display:inline-flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pr{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:12px}
.pr dl{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;margin:10px 0 0;align-items:start}
.pr dt{color:var(--ink2);font-size:13px;white-space:nowrap}.pr dd{margin:0;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--hair);vertical-align:top}
th{color:var(--ink2);font-weight:600;font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1C1A16;border:1px solid var(--co);color:var(--ink);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
#toast.on{opacity:1}
[hidden]{display:none!important}
.login{max-width:440px;margin:10vh auto;text-align:center}
.login input{width:100%;margin:10px 0 0}
.login .face{width:100%;min-height:52px;font-size:16px;margin-top:20px}
.login .alt{margin-top:22px;padding-top:18px;border-top:1px solid var(--hair);text-align:left}
.login .err{color:var(--no);min-height:1.4em;margin:12px 0 0}
.login .ico{width:56px;height:56px;margin:0 auto 6px;color:var(--co2)}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.steps span{font-size:12px;padding:2px 8px;border-radius:6px;background:#19181A;color:var(--ink3)}
.steps span.on{background:rgba(217,178,107,.16);color:var(--co2)}
@media (max-width:640px){.pr dl{grid-template-columns:1fr auto}.pr dt{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

        h('tbody', {}, S.free.checks.map(c => h('tr', {}, h('td', {}, c.at), h('td', {}, h('a', { href: c.url, target: '_blank', rel: 'noopener nofollow' }, c.url.replace(/^https?:\/\//, ''))), h('td', {}, String(c.score)), h('td', {}, c.psi == null ? '—' : String(c.psi)), h('td', {}, c.n + ' 次'))))))
        : h('p', { cls: 'muted' }, '还没有人体检。'));
  }

  // ---------- 报备 ----------
  let lf = 'all';
  function leads() {
    const F = { all: () => true, asked: l => l.ext === 'asked', active: l => l.state === 'active', won: l => l.state === 'won', expired: l => l.state === 'expired', other: l => ['lost', 'void'].includes(l.state) };
    const names = { all: '全部', asked: '申请延长', active: '保护中', won: '已成交', expired: '过期', other: '没成 / 无效' };
    const list = S.leads.filter(F[lf]);
    $('#main').replaceChildren(
      h('div', { cls: 'row', style: 'margin-bottom:8px' }, h('h2', {}, '报备'), h('span', { cls: 'sp' }), csv('leads', '导出报备')),
      h('div', { cls: 'chips' }, Object.keys(names).map(k => h('button', { type: 'button', 'aria-pressed': String(lf === k), onclick: () => { lf = k; draw(); } }, names[k], ' ', S.leads.filter(F[k]).length))),
      ...(list.length ? list.map(l => h('div', { cls: 'card' },
        h('div', { cls: 'row' }, h('h3', {}, `#${l.id} ${l.company}`), h('span', { cls: 'tag' + (l.state === 'won' ? ' ok' : ['void', 'lost', 'expired'].includes(l.state) ? ' no' : '') }, LT[l.state] + (l.state === 'active' ? ` · 还剩 ${l.days_left} 天` : '')),
          h('span', { cls: 'sp' }), h('span', { cls: 'tag' }, l.agent)),
        h('p', { cls: 'small', style: 'margin:6px 0 0' }, [l.contact, l.phone, l.email, l.region, STAGE[l.stage]].filter(Boolean).join(' · ')),
        h('p', { style: 'margin:6px 0 0' }, l.need),
        h('p', { cls: 'small muted', style: 'margin:4px 0 0' }, `报备 ${l.created} · 保护到 ${l.expires}` + (l.note ? ' · ' + l.note : '')),
        l.ext === 'asked' ? h('div', { cls: 'pr' }, h('p', { style: 'margin:0' }, '申请延长 30 天：' + l.ext_note), h('div', { cls: 'row', style: 'margin-top:8px' },
          h('button', { cls: 'b main', type: 'button', onclick: () => act('lead', { id: l.id, ext: 'grant' }, '已延长 30 天') }, '批准延长'),
          h('button', { cls: 'b', type: 'button', onclick: () => act('lead', { id: l.id, ext: 'deny' }, '已拒绝') }, '不批'))) : null,
        l.state === 'active' ? h('div', { cls: 'row', style: 'margin-top:8px' },
          h('button', { cls: 'b', type: 'button', onclick: () => act('lead', { id: l.id, status: 'lost' }, '标为没成') }, '没成'),
          h('button', { cls: 'b', type: 'button', onclick: () => { const n = prompt('为什么无效（编造、抢别人的客人……）：'); if (n) act('lead', { id: l.id, status: 'void', note: n }, '已作废'); } }, '无效')) : null))
        : [h('p', { cls: 'muted' }, '这里没有。')]));
  }

  // ---------- 佣金 ----------
  function money() {
    const last = (() => { const [y, m] = S.month.split('-').map(Number); const d = new Date(Date.UTC(y, m - 2, 1)); return d.toISOString().slice(0, 7); })();
    const mi = h('input', { type: 'month', value: last, max: last, 'aria-label': '结哪个月' });
    const open = S.commissions.filter(c => !c.settled);
    const a1 = h('input', { placeholder: 'MY1001', size: 8, 'aria-label': '代理编号' }), a2 = h('input', { placeholder: '-50 或 120', inputmode: 'decimal', size: 9, 'aria-label': '金额' }),
      a3 = h('input', { placeholder: '说明：折扣自己出 / 本地服务费 5% …', 'aria-label': '说明' }), a4 = h('input', { placeholder: '报价单号（选填）', size: 13, 'aria-label': '报价单号' });
    $('#main').replaceChildren(
      h('div', { cls: 'row', style: 'margin-bottom:10px' }, h('h2', {}, '佣金'), h('span', { cls: 'sp' }), csv('commissions', '导出佣金明细'), csv('orders', '导出订单'), csv('receipts', '导出收据清单')),
      h('div', { cls: 'card' }, h('p', { style: 'margin:0 0 8px' }, '每月 1 日结上个月到账的单，15 日前付到代理登记的账户。'),
        h('div', { cls: 'row' }, mi, h('button', { cls: 'b main', type: 'button', onclick: () => act('settle', { month: mi.value }, '结算单已生成') }, '结算这个月'))),
      h('h3', { style: 'margin:18px 0 8px' }, '结算单'),
      S.settlements.length ? h('table', {}, h('tr', {}, h('th', {}, '月份'), h('th', {}, '代理'), h('th', { cls: 'num' }, 'US$'), h('th', {}, '付了吗'), h('th', {})),
        S.settlements.map(s => { const d = dateIn(), ref = h('input', { placeholder: '付款编号（选填）', size: 14 });
          return h('tr', {}, h('td', {}, s.month), h('td', {}, s.agent), h('td', { cls: 'num' }, s.amount), h('td', {}, s.paid ? `已付 ${s.paid} ${s.ref}` : '未付'),
            h('td', {}, s.paid ? '' : h('div', { cls: 'row' }, d, ref, h('button', { cls: 'b', type: 'button', onclick: () => act('settlement/paid', { id: s.id, date: d.value, ref: ref.value }, '记下已付') }, '已付')))); }))
        : h('p', { cls: 'muted' }, '还没有结算单。'),
      h('h3', { style: 'margin:22px 0 8px' }, `还没结算的（${open.length}）`),
      open.length ? h('table', {}, h('tr', {}, h('th', {}, '月份'), h('th', {}, '代理'), h('th', {}, '说明'), h('th', { cls: 'num' }, '基数'), h('th', { cls: 'num' }, '%'), h('th', { cls: 'num' }, '佣金')),
        open.map(c => h('tr', {}, h('td', {}, c.month), h('td', {}, c.agent), h('td', {}, c.note || c.kind), h('td', { cls: 'num' }, c.base), h('td', { cls: 'num' }, c.rate || ''), h('td', { cls: 'num' }, c.amount))))
        : h('p', { cls: 'muted' }, '没有。'),
      h('div', { cls: 'card', style: 'margin-top:18px' }, h('h3', {}, '加一笔调整'), h('p', { cls: 'small muted', style: 'margin:4px 0 8px' }, '代理给客人的折扣从他佣金里扣、外地成交给本地团队的 5%、其他手工调整。负数是扣。'),
        h('div', { cls: 'row' }, a1, a2, a3, a4, h('button', { cls: 'b main', type: 'button', onclick: () => act('adjust', { agent_code: a1.value, amount: a2.value, note: a3.value, quote_no: a4.value }, '已加上') }, '加上'))));
  }

  function log() {
    $('#main').replaceChildren(h('h2', {}, '记录（最近 200 条）'), h('table', {}, h('tr', {}, h('th', {}, '时间'), h('th', {}, '谁'), h('th', {}, '做了什么'), h('th', {}, '')),
      S.log.map(x => h('tr', {}, h('td', { cls: 'mono' }, x.at), h('td', {}, x.who), h('td', {}, x.what), h('td', { cls: 'mono' }, x.ref)))));
  }
  // ---------- 登录：哪几台设备能扫脸进来、密码、马上锁上 ----------
  async function me() {
    const box = h('div', {}, h('p', { cls: 'muted' }, '载入中…')); $('#main').replaceChildren(box);
    let f; try { f = await authApi('faces', null, key); } catch (e) { if (e.message === 'admin') return lock('登录已经过期，请重新扫脸。'); put(box, h('p', { cls: 'muted' }, '没载入成功，点「刷新」再试。')); return; }
    const err = h('p', { cls: 'small', style: 'color:var(--no);margin:8px 0 0' });
    put(box, 
      h('div', { cls: 'row', style: 'margin-bottom:10px' }, h('h2', {}, '能扫脸进来的设备'), h('span', { cls: 'sp' }), h('button', { cls: 'b', type: 'button', onclick: () => lock('已经锁上。') }, '马上锁上')),
      ...f.faces.map(x => h('div', { cls: 'card row' }, h('b', {}, x.name || '设备'), h('span', { cls: 'small muted' }, `登记 ${x.created}` + (x.used ? ` · 上次用 ${x.used}` : '')), h('span', { cls: 'sp' }),
        h('button', { cls: 'b', type: 'button', onclick: async () => { if (!confirm(`删掉「${x.name || '设备'}」？删了以后这台设备不能再扫脸进来。`)) return; try { await authApi('faces/delete', { id: x.id }, key); toast('删掉了'); me(); } catch (e) { err.textContent = why(e); } } }, '删掉'))),
      h('div', { cls: 'card' }, h('p', { style: 'margin:0 0 10px' }, '加一台设备（例如你的手机）：在那台设备上打开 dinamics.dev/admin、先扫脸或用密码进来，再按这个按钮；也可以在这里按，在弹出的窗口选「手机」扫二维码。'),
        canFace ? h('button', { cls: 'b main', type: 'button', onclick: async () => { err.textContent = ''; try { await faceCreate(key); toast('登记好了'); me(); } catch (e) { err.textContent = why(e); } } }, '登记这台设备 / 手机') : h('p', { cls: 'small muted' }, '这个浏览器不能扫脸。'), err),
      h('h2', { style: 'margin-top:22px' }, f.password ? '改密码' : '设一个备用密码'),
      h('div', { cls: 'card', style: 'max-width:420px' }, pwForm(f.password ? '改好了' : '设好了', async pw => { await authApi('password/set', { password: pw }, key); toast('密码设好了'); me(); }, true)),
      h('p', { cls: 'small muted' }, '10 分钟没有动作会自动锁上；手机或电脑丢了，在你的电脑上双击「重新登记我的脸.bat」，所有设备和密码作废、重新登记。'));
  }
  function csv(what, t) {
    return h('button', { cls: 'b', type: 'button', onclick: async () => {
      const r = await fetch(API + '/api/admin/export?what=' + what, { headers: { authorization: 'Bearer ' + key } }); if (r.status === 401) return lock('登录已经过期，请重新扫脸。'); if (!r.ok) return toast('导出失败');
      const u = URL.createObjectURL(await r.blob()), a = h('a', { href: u, download: `dinamics-${what}-${S.today}.csv` }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
    } }, t);
  }
  $('#reload').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
