<style>/* the film on the page (v2, 2026-11-22). DSJ 07:50: the film is shown, not hidden behind a button; it plays by itself with the sound on;
   visitors can mute it, like it and leave a note. Colours come from the page style; inside the picture the colours stay light. */
.fc{position:relative;margin:0;min-width:0}
.fc-frame{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;isolation:isolate;background:#000;border:1px solid rgba(var(--rgb),.36);
  box-shadow:0 60px 110px -60px #000,0 34px 70px -50px rgba(var(--rgb),.45);--ink:#F2EDE3;--ink2:#C9C3B8;color:#F2EDE3}
.fc-v{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;background:#000}
.fc-tap{position:absolute;inset:0;z-index:1;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fc-tap:focus-visible{outline:3px solid var(--co);outline-offset:-4px;border-radius:15px}

/* paused: one big play button over a dimmed picture */
.fc-big{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;background:radial-gradient(closest-side,rgba(0,0,0,.18),rgba(0,0,0,.46));opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.fc.is-paused .fc-big{opacity:1;visibility:visible}
.fc-big i{display:grid;place-items:center;width:clamp(60px,7vw,84px);aspect-ratio:1;border-radius:50%;background:var(--gold);box-shadow:0 14px 44px -12px rgba(var(--rgb),.9)}
.fc-big svg{width:36%;height:36%;margin-left:8%;fill:var(--on)}

/* sound: when the browser starts the film muted, one clear button turns the sound on */
.fc-sound{position:absolute;left:12px;top:12px;z-index:3;display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 17px 0 12px;border:0;border-radius:999px;
  background:rgba(8,8,10,.76);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1.5px rgba(var(--rgb),.9);
  color:#F2EDE3;font:600 14.5px/1 var(--sans);cursor:pointer;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .3s,transform .3s,visibility .3s}
.fc.is-blocked .fc-sound{opacity:1;visibility:visible;transform:none}
.fc-sound::after{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1.5px solid rgba(var(--rgb),.95);pointer-events:none;animation:fcring 2s cubic-bezier(.2,.6,.4,1) infinite}
@keyframes fcring{0%{transform:scale(1);opacity:.95}80%,100%{transform:scale(1.14,1.6);opacity:0}}
.fc-sound svg{width:20px;height:20px;flex:none}
.fc-sound:hover{background:rgba(24,21,16,.88)}

/* where the film is: a thin line along the bottom, draggable */
.fc-seek{position:absolute;left:0;right:0;bottom:-5px;z-index:3;width:100%;height:22px;margin:0;opacity:0;cursor:pointer}
.fc-line{position:absolute;left:0;right:0;bottom:0;z-index:2;height:3px;background:rgba(255,255,255,.18);pointer-events:none;transition:height .15s}
.fc-line i{display:block;width:100%;height:100%;transform-origin:left;transform:scaleX(var(--p,0));background:var(--co)}
.fc-frame:hover .fc-line,.fc-seek:focus-visible+.fc-line{height:6px}
.fc-seek:focus-visible+.fc-line{box-shadow:0 0 0 2px var(--co)}

/* the end: what did you think? */
.fc-end{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2vw,22px);padding:16px;text-align:center;
  background:rgba(6,6,8,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.fc.is-ended .fc-end{opacity:1;visibility:visible}
.fc-end p{margin:0;font:900 clamp(19px,2.3vw,30px)/1.3 var(--serif);color:#F2EDE3;text-wrap:balance}
.fc-end div{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.fc-end .fc-pill{background:rgba(8,8,10,.5)}

/* in full screen the frame fills the screen and gets its own close button */
.fc-xfs{position:absolute;right:16px;top:16px;z-index:5;display:none!important;background:rgba(8,8,10,.6)!important}
.fc-frame:fullscreen{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0}
.fc-frame:-webkit-full-screen{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0}
.fc-frame:fullscreen .fc-v{object-fit:contain}
.fc-frame:-webkit-full-screen .fc-v{object-fit:contain}
.fc-frame:fullscreen .fc-xfs{display:grid!important}
.fc-frame:-webkit-full-screen .fc-xfs{display:grid!important}

/* under the film: play, sound, full screen, time; like and leave a note */
.fc-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.fc-ib{position:relative;display:grid;place-items:center;flex:none;width:42px;height:42px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:border-color .2s,background-color .2s}
.fc-ib:hover{border-color:var(--co);background:rgba(var(--rgb),.08)}
.fc svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fc svg .f{fill:currentColor;stroke:none}
.fc-ib svg{width:19px;height:19px}
.fc-play .pa,.fc.is-playing .fc-play .pl{display:none}
.fc.is-playing .fc-play .pa{display:block}
.fc-mute .sx,.fc.is-muted .fc-mute .so{display:none}
.fc.is-muted .fc-mute .sx{display:block}
.fc.is-muted .fc-mute{border-color:rgba(var(--rgb),.7);color:var(--co2)}
.fc-time{margin-left:6px;font:500 13px/1 var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.fc-act{display:flex;gap:8px;margin-left:auto}
.fc-pill{position:relative;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 17px 0 13px;border-radius:999px;border:1.5px solid rgba(var(--rgb),.55);background:transparent;color:var(--ink);font:600 14.5px/1 var(--sans);white-space:nowrap;cursor:pointer;transition:border-color .2s,background-color .2s,color .2s}
.fc-pill:hover{border-color:var(--co);background:rgba(var(--rgb),.09)}
.fc-pill svg{width:19px;height:19px;flex:none;overflow:visible}
.fc-n{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
.fc-n:empty{display:none}
.fc-like[aria-pressed=true]{border-color:var(--co);color:var(--co2);background:rgba(var(--rgb),.13)}
.fc-like[aria-pressed=true] svg path{fill:var(--co);stroke:var(--co)}
.fc-like[aria-pressed=true] .fc-n{color:var(--co2)}
.fc-like .b{position:absolute;left:22px;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--co);pointer-events:none;animation:fcb .7s ease-out forwards}
@keyframes fcb{from{transform:rotate(var(--a)) translateX(4px) scale(1);opacity:1}to{transform:rotate(var(--a)) translateX(26px) scale(.25);opacity:0}}
.fc-like.pop svg{animation:fcpop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes fcpop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.fc-fbb[aria-expanded=true]{border-color:var(--co);background:rgba(var(--rgb),.11)}

/* leave a note */
.fc-fb{margin-top:14px;padding:clamp(16px,2vw,22px);border:1px solid var(--line);border-radius:14px;background:var(--tile)}
.fc-fb[hidden]{display:none}
.fc-fb-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fc-fb-t{margin:0;font:900 19px/1.3 var(--serif)}
.fc-x{display:grid;place-items:center;flex:none;width:38px;height:38px;padding:0;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer}
.fc-x svg{width:16px;height:16px}
.fc-x:hover{color:var(--ink);border-color:var(--co)}
.fc-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fc-chip{min-height:38px;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink2);font:600 14px/1.2 var(--sans);cursor:pointer}
.fc-chip:hover{border-color:var(--co);color:var(--ink)}
.fc-chip[aria-pressed=true]{border-color:var(--co);color:var(--co2);background:rgba(var(--rgb),.13)}
.fc-lab{display:block;margin-top:14px}
.fc-lab span{display:block;margin-bottom:7px;font:600 14px/1.3 var(--sans);color:var(--ink2)}
.fc-fb textarea,.fc-fb input[name=c]{display:block;width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans)}
.fc-fb textarea{min-height:92px;resize:vertical}
.fc-fb textarea:focus,.fc-fb input[name=c]:focus{outline:none;border-color:var(--co);box-shadow:0 0 0 3px rgba(var(--rgb),.22)}
.fc-fb ::placeholder{color:var(--ink3);opacity:1}
.fc-hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}
.fc-send{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:16px}
.fc-send .btn{height:46px}
.fc-send .btn:disabled{opacity:.6;cursor:default}
.fc-msg{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink2)}
.fc-msg:empty{display:none}
.fc-msg.err{color:var(--down)}
.fc-done{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;margin-top:12px}
.fc-done[hidden],.fc-body[hidden]{display:none}
.fc-ok{margin:0;font-size:16.5px;line-height:1.55;color:var(--ink)}
.fc-done .btn{height:42px}

@media (max-width:599px){
  .fc-frame{border-radius:12px}
  .fc-tap:focus-visible{border-radius:11px}
  .fc-sound{left:8px;top:8px;height:36px;gap:7px;padding:0 13px 0 9px;font-size:13.5px}
  .fc-sound svg{width:18px;height:18px}
  .fc-time{display:none}
  .fc-row{gap:7px;margin-top:12px}
  .fc-ib{width:40px;height:40px}
  .fc-act{gap:7px}
  .fc-pill{height:40px;gap:7px;padding:0 14px 0 11px;font-size:14px}
  .fc-end .fc-pill{height:38px}
}
@media (max-width:359px){.fc-full{display:none}}
@media (prefers-reduced-motion:reduce){
  .fc-sound::after{animation:none;opacity:0}
  .fc-big,.fc-end,.fc-sound,.fc-line{transition:none}
  .fc-like.pop svg{animation:none}
}
.fc-tall .fc-frame{aspect-ratio:9/16}</style>
</head>

if(LIVE)fetch(API+'/get'+PATH).then(r=>r.status===404?{value:0}:r.ok?r.json():null).then(j=>{if(j&&typeof j.value==='number'){n=Math.max(j.value,n||0);drawLike()}}).catch(()=>{});
/* leave a note: emailed to us */
const fbb=q('.fc-fbb'),FS='https://formsubmit.co/ajax/'+(C.mail||'contact@dinamics.dev');
function openFb(){FB.hidden=false;fbb.setAttribute('aria-expanded','true');
  setTimeout(()=>{FB.scrollIntoView({block:'nearest',behavior:RM.matches?'auto':'smooth'});const d=q('.fc-done');(d.hidden?FB.elements.m:d.querySelector('.fc-more')).focus({preventScroll:true})},40)}
function closeFb(){FB.hidden=true;fbb.setAttribute('aria-expanded','false');fbb.focus({preventScroll:true})}
fbb.addEventListener('click',()=>FB.hidden?openFb():closeFb());
qa('.fc-fbo').forEach(b=>b.addEventListener('click',openFb));
q('.fc-x').addEventListener('click',closeFb);
FB.addEventListener('keydown',e=>{if(e.key==='Escape')closeFb()});
qa('.fc-chip').forEach(b=>b.addEventListener('click',()=>b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'))));
let sending=false;
FB.addEventListener('submit',e=>{e.preventDefault();if(sending)return;const t=T(),el=FB.elements,m=el.m.value.trim(),c=el.c.value.trim(),msg=q('.fc-msg'),
  zh=C.words.zh,picks=qa('.fc-chip[aria-pressed=true]').map(b=>zh['fc_c'+b.dataset.k]);
  msg.className='fc-msg';msg.textContent='';
  if(el._honey&&el._honey.value)return;
  if(!m&&!picks.length){msg.textContent=t.fc_empty;msg.classList.add('err');el.m.focus();return}
  if(!LIVE){msg.textContent=t.fc_prev;return}
  sending=true;const sb=q('.fc-go');sb.disabled=true;sb.textContent=t.fc_sending;
  const body={_subject:'Dinamics · '+C.name+' · 收到一条留言',_template:'table',_captcha:'false','视频':C.name,'页面':location.href.split('#')[0],
    '语言':C.lang()==='zh'?'中文':'英文','快选':picks.join('、')||'—','留言':m||'—','联系方式':c||'—'};
  if(/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(c))body._replyto=c;
  fetch(FS,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)})
    .then(r=>r.ok?r.json():Promise.reject(r.status)).then(()=>{const d=q('.fc-done');FB.reset();qa('.fc-chip').forEach(b=>b.setAttribute('aria-pressed','false'));
      q('.fc-body').hidden=true;d.hidden=false;d.dataset.c=c?'1':'';d.querySelector('.fc-ok').textContent=c?T().fc_okc:T().fc_ok;d.querySelector('.fc-more').focus({preventScroll:true})})
    .catch(()=>{msg.textContent=T().fc_err;msg.classList.add('err')})
    .finally(()=>{sending=false;sb.disabled=false;sb.textContent=T().fc_send})});
q('.fc-more').addEventListener('click',()=>{q('.fc-done').hidden=true;q('.fc-body').hidden=false;FB.elements.m.focus()});
if(!armed){const lz=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){lz.disconnect();arm()}},{rootMargin:'120px 0px'});lz.observe(F)}

R.addEventListener('keydown',e=>e.stopPropagation());
C.on(l=>{setSrc(l);words();drawLike();cls()});
tick();cls()})();</script>
