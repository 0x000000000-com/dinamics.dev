<div class="up">${lv ? liveCard(lv) : ''}${up ? nextCard(up) : ''}</div>
<section class="sec"><div class="sech"><h2>${esc(T('home.book'))}</h2><button type="button" class="lk" data-tab="book">${esc(T('home.prices'))} ${I('right', 's')}</button></div>
<div class="svgrid">${SVC.map(s => `<button type="button" class="svc" style="background:${s.bg}" data-a="book:${s.id}"><i>${I(s.icon, 'l')}</i><b>${esc(L(s.n))}</b><small>${esc(T('from', { v: money(s.p[0]) }))} · ${esc(T('mins', { m: s.min[0] }))}</small></button>`).join('')}</div></section>
<section class="sec"><div class="punch"><div class="sech"><h2>${esc(T('punch.t'))}</h2><small>${esc(S.punch >= 10 ? T('punch.full') : T('punch.n', { n: 10 - S.punch }))}</small></div>${punchRow()}</div></section>
<section class="sec"><div class="sech"><h2>${esc(T('home.rem'))}</h2></div><div class="card">${dues().slice(0, 3).map(o => `<div class="row"><i class="ri${o.d < 0 ? ' late' : ''}">${I('syringe', 'm')}</i><span><b>${esc(T('rem.vax', { n: o.p.n, v: L(VAX[o.x.k]) }))}</b><small>${esc(o.d < 0 ? T('rem.late', { n: -o.d }) : T('rem.in', { n: o.d }))}</small></span><button type="button" class="lk" data-a="go:pet:${o.p.id}">${esc(T('see'))}</button></div>`).join('')}</div></section>
<section class="sec"><div class="sech"><h2>${esc(T('home.pros'))}</h2></div><div class="hs pros" data-keep="pros">${PROS.map(g => `<button type="button" class="proc" data-a="pro:${g.id}">${face(g)}<b>${esc(g.n)}</b>${stars(g.rate)}<small>${esc(T('pro.yrs', { n: g.yrs }))}</small></button>`).join('')}</div></section></div>`;
  }
});
K.on('go', ([n, a]) => K.go(n, a ? { id: a } : {}));
K.on('pro', ([id]) => { const g = PRO[id]; K.sheet(`<div class="sbody prosh">${face(g, 'lg')}<h2>${esc(g.n)}</h2><p class="pl">${stars(g.rate)} · ${esc(T('pro.jobs', { n: g.jobs.toLocaleString('en-US') }))} · ${esc(T('pro.yrs', { n: g.yrs }))}</p><p>${esc(L(g.tag))}</p><button type="button" class="btn wide" data-a="bookpro:${g.id}">${esc(T('pro.book', { n: g.n }))}</button></div>`); });

/* ---------- prices: the Book tab ---------- */
K.def('book', { icon: 'cal', label: 'tab.book',
  render() {
    const sz = S.psize || 'M', si = SIZES.indexOf(sz);
    return `<header class="pt sat"><h1>${esc(T('book.t'))}</h1></header><div class="body">
<div class="sec first"><div class="seg">${SIZES.map(z => `<button type="button" data-a="psize:${z}" aria-pressed="${z === sz}">${esc(T('size.' + z))}</button>`).join('')}</div><p class="hint l2">${esc(T('size.' + sz + '.h'))}</p></div>
<div class="sec slist">${SVC.map(s => `<article class="srow"><i style="background:${s.bg}">${I(s.icon, 'l')}</i><div><h3>${esc(L(s.n))}</h3><p>${esc(L(s.d))}</p><span><b class="pr">${money(s.p[si])}</b><small>${esc(T('mins', { m: s.min[si] }))}</small></span></div><button type="button" class="btn sm" data-a="book:${s.id}">${esc(T('book.go'))}</button></article>`).join('')}</div>
<section class="sec"><div class="sech"><h2>${esc(T('book.adds'))}</h2></div><div class="card">${ADDS.map(a => `<div class="row"><i class="ri">${I(a.icon, 'm')}</i><span><b>${esc(L(a.n))}</b></span><em class="pr">+${money(a.p)}</em></div>`).join('')}</div></section>
<section class="sec"><div class="card salon"><div class="smap">${cityMap({ land: '#FFF1E4', road: '#FFFFFF', edge: '#F3DCC8', park: '#D8EFD9', tree: '#BFE3C2', water: '#CFE6F7', block: '#FBE4D2', vb: '60 70 260 130', extra: '<g transform="translate(190 150)"><path d="M0 0c-9-11-14-17-14-24a14 14 0 0 1 28 0c0 7-5 13-14 24z" fill="#FF7B3A" stroke="#fff" stroke-width="2"/><circle cy="-24" r="5" fill="#fff"/></g>' })}</div>
<div class="row">${I('store')}<span><b>${esc(T('salon.full'))}</b><small>${esc(T('salon.addr'))}</small></span></div><div class="row">${I('clock')}<span><b>${esc(T('salon.h'))}</b><small>${esc(T('salon.h2'))}</small></span></div><div class="row">${I('car')}<span><b>${esc(T('taxi.t'))}</b><small>${esc(T('taxi.s'))}</small></span></div></div></section></div>`;
  }
});
K.on('psize', ([z]) => { S.psize = z; K.draw(); });

/* ---------- booking, five steps ---------- */
const newB = o => Object.assign({ step: 1, pet: S.pets[0].id, svc: null, adds: new Set(), pro: 'any', day: 1, slot: null, mode: 'self', note: '' }, o || {});
K.on('book', ([svc]) => { B = newB({ svc, step: 1 }); K.go('flow'); });
K.on('bookpro', ([id]) => { B = newB({ pro: id }); K.closeSheet(true); K.go('flow'); });
const fOK = () => [0, B.pet, B.svc, B.pro, B.slot, true][B.step];
const fstep = {
  1: () => `<h2 class="fq">${esc(T('f1.q'))}</h2><div class="pcards">${S.pets.map(p => `<button type="button" class="pcard" data-a="fpet:${p.id}" aria-pressed="${B.pet === p.id}">${ptile(p)}<span><b>${esc(p.n)}</b><small>${esc(L(p.breed))}</small><small>${esc(T('size.' + p.size))} · ${p.kg[p.kg.length - 1]} kg</small></span><i class="radio"></i></button>`).join('')}
<button type="button" class="pcard dash" data-a="addpet"><span class="ptile">${I('plus')}</span><span><b>${esc(T('pet.add'))}</b><small>${esc(T('pet.adds'))}</small></span></button></div>`,
  2: () => { const p = pet(B.pet); return `<h2 class="fq">${esc(T('f2.q', { n: p.n }))}</h2><div class="scards">${SVC.map(s => `<button type="button" class="scard" data-a="fsvc:${s.id}" aria-pressed="${B.svc === s.id}"><i style="background:${s.bg}">${I(s.icon, 'l')}</i><span><b>${esc(L(s.n))}</b><small>${esc(L(s.d))}</small><em><b class="pr">${money(priceOf(s.id, p))}</b> · ${esc(T('mins', { m: minsOf(s.id, p) }))}</em></span><i class="radio"></i></button>`).join('')}</div>
<h3 class="fh">${esc(T('book.adds'))}</h3><div class="addl">${ADDS.map(a => `<button type="button" data-a="fadd:${a.id}" aria-pressed="${B.adds.has(a.id)}">${I(a.icon, 'm')}<span>${esc(L(a.n))}</span><small>+${money(a.p)}</small></button>`).join('')}</div>`; },
  3: () => `<h2 class="fq">${esc(T('f3.q'))}</h2><div class="gcards"><button type="button" class="gcard" data-a="fpro:any" aria-pressed="${B.pro === 'any'}"><span class="face any">${I('paw', 'l')}</span><span><b>${esc(T('pro.any'))}</b><small>${esc(T('pro.anys'))}</small></span><i class="radio"></i></button>
${PROS.map(g => `<button type="button" class="gcard" data-a="fpro:${g.id}" aria-pressed="${B.pro === g.id}">${face(g)}<span><b>${esc(g.n)} ${stars(g.rate)}</b><small>${esc(L(g.tag))}</small></span><i class="radio"></i></button>`).join('')}</div>`,
  4: () => `<h2 class="fq">${esc(T('f4.q'))}</h2><div class="hs days" data-keep="days">${Array.from({ length: 14 }, (_, i) => { const d = plus(i); return `<button type="button" class="dayb" data-a="fday:${i}" aria-pressed="${B.day === i}"><small>${esc(i === 0 ? T('today') : dstr(d, { weekday: 'short' }))}</small><b>${d.getDate()}</b></button>`; }).join('')}</div>
<p class="fday">${esc(dstr(plus(B.day), { weekday: 'long', month: 'long', day: 'numeric' }))}</p><div class="slots">${SLOTS.map((s, i) => `<button type="button" data-a="fslot:${s}" aria-pressed="${B.slot === s}"${slotFull(B.day, i, B.pro) ? ' disabled' : ''}>${s}</button>`).join('')}</div><p class="hint">${esc(T('f4.hint'))}</p>`,
  5: () => { const p = pet(B.pet), a = S.addrs.find(x => x.id === S.addr);
    return `<h2 class="fq">${esc(T('f5.q', { n: p.n }))}</h2><div class="modes">${[['self', 'walk'], ['taxi', 'car']].map(m => `<button type="button" data-a="fmode:${m[0]}" aria-pressed="${B.mode === m[0]}">${I(m[1], 'l')}<b>${esc(T('mode.' + m[0]))}</b><small>${esc(T('mode.' + m[0] + '.s'))}</small></button>`).join('')}</div>
${B.mode === 'taxi' ? `<div class="card"><button type="button" class="row" data-a="addrsheet">${I('pin')}<span><b>${esc(L(a.n))}</b><small>${esc(L(a.a))}</small></span>${I('right', 's')}</button></div>` : ''}
<label class="fld"><span>${esc(T('f5.note'))}</span><input data-in="fnote" value="${esc(B.note)}" placeholder="${esc(T('f5.noteph'))}" maxlength="60"></label>
<div class="card fsum"><div class="fsh">${ptile(p, '', 'sm')}<span><b>${esc(p.n)} · ${esc(L(SV[B.svc].n))}</b><small>${esc(dayLabel(plus(B.day)))} ${B.slot} · ${esc(B.pro === 'any' ? T('pro.any') : PRO[B.pro].n)}</small></span></div>
<div class="sum"><p><span>${esc(L(SV[B.svc].n))} · ${esc(T('size.' + p.size))}</span><b>${money(priceOf(B.svc, p))}</b></p>${[...B.adds].map(x => `<p><span>${esc(L(AD[x].n))}</span><b>${money(AD[x].p)}</b></p>`).join('')}${B.mode === 'taxi' ? `<p><span>${esc(T('taxi.t'))}</span><b>${money(12)}</b></p>` : ''}<p class="tot"><span>${esc(T('sum.total'))}</span><b>${money(total(B))}</b></p></div></div>
<div class="card"><button type="button" class="row" data-a="paysheet">${I(PAYI[S.pay])}<span><b>${esc(T('pay.t'))}</b></span><em>${esc(T('pay.' + S.pay))}</em>${I('right', 's')}</button></div><p class="hint">${esc(T('f5.hint'))}</p>`; }
};
K.def('flow', {
  render() {
    const st = B.step, p = pet(B.pet);
    return `<header class="bar sat"><div><button type="button" class="ib" data-a="fback" aria-label="${esc(T('k.back'))}">${I(st === 1 ? 'x' : 'left')}</button><h1>${esc(T('flow.t'))}</h1><i class="ib num">${st}/5</i></div><div class="fprog">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= st ? 'on' : ''}"></i>`).join('')}</div></header>
<div class="body fbody">${fstep[st]()}</div>
<footer class="foot pfoot"><div>${B.svc ? `<small>${esc(T('sum.total'))}</small><b>${money(total(B))}</b>` : `<small>${esc(T('flow.step', { n: st }))}</small><b>${esc(p.n)}</b>`}</div><button type="button" class="btn" data-a="fnext"${fOK() ? '' : ' disabled'}>${esc(st === 5 ? T('f5.pay') : T('next'))}</button></footer>`;
  }
});
const fset = (k, v) => { B[k] = v; K.draw(); };
K.on('fpet', ([id]) => fset('pet', id)); K.on('fsvc', ([id]) => fset('svc', id)); K.on('fpro', ([id]) => { B.slot = null; fset('pro', id); });
K.on('fadd', ([id]) => { B.adds.has(id) ? B.adds.delete(id) : B.adds.add(id); K.draw(); });
K.on('fday', ([i]) => { B.slot = null; fset('day', +i); }); K.on('fslot', ([h, m]) => fset('slot', h + ':' + m)); K.on('fmode', ([m]) => fset('mode', m));
K.ins.fnote = v => { B.note = v; };
K.on('fback', () => { if (B.step === 1) return K.back(); B.step--; K.draw(); $('.fbody', K.topEl()).scrollTop = 0; });
K.on('fnext', () => {
  if (!fOK()) return;
  if (B.step < 5) { B.step++; K.draw(); $('.fbody', K.topEl()).scrollTop = 0; return; }
  K.sheet(`<div class="sbody paying"><i class="spin"></i><h2>${esc(S.pay === 'shop' ? T('pay.hold') : T('pay.ing'))}</h2><p>${money(total(B))} · ${esc(T('pay.' + S.pay))}</p></div>`);
  K.after(1400, () => {
    const v = { id: 'PW-' + (2360 + S.seq++), pet: B.pet, svc: B.svc, adds: [...B.adds], pro: B.pro === 'any' ? 'sofia' : B.pro, date: plus(B.day), slot: B.slot, mode: B.mode, stage: 0, total: total(B), isNew: 1 };
    S.visits.push(v); B = null; K.closeSheet(true); K.tab('visits', true); K.go('ticket', { id: v.id });
  });
});
K.on('addrsheet', () => K.sheet(() => `<div class="sbody"><h2 class="sh">${esc(T('addr.t'))}</h2><div class="plist">${S.addrs.map(a => `<button type="button" class="row" data-a="setaddr:${a.id}" aria-pressed="${S.addr === a.id}">${I(a.id === 'home' ? 'house' : 'store')}<span><b>${esc(L(a.n))}</b><small>${esc(L(a.a))}</small></span><i class="radio"></i></button>`).join('')}</div><p class="hint">${esc(T('addr.hint'))}</p></div>`));
K.on('setaddr', ([id]) => { S.addr = id; K.closeSheet(); K.draw(); });
K.on('paysheet', () => K.sheet(() => `<div class="sbody"><h2 class="sh">${esc(T('pay.t'))}</h2><div class="plist">${PAYS.map(p => `<button type="button" class="row" data-a="setpay:${p}" aria-pressed="${S.pay === p}">${I(PAYI[p])}<span><b>${esc(T('pay.' + p))}</b><small>${esc(T('pay.' + p + '.s'))}</small></span><i class="radio"></i></button>`).join('')}</div></div>`));
K.on('setpay', ([p]) => { S.pay = p; K.closeSheet(); K.draw(); });

/* ---------- the ticket ---------- */
const ticket = (v, big) => { const p = pet(v.pet), g = PRO[v.pro]; return `<div class="tk"><div class="tkh" style="background:${TILES[p.tile % TILES.length]}">${petArt(p, '')}<span><small>${esc(v.id)}</small><b>${esc(p.n)}</b><em>${esc(svcLine(v))}</em></span></div>
<dl class="tkb"><div><dt>${esc(T('tk.day'))}</dt><dd>${esc(dayLabel(v.date))}</dd></div><div><dt>${esc(T('tk.time'))}</dt><dd>${v.slot}</dd></div><div><dt>${esc(T('tk.pro'))}</dt><dd>${esc(g.n)}</dd></div><div><dt>${esc(T('tk.how'))}</dt><dd>${esc(T('mode.' + v.mode))}</dd></div></dl>
${big ? `<div class="tkq">${qr('ticket', 148)}<p>${esc(T('tk.qr'))}</p></div>` : ''}</div>`; };
K.def('ticket', { cls: 'up', up: true, strip: 8,
  render(p) { const v = visit(p.id); return `<div class="body tkscr sat"><div class="okmark">${I('check', 'l')}</div><h1>${esc(T('tk.ok'))}</h1><p class="tks">${esc(T('tk.oks', { n: pet(v.pet).n }))}</p>${ticket(v, true)}
<button type="button" class="btn wide" data-a="tovisits">${esc(T('tk.see'))}</button><button type="button" class="btn ghost wide" data-a="demo:cal">${I('cal', 's')} ${esc(T('tk.cal'))}</button></div>`; }
});
K.on('tovisits', () => K.tab('visits'));
K.on('demo', ([k]) => K.toast(T('demo.' + k)));

/* ---------- visits ---------- */
const vcard = v => { const p = pet(v.pet); return `<button type="button" class="vcard" data-a="go:visit:${v.id}">${ptile(p, v.stage === 6 ? 'done' : '', 'sm')}<span><b>${esc(p.n)} · ${esc(L(SV[v.svc].n))}</b><small>${esc(dayLabel(v.date))} ${v.slot} · ${esc(PRO[v.pro].n)}</small></span>${v.stage === 6 ? (v.stars ? stars(v.stars) : `<i class="chip on">${esc(T('rep.rate'))}</i>`) : `<i class="chip">${esc(daysTo(v.date) > 0 ? T('vis.in', { n: daysTo(v.date) }) : T('today'))}</i>`}</button>`; };
K.def('visits', { icon: 'ticket', label: 'tab.visits', badge: () => live() ? 1 : 0,
  render() { const lv = live(), up = upcoming(), ps = past();
    return `<header class="pt sat"><h1>${esc(T('tab.visits'))}</h1></header><div class="body">${lv ? `<section class="sec first"><h2 class="sl">${esc(T('today'))}</h2>${liveCard(lv)}</section>` : ''}
<section class="sec${lv ? '' : ' first'}"><h2 class="sl">${esc(T('vis.up'))}</h2>${up.length ? up.map(vcard).join('') : `<div class="empty sm">${I('cal', 'l')}<p>${esc(T('vis.none'))}</p><button type="button" class="btn sm" data-tab="book">${esc(T('book.go'))}</button></div>`}</section>
<section class="sec"><h2 class="sl">${esc(T('vis.past'))}</h2>${ps.map(vcard).join('')}</section></div>`; }
});
function adv(v, n) {
  if (n <= v.stage) return; v.stage = n; v.ts[n] = new Date();
  if (n === 2) { S.chat[v.id].push({ w: 'pro', photo: 'bath', t: new Date() }, { w: 'pro', k: 'chat.c2', t: new Date() }); v.unread = 1; }
  if (n === 5) K.note(T('note.t', { n: pet(v.pet).n }), T('note.b'), 'paw', 'go:visit:' + v.id);
  K.draw();
}
K.def('visit', { strip: 250,
  render(q) {
    const v = visit(q.id), p = pet(v.pet), g = PRO[v.pro];
    if (v.stage === 0) return bar(T('vis.t')) + `<div class="body pad">${ticket(v, true)}<div class="tact two"><button type="button" class="btn ghost sm" data-a="demo:move">${I('cal', 's')} ${esc(T('vis.move'))}</button><button type="button" class="btn ghost sm" data-a="demo:cancel">${esc(T('vis.cancel'))}</button></div><p class="hint">${esc(T('vis.rule'))}</p></div>`;
    if (v.stage === 6) return bar(T('vis.t')) + `<div class="body pad">${ticket(v)}<div class="sum card padc"><p><span>${esc(svcLine(v))}</span><b>${money(v.total)}</b></p><p><span>${esc(T('pay.t'))}</span><b>${esc(T('pay.card'))}</b></p></div><button type="button" class="btn wide" data-a="go:report:${v.id}">${I('note', 's')} ${esc(T('rep.see'))}</button><button type="button" class="btn ghost wide" data-a="again:${v.id}">${esc(T('vis.again'))}</button></div>`;
    const steps = [1, 2, 3, 4, 5];
    return `<div class="body"><div class="vhero sat" style="background:${TILES[p.tile % TILES.length]}"><div class="vbar"><button type="button" class="ib glassb" data-back aria-label="${esc(T('k.back'))}">${I('left')}</button><span>${esc(v.id)}</span><button type="button" class="ib glassb" data-a="go:chat:${v.id}" aria-label="${esc(T('chat.t', { n: g.n }))}">${I('chat')}${v.unread ? '<i class="pip"></i>' : ''}</button></div>
<div class="vart st${v.stage}">${petArt(p, stageArt(v))}</div></div>
<div class="vsheet"><h1>${esc(T('st.' + STAGES[v.stage] + '.l', { n: p.n }))}</h1><p class="veta">${esc(v.stage < 5 ? T('live.eta', { t: v.eta }) : T('live.come'))}</p>
<div class="vprog">${steps.map(i => `<i class="${i < v.stage ? 'done' : i === v.stage ? 'now' : ''}"></i>`).join('')}</div>
<ol class="steps">${steps.map(i => `<li class="${i < v.stage ? 'done' : i === v.stage ? 'now' : ''}"><i>${i < v.stage || (i === 5 && v.stage === 5) ? I('check', 's') : ''}</i><b>${esc(T('st.' + STAGES[i]))}</b><small>${v.ts[i] ? hm(v.ts[i]) : ''}</small></li>`).join('')}</ol>
<button type="button" class="gline" data-a="go:chat:${v.id}">${face(g)}<span><b>${esc(g.n)}</b><small>${esc(T('chat.' + (v.stage >= 2 ? 'c2' : 'c1'), { n: p.n }))}</small></span><i class="chip on">${esc(T('chat.open'))}</i></button>
${v.stage === 5 ? `<button type="button" class="btn wide" data-a="pickup:${v.id}">${esc(T('live.got', { n: p.n }))}</button>` : `<p class="hint">${esc(T('live.hint'))}</p>`}</div></div>`;
  },
  show(el, q) { const v = visit(q.id); if (v.stage < 1 || v.stage > 4 || v.run) return; v.run = 1; [2, 3, 4, 5].forEach((n, i) => K.after(4200 * (i + 1), () => adv(v, n))); }
});
K.on('pickup', ([id]) => { const v = visit(id); v.stage = 6; v.kg = pet(v.pet).kg.slice(-1)[0]; v.note = 'rep.n0'; v.stars = 0; if (SV[v.svc].punch) S.punch = Math.min(10, S.punch + 1); K.back(); K.go('report', { id }); });
K.on('again', ([id]) => { const v = visit(id); B = newB({ pet: v.pet, svc: v.svc, adds: new Set(v.adds), pro: v.pro, step: 4 }); K.go('flow'); });

/* ---------- talking to the groomer ---------- */
K.def('chat', {
  render(q) { const v = visit(q.id), p = pet(v.pet), g = PRO[v.pro], ms = S.chat[v.id] || [];
    return `<header class="bar sat"><div><button type="button" class="ib" data-back aria-label="${esc(T('k.back'))}">${I('left')}</button><h1 class="ch">${face(g)}<span>${esc(g.n)}<small>${esc(T('chat.sub', { n: p.n }))}</small></span></h1><button type="button" class="ib" data-a="demo:call" aria-label="${esc(T('call'))}">${I('phone')}</button></div></header>
<div class="body msgs">${ms.map(m => `<div class="msg ${m.w}">${m.photo ? `<span class="photo" style="background:${TILES[p.tile % TILES.length]}">${petArt(p, m.photo)}</span>` : `<p>${esc(m.k ? T(m.k, { n: p.n }) : m.s)}</p>`}<small>${hm(m.t)}</small></div>`).join('')}</div>
<footer class="foot cfoot"><div class="hs quick">${['q1', 'q2', 'q3'].map(k => `<button type="button" data-a="quick:${v.id}:${k}">${esc(T('chat.' + k, { n: p.n }))}</button>`).join('')}</div>
<div class="cin"><input data-in="msg" value="${esc(S.msg)}" placeholder="${esc(T('chat.ph', { n: g.n }))}" aria-label="${esc(T('chat.ph', { n: g.n }))}" maxlength="80" enterkeyhint="send"><button type="button" class="ib send" data-a="send:${v.id}" aria-label="${esc(T('send'))}">${I('send')}</button></div></footer>`; },
  after(el) { const b = $('.msgs', el); b.scrollTop = b.scrollHeight; },
  show(el, q) { const v = visit(q.id); if (v.unread) { v.unread = 0; K.dirty(); } }
});
function say(id, m, reply) { S.chat[id] = S.chat[id] || []; S.chat[id].push(Object.assign({ w: 'me', t: new Date() }, m)); S.msg = ''; K.draw(); K.after(1500, () => { S.chat[id].push({ w: 'pro', k: reply, t: new Date() }); if (K.topName() === 'chat') K.draw(); }); }
K.ins.msg = v => { S.msg = v; };
K.on('quick', ([id, k]) => say(id, { k: 'chat.' + k }, 'chat.r' + k.slice(1)));
K.on('send', ([id]) => { const s = S.msg.trim(); if (s) say(id, { s }, 'chat.r0'); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.in === 'msg') { const b = $('.send', K.topEl()); if (b) b.click(); } });

/* ---------- the report after a visit ---------- */
K.def('report', {
  render(q) { const v = visit(q.id), p = pet(v.pet), g = PRO[v.pro], wk = v.svc === 'nails' ? 3 : 4;
    return bar(T('rep.t')) + `<div class="body pad"><div class="ba" style="background:${TILES[p.tile % TILES.length]}"><span>${petArt(p, 'mess')}<small>${esc(T('rep.before'))}</small></span>${I('arrow')}<span>${petArt(p, 'done')}<small>${esc(T('rep.after'))}</small></span></div>
<h2 class="rh">${esc(T('rep.h', { n: p.n }))}</h2><p class="rs">${esc(dayLabel(v.date))} · ${esc(svcLine(v))}</p>
<div class="card chk">${[['skin', 'shield', 1], ['ears', 'check', 1], ['nails', 'paw', 1], ['teeth', 'tooth', 0]].map(c => `<div class="row"><i class="ri${c[2] ? '' : ' warn'}">${I(c[1], 'm')}</i><span><b>${esc(T('rep.' + c[0]))}</b><small>${esc(T('rep.' + c[0] + '.v'))}</small></span><i class="chip${c[2] ? ' on' : ' warn'}">${esc(T(c[2] ? 'rep.ok' : 'rep.watch'))}</i></div>`).join('')}
<div class="row"><i class="ri">${I('scale', 'm')}</i><span><b>${esc(T('rep.kg'))}</b><small>${esc(T('rep.kg.v'))}</small></span><em class="pr">${v.kg.toFixed(1)} kg</em></div></div>
<div class="gnote">${face(g)}<div><b>${esc(g.n)}</b><p>${esc(T(v.note, { n: p.n }))}</p></div></div>
<div class="card rate"><h3>${esc(v.stars ? T('rep.thanks') : T('rep.q', { n: g.n }))}</h3><div class="stars">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-a="rate:${v.id}:${i}" aria-label="${i}" aria-pressed="${i <= v.stars}">${I(i <= v.stars ? 'starf' : 'star', 'l')}</button>`).join('')}</div></div>
<div class="nextv"><span><b>${esc(T('rep.next', { n: wk }))}</b><small>${esc(T('rep.nexts', { d: dstr(plus(wk * 7), { month: 'long', day: 'numeric' }) }))}</small></span><button type="button" class="btn sm" data-a="again:${v.id}">${esc(T('book.go'))}</button></div></div>`; }
});
K.on('rate', ([id, n]) => { visit(id).stars = +n; K.draw(); K.toast(T('rep.toast')); });

/* ---------- the pets ---------- */
const ageT = p => T('age', { n: p.age });
K.def('pets', { icon: 'paw', label: 'tab.pets',
  render() { return `<header class="pt sat"><h1>${esc(T('pets.t'))}</h1></header><div class="body"><div class="sec first">${S.pets.map(p => { const d = p.vax.map(x => daysTo(x.due)).sort((a, b) => a - b)[0];
    return `<button type="button" class="petc" data-a="go:pet:${p.id}">${ptile(p)}<span><b>${esc(p.n)}</b><small>${esc(L(p.breed))}</small><small>${esc(ageT(p))} · ${p.kg[p.kg.length - 1]} kg · ${esc(T('sex.' + p.sex))}</small>${d != null && d <= 30 ? `<i class="chip${d < 0 ? ' warn' : ' on'}">${I('syringe', 's')}${esc(d < 0 ? T('rem.late', { n: -d }) : T('rem.in', { n: d }))}</i>` : ''}</span>${I('right', 's')}</button>`; }).join('')}
<button type="button" class="petc dash" data-a="addpet"><span class="ptile">${I('plus')}</span><span><b>${esc(T('pet.add'))}</b><small>${esc(T('pet.adds'))}</small></span></button></div></div>`; }
});
K.def('pet', { strip: 200,
  render(q) { const p = pet(q.id), hist = S.visits.filter(v => v.pet === p.id && v.stage === 6).sort((a, b) => b.date - a.date), k = p.kg, dk = (k[k.length - 1] - k[0]);
    return `<div class="body"><div class="phero sat" style="background:${TILES[p.tile % TILES.length]}"><button type="button" class="ib glassb l" data-back aria-label="${esc(T('k.back'))}">${I('left')}</button><div class="pav">${petArt(p, '')}</div><h1>${esc(p.n)}</h1><p>${esc(L(p.breed))}</p></div>
<div class="pfacts">${[[ageT(p), 'pf.age'], [k[k.length - 1] + ' kg', 'pf.kg'], [T('sex.' + p.sex), 'pf.sex'], [T('size.' + p.size), 'pf.size']].map(f => `<span><b>${esc(f[0])}</b><small>${esc(T(f[1]))}</small></span>`).join('')}</div>
<section class="sec"><div class="sech"><h2>${esc(T('pet.kg'))}</h2><small>${esc(T(dk >= 0 ? 'pet.up' : 'pet.down', { n: Math.abs(dk).toFixed(1) }))}</small></div><div class="card padc">${weightChart(k)}</div></section>
<section class="sec"><div class="sech"><h2>${esc(T('pet.vax'))}</h2></div><div class="card">${p.vax.map((x, i) => { const d = daysTo(x.due); return `<div class="row"><i class="ri${d < 0 ? ' late' : ''}">${I('syringe', 'm')}</i><span><b>${esc(L(VAX[x.k]))}</b><small>${esc(dstr(x.due, { year: 'numeric', month: 'short', day: 'numeric' }))} · ${esc(d < 0 ? T('rem.late', { n: -d }) : T('rem.in', { n: d }))}</small></span>${sw(!x.off, 'vrem:' + p.id + ':' + i, T('rem.on'))}</div>`; }).join('') || `<p class="hint padc">${esc(T('pet.novax'))}</p>`}</div></section>
${p.note ? `<section class="sec"><div class="sech"><h2>${esc(T('pet.note'))}</h2></div><div class="card padc pnote">${I('note', 'm')}<p>${esc(L(p.note))}</p></div></section>` : ''}
<section class="sec"><div class="sech"><h2>${esc(T('pet.hist'))}</h2></div>${hist.length ? hist.map(vcard).join('') : `<p class="hint">${esc(T('pet.nohist'))}</p>`}</section>
<div class="sec"><button type="button" class="btn wide" data-a="bookpet:${p.id}">${esc(T('pet.book', { n: p.n }))}</button></div></div>`; }
});
K.on('vrem', ([id, i]) => { const x = pet(id).vax[+i]; x.off = !x.off; K.draw(); K.toast(T(x.off ? 'rem.offt' : 'rem.ont')); });
K.on('bookpet', ([id]) => { B = newB({ pet: id, step: 2 }); K.go('flow'); });
/* a new pet: the picture follows every choice */
const sws = (key, map, cur) => `<div class="sws">${Object.keys(map).map(k => `<button type="button" data-a="np:${key}:${k}" aria-pressed="${cur === k}" aria-label="${esc(T('c.' + k))}" style="--c:${map[k] || 'transparent'}">${map[k] ? '' : I('x', 's')}</button>`).join('')}</div>`;
K.def('addpet', { cls: 'up', up: true,
  render() { const p = NP;
    return `<header class="bar sat"><div><button type="button" class="ib" data-back aria-label="${esc(T('k.back'))}">${I('x')}</button><h1>${esc(T('pet.add'))}</h1><i class="ib"></i></div></header>
<div class="body"><div class="prev" style="background:${TILES[p.tile % TILES.length]}"><div class="pav">${petArt(p, '')}</div><b>${esc(p.n || T('np.noname'))}</b></div>
<div class="form"><label class="fld"><span>${esc(T('np.name'))}</span><input data-in="npname" value="${esc(p.n)}" placeholder="${esc(T('np.nameph'))}" maxlength="14" autocomplete="off"></label>
<div class="fld"><span>${esc(T('np.sp'))}</span><div class="seg">${['dog', 'cat'].map(s => `<button type="button" data-a="np:sp:${s}" aria-pressed="${p.sp === s}">${esc(T('sp.' + s))}</button>`).join('')}</div></div>
<div class="fld"><span>${esc(T('np.fur'))}</span>${sws('fur', FURS, p.fur)}</div>
${p.sp === 'dog' ? `<div class="fld"><span>${esc(T('np.ears'))}</span><div class="seg">${['flop', 'point'].map(s => `<button type="button" data-a="np:ears:${s}" aria-pressed="${p.ears === s}">${esc(T('ears.' + s))}</button>`).join('')}</div></div>` : ''}
<div class="fld"><span>${esc(T('np.mark'))}</span><div class="seg">${[['', 'mark.0'], ['1', p.sp === 'cat' ? 'mark.cat' : 'mark.dog']].map(s => `<button type="button" data-a="np:mark:${s[0]}" aria-pressed="${!!p.mark === !!s[0]}">${esc(T(s[1]))}</button>`).join('')}</div></div>
<div class="fld"><span>${esc(T('np.band'))}</span>${sws('band', BANDS, p.band)}</div>
<div class="fld"><span>${esc(T('np.size'))}</span><div class="seg">${SIZES.map(z => `<button type="button" data-a="np:size:${z}" aria-pressed="${p.size === z}">${esc(T('size.' + z))}</button>`).join('')}</div></div></div></div>
<footer class="foot"><button type="button" class="btn wide" data-a="npsave"${p.n.trim() ? '' : ' disabled'}>${esc(T('np.save'))}</button></footer>`; }
});
K.on('addpet', () => { NP = { id: 'p' + Date.now().toString(36), n: '', sp: 'dog', breed: tri('混血', 'Mixed breed', 'Baka campuran'), fur: 'cream', ears: 'flop', band: 'sun', mark: 0, size: 'M', age: 1, sex: 'f', kg: [6.0, 6.2, 6.3, 6.5, 6.6, 6.8], tile: S.pets.length + 2, vax: [], note: null }; K.go('addpet'); });
K.on('np', ([k, v]) => { NP[k] = k === 'mark' ? +!!v : v; K.draw(); });
K.ins.npname = (v, el) => { NP.n = v; const top = K.topEl(); $('.prev b', top).textContent = v || T('np.noname'); $('.foot .btn', top).disabled = !v.trim(); };
K.on('npsave', () => { NP.n = NP.n.trim(); if (!NP.n) return; S.pets.push(NP); const n = NP.n, id = NP.id; NP = null; if (B) B.pet = id; K.back(); K.draw(); K.toast(T('np.saved', { n })); });

/* ---------- account ---------- */
K.def('me', { icon: 'user', label: 'tab.me',
  render() { return `<header class="pt sat"><h1>${esc(T('tab.me'))}</h1><button type="button" class="ib" data-a="go:inbox" aria-label="${esc(T('inbox.t'))}">${I('bell')}${S.unread ? '<i class="pip"></i>' : ''}</button></header><div class="body">
<div class="prof"><i class="av">${esc(S.name[0])}</i><span><b>${esc(S.name)}</b><small>${esc(T('me.since', { n: S.pets.length }))}</small></span></div>
<div class="club"><span><small>${esc(T('punch.t'))}</small><b>${S.punch}<em>/10</em></b></span>${punchRow()}<p>${esc(S.punch >= 10 ? T('punch.full') : T('punch.n', { n: 10 - S.punch }))}</p></div>
<section class="card mlistc"><button type="button" class="row" data-a="vsheet">${I('ticket')}<span><b>${esc(T('me.v'))}</b></span><em>${S.vouchers.length}</em>${I('right', 's')}</button>
<button type="button" class="row" data-a="addrsheet">${I('pin')}<span><b>${esc(T('addr.t'))}</b></span><em>${S.addrs.length}</em>${I('right', 's')}</button>
<button type="button" class="row" data-a="paysheet">${I('card')}<span><b>${esc(T('pay.t'))}</b></span><em>${esc(T('pay.' + S.pay))}</em>${I('right', 's')}</button>
<button type="button" class="row" data-a="remsheet">${I('bell')}<span><b>${esc(T('me.rem'))}</b></span>${I('right', 's')}</button></section>
<section class="card mlistc"><button type="button" class="row" data-a="langsheet">${I('globe')}<span><b>${esc(T('me.lang'))}</b></span><em>${{ zh: '中文', en: 'English', ms: 'Bahasa Melayu' }[K.lang]}</em>${I('right', 's')}</button>
<button type="button" class="row" data-a="go:help">${I('help')}<span><b>${esc(T('me.help'))}</b></span>${I('right', 's')}</button>
<button type="button" class="row" data-a="about">${I('info')}<span><b>${esc(T('me.about'))}</b></span>${I('right', 's')}</button></section><p class="ver">Pawsome 2.6.1</p></div>`; }
});
K.on('vsheet', () => K.sheet(`<div class="sbody"><h2 class="sh">${esc(T('me.v'))}</h2>${S.vouchers.map(v => `<div class="vch">${I('ticket')}<span><b>${esc(L(v.n))}</b><small>${esc(T('v.exp', { d: dayS(v.exp) }))}</small></span></div>`).join('')}<p class="hint">${esc(T('v.hint'))}</p></div>`));
K.on('remsheet', () => K.sheet(() => `<div class="sbody"><h2 class="sh">${esc(T('me.rem'))}</h2><div class="plist">${['vax', 'day', 'promo'].map(k => `<div class="row"><span><b>${esc(T('rem.' + k + '.t'))}</b><small>${esc(T('rem.' + k + '.s'))}</small></span>${sw(S.remind[k], 'remset:' + k, T('rem.' + k + '.t'))}</div>`).join('')}</div></div>`));
K.on('remset', ([k]) => { S.remind[k] = !S.remind[k]; K.draw(); });
K.on('langsheet', () => K.sheet(() => `<div class="sbody"><h2 class="sh">${esc(T('me.lang'))}</h2><div class="plist">${[['zh', '中文'], ['en', 'English'], ['ms', 'Bahasa Melayu']].map(l => `<button type="button" class="row" data-a="setlang:${l[0]}" aria-pressed="${K.lang === l[0]}"><span><b>${l[1]}</b></span><i class="radio"></i></button>`).join('')}</div></div>`));
K.on('setlang', ([l]) => { K.closeSheet(); K.setLang(l); });
K.on('about', () => K.sheet(`<div class="sbody about"><span class="ptile lg" style="background:${TILES[0]}">${petArt(S.pets[0], 'done')}</span><h2>Pawsome</h2><p>${esc(T('about.p'))}</p><a class="btn ghost wide" href="https://dinamics.dev/craft/app" target="_blank" rel="noopener">${esc(T('about.go'))}</a></div>`));
K.def('inbox', {
  render() { return bar(T('inbox.t')) + `<div class="body pad">${S.inbox.map(n => `<div class="nrow${n.n ? ' new' : ''}"><i>${I({ vax: 'syringe', rep: 'note', club: 'gift' }[n.k], 'm')}</i><span><b>${esc(T('in.' + n.k + '.t'))}</b><small>${esc(T('in.' + n.k + '.b'))}</small><em>${esc(dayS(n.t))} ${hm(n.t)}</em></span></div>`).join('')}</div>`; },
  show() { if (S.unread) { S.unread = 0; setTimeout(() => { S.inbox.forEach(n => { n.n = 0; }); K.dirty(); }, 600); } }
});
K.def('help', { render() { return bar(T('me.help')) + `<div class="body pad">${FAQ.map(q => `<details class="faq"><summary>${esc(T('faq.' + q))}${I('down', 's')}</summary><p>${esc(T('faq.' + q + 'a'))}</p></details>`).join('')}<button type="button" class="btn ghost wide" data-a="demo:call">${I('phone', 's')} ${esc(T('help.call'))}</button></div>`; } });

/* ---------- deep links for pictures and checks, and the tour ---------- */
K.jumps = {
  book() { K.tab('book'); }, visits() { K.tab('visits'); }, pets() { K.tab('pets'); }, me() { K.tab('me'); },
  f1() { B = newB({ svc: 'full' }); K.go('flow'); }, f2() { B = newB({ svc: 'full', step: 2 }); B.adds.add('teeth'); K.go('flow'); }, f3() { B = newB({ svc: 'full', step: 3, pro: 'sofia' }); K.go('flow'); },
  f4() { B = newB({ svc: 'full', step: 4, pro: 'sofia', day: 2, slot: '13:30' }); K.go('flow'); }, f5() { B = newB({ svc: 'full', step: 5, pro: 'sofia', day: 2, slot: '13:30', mode: 'taxi' }); B.adds.add('teeth'); K.go('flow'); },
  ticket() { K.tab('visits', true); K.go('ticket', { id: 'PW-2342' }); }, live() { K.tab('visits', true); K.go('visit', { id: 'PW-2318' }); },
  ready() { K.tab('visits', true); const v = visit('PW-2318'); v.run = 1; [2, 3, 4, 5].forEach(n => adv(v, n)); K.go('visit', { id: v.id }); },
  chat() { K.tab('visits', true); const v = visit('PW-2318'); v.run = 1; adv(v, 2); K.go('chat', { id: v.id }); }, report() { K.tab('visits', true); K.go('report', { id: 'PW-2207' }); },
  prosh() { K.acts.pro(['sofia']); }, addr() { K.jumps.f5(); K.acts.addrsheet(); }, paysh() { K.jumps.f5(); K.acts.paysheet(); }, vouch() { K.tab('me', true); K.acts.vsheet(); }, rem() { K.tab('me', true); K.acts.remsheet(); },
  inbox() { K.go('inbox'); }, help() { K.go('help'); }, lang() { K.tab('me', true); K.acts.langsheet(); }, about() { K.tab('me', true); K.acts.about(); }, past() { K.tab('visits', true); K.go('visit', { id: 'PW-2207' }); },
  cat() { K.tab('pets', true); K.go('pet', { id: 'luna' }); }, f1new() { B = newB(); K.go('flow'); },
  pet() { K.tab('pets', true); K.go('pet', { id: 'mochi' }); }, addpet() { K.tab('pets', true); K.acts.addpet(); Object.assign(NP, { n: 'Biscuit', fur: 'brown', mark: 1, band: 'teal' }); K.draw(); }, upvisit() { K.tab('visits', true); K.go('visit', { id: 'PW-2342' }); }
};
K.tour = async A => {
  await A.tap('.svgrid [data-a="book:full"]'); await A.tap('[data-a="fnext"]', 700); await A.tap('[data-a="fadd:teeth"]', 600); await A.tap('[data-a="fnext"]', 700);
  await A.tap('[data-a="fpro:sofia"]', 600); await A.tap('[data-a="fnext"]', 700); await A.tap('[data-a="fday:2"]', 600); await A.tap('.slots button:not([disabled])', 600); await A.tap('[data-a="fnext"]', 700);
  await A.tap('[data-a="fmode:taxi"]', 700); await A.scroll(300); await A.tap('[data-a="fnext"]', K.fast ? 900 : 2600); await A.scroll(260); await A.tap('[data-a="tovisits"]', 900);
  await A.tap('.livec', 900); await A.wait(K.fast ? 2200 : 17800); await A.tap('.gline', 900); await A.tap('.quick button', K.fast ? 900 : 2600); await A.tap('.bar [data-back]', 800);
  await A.scroll(300); await A.tap('[data-a^="pickup"]', 1200); await A.scroll(420); await A.tap('.stars button:nth-child(5)', 1400);
  await A.tap('.bar [data-back]', 600); await A.tap('#tabs [data-tab="pets"]'); await A.tap('[data-a="go:pet:mochi"]', 900); await A.scroll(330); await A.wait(700); await A.tap('.phero [data-back]', 600);
  await A.tap('.petc.dash', 900); await A.type('[data-in="npname"]', 'Biscuit'); await A.tap('[data-a="np:fur:brown"]', 500); await A.tap('[data-a="np:ears:point"]', 500); await A.tap('[data-a="np:mark:1"]', 500); await A.scroll(300); await A.tap('[data-a="np:band:teal"]', 700); await A.tap('[data-a="npsave"]', 1400);
};
K.boot({ id: 'pawsome', tabs: ['home', 'book', 'visits', 'pets', 'me'] });

</script>
