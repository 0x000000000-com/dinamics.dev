<head>
<meta charset="utf-8">

<title>早安咖啡 Kopi Pagi</title>

<style>
b,strong,h1,h2,h3,h4{font-weight:500}
body{font-variant-numeric:tabular-nums}

/* 早安咖啡 Kopi Pagi — a sample ordering app by Dinamics. Kopitiam colours: tile green, egg-yolk yellow, marble white. */
:root{--g:#0E3B2E;--g2:#155440;--y:#F4C542;--y2:#FFE08A;--w:#FFFDF7;--ink:#14221D;--mut:#5C6B64;--line:#E4E0D3;--r:18px;
  font-family:ui-rounded,"SF Pro Rounded","Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--w)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--w);overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s}
.scr[hidden]{display:flex!important;visibility:hidden;opacity:0;transform:translateX(30%);pointer-events:none}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:120px}
/* home */
.hero{background:var(--g);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 28px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600}
.brand svg{width:34px;height:34px}
.lang{display:flex;gap:2px;background:#ffffff1c;border-radius:99px;padding:4px}
.lang button{font-size:12px;padding:4px 8px;border-radius:99px;color:#ffffffb8}
.lang button[aria-pressed=true]{background:var(--y);color:var(--g);font-weight:600}
.hi{margin-top:20px;font-size:13px;color:#ffffffb8}
.open{display:inline-flex;align-items:center;gap:8px}.open i{width:8px;height:8px;border-radius:50%;background:#7EE2A8;box-shadow:0 0 0 3px #7EE2A833}
.hi b{display:block;margin-top:8px;font-size:24px;font-weight:600;color:#fff;line-height:1.2}
.pts{margin-top:16px;display:flex;align-items:center;gap:12px;background:#ffffff14;border:1px solid #ffffff22;border-radius:16px;padding:12px 16px}
.pts .cup{flex:none;width:40px;height:40px;border-radius:12px;background:var(--y);display:grid;place-items:center;color:var(--g);font-weight:600}
.pts p{font-size:13px;color:#ffffffcc;line-height:1.4}
.pts p b{color:var(--y);font-size:15px}
.bar10{height:6px;border-radius:9px;background:#ffffff22;margin-top:8px;overflow:hidden}
.bar10 i{display:block;height:100%;background:var(--y);border-radius:9px;transition:width .6s}
.cats{display:flex;gap:8px;padding:20px 20px 8px;overflow-x:auto}
.cats button{flex:none;padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);font-size:14px;font-weight:500;color:var(--mut)}
.cats button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.menu{list-style:none;padding:8px 16px;display:grid;gap:12px}
.item{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:12px;border-radius:var(--r);background:#fff;border:1px solid var(--line)}
.item .pic{flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center}
.item .pic svg{width:44px;height:44px}
.item h3{font-size:16px;line-height:1.25}
.item p{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.35}
.item .pr{margin-left:auto;flex:none;text-align:right;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.item .pr small{display:block;margin-top:8px;width:30px;height:30px;margin-left:auto;border-radius:10px;background:var(--y);color:var(--g);font-size:20px;line-height:30px;text-align:center}
.tag{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;color:var(--g2);background:#E4F1EA;border-radius:6px;padding:2px 8px}
/* cart bar */
.cart{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;padding:12px 12px 12px 20px;border-radius:20px;background:var(--g);color:#fff;
  box-shadow:0 18px 40px -16px #00000047;transform:translateY(140%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.cart.on{transform:none}
.cart .n{width:30px;height:30px;border-radius:50%;background:var(--y);color:var(--g);display:grid;place-items:center;font-weight:600}
.cart .sum{font-weight:600}
.cart .go{margin-left:auto;background:var(--y);color:var(--g);font-weight:600;padding:12px 16px;border-radius:14px}
/* sheet */
.dim{position:absolute;inset:0;background:#0b1712aa;opacity:0;pointer-events:none;transition:opacity .25s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sh-top{display:flex;gap:16px;align-items:center}
.sh-top .pic{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;flex:none}
.sh-top .pic svg{width:52px;height:52px}
.sh-top h3{font-size:20px}
.sh-top p{font-size:13px;color:var(--mut);margin-top:4px}
.opt{margin-top:16px}
.opt h4{font-size:13px;color:var(--mut);font-weight:500;margin-bottom:8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 8px;border-radius:14px;border:1.5px solid var(--line);font-weight:500;font-size:14px}
.seg button[aria-pressed=true]{border-color:var(--g);background:#E4F1EA;color:var(--g)}
.qty{display:flex;align-items:center;gap:16px;margin-top:20px}
.qty .step{flex:none;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);font-size:20px;font-weight:500}
.qty b{min-width:20px;text-align:center;font-size:18px}
.add{flex:1;min-width:0;margin-left:8px;white-space:nowrap;background:var(--g);color:#fff;font-weight:600;padding:12px 16px;border-radius:16px;font-size:15px}
/* checkout + status */
.head{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);background:#fff}
.head button{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.head button svg{width:22px;height:22px}
.head h2{font-size:18px}
.box{margin:16px 16px 0;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 16px}
.box h4{font-size:13px;color:var(--mut);font-weight:500;margin-bottom:12px}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:8px 0;font-variant-numeric:tabular-nums}
.line small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.line.tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:12px;font-weight:600;font-size:17px}
.pay{display:grid;gap:8px}
.pay button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1.5px solid var(--line);text-align:left;font-weight:500;font-size:14.5px}
.pay button i{width:34px;height:24px;border-radius:6px;flex:none}
.pay button[aria-pressed=true]{border-color:var(--g);background:#E4F1EA}
.cta{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:16px;border-radius:18px;background:var(--g);color:#fff;font-weight:600;font-size:16px;text-align:center}
.cta[disabled]{opacity:.55}
.paying{position:absolute;inset:0;display:grid;place-items:center;background:#0E3B2Ef2;color:#fff;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.paying.on{opacity:1;pointer-events:auto}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid #ffffff33;border-top-color:var(--y);margin:0 auto 16px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.st{padding:calc(28px + env(safe-area-inset-top)) 20px 0;text-align:center}
.st .q{font-size:13px;color:var(--mut)}
.st .no{font-size:76px;font-weight:600;letter-spacing:2px;font-variant-numeric:tabular-nums;color:var(--g);line-height:1.05;margin-top:8px}
.st .eta{font-size:15px;margin-top:8px}
.steps{list-style:none;padding:0;margin:28px 8px 0;display:grid;gap:0;text-align:left}
.steps li{display:flex;gap:16px;align-items:flex-start;position:relative;padding-bottom:24px;color:var(--mut)}
.steps li::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .dot{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:14px;font-weight:600;position:relative;z-index:1;transition:.3s}
.steps li.on{color:var(--ink)}
.steps li.on .dot{border-color:var(--g);background:var(--g);color:var(--y)}
.steps li.now .dot{box-shadow:0 0 0 6px #0E3B2E1f}
.steps b{display:block;font-size:15.5px}
.steps small{font-size:12.5px}
.earn{margin:8px 20px 0;padding:16px 16px;border-radius:16px;background:#FFF5D6;border:1px solid #F4C54266;display:flex;gap:12px;align-items:center;font-size:14px;opacity:0;transform:translateY(8px);transition:.4s}
.earn.on{opacity:1;transform:none}
.earn b{font-size:18px;color:var(--g)}
.ghost{display:block;margin:20px auto 0;padding:12px 20px;border-radius:14px;border:1.5px solid var(--line);font-weight:500}
.toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;font-size:14px;padding:12px 16px;border-radius:99px;transition:transform .3s,opacity .3s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;z-index:9}
.toast.on{transform:translate(-50%,0);opacity:1}
.tap{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#F4C54266;border:2px solid #F4C542;pointer-events:none;z-index:20;opacity:0;transition:opacity .2s,transform .2s}
.tap.on{opacity:1;transform:scale(.8)}
@media (max-width:360px){.qty{gap:8px}.qty .step{width:36px;height:36px}.add{font-size:14px;padding:12px 12px}.hero{padding-left:16px;padding-right:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="dim" id="dim"></div>

</div>
<div class="toast" id="toast" role="status"></div>
<div class="tap" id="tap"></div>
</div>

 {id:'latte', c:'c_kopi', p:9.9, bg:'#E8EFE9', pic:CUP('#D9B48C','#0E3B2E'), temp:1, n:{zh:'椰糖拿铁',en:'Gula Melaka latte',ms:'Latte gula Melaka'}, d:{zh:'椰糖和双份浓缩',en:'Palm sugar and a double shot',ms:'Gula Melaka dan dua shot espresso'}},
 {id:'teh', c:'c_teh', p:4.2, bg:'#F6E3C8', pic:CUP('#C8884A','#8A5428'), temp:1, fav:1, n:{zh:'拉茶 Teh Tarik',en:'Teh tarik',ms:'Teh tarik'}, d:{zh:'拉出一层厚泡沫',en:'Pulled until it foams',ms:'Ditarik sampai berbuih'}},
 {id:'limau', c:'c_teh', p:3.9, bg:'#EAF3D9', pic:CUP('#E7C14A','#7DA640'), temp:0, n:{zh:'酸柑冰茶',en:'Iced lime tea',ms:'Teh limau ais'}, d:{zh:'现挤酸柑，只有冰的',en:'Fresh calamansi, iced only',ms:'Limau kasturi segar, ais sahaja'}},
 {id:'kaya', c:'c_food', p:5.5, bg:'#FFF1CF', pic:TOAST, temp:-1, fav:1, n:{zh:'咖椰牛油吐司',en:'Kaya butter toast',ms:'Roti bakar kaya mentega'}, d:{zh:'炭烤吐司，自家咖椰',en:'Charcoal toast, our own kaya',ms:'Roti bakar arang, kaya buatan sendiri'}},
 {id:'egg', c:'c_food', p:3.2, bg:'#F2F2EC', pic:EGG, temp:-1, n:{zh:'半生熟蛋（两颗）',en:'Half-boiled eggs (two)',ms:'Telur separuh masak (dua)'}, d:{zh:'加酱油和胡椒',en:'With soy sauce and pepper',ms:'Dengan kicap dan lada'}}];
const $ = id => document.getElementById(id), Q = new URLSearchParams(location.search);
let L = ['zh', 'en', 'ms'].includes(Q.get('lang')) ? Q.get('lang') : 'zh', cat = 'c_kopi', cart = [], cur = null, temp = 'hot', sugar = 'norm', qty = 1, when = 'now', payBy = 'tng', stamps = 7, points = 120, timers = [];
const t = (k, o = {}) => (W[L][k] || W.zh[k] || k).replace(/\{(\w+)\}/g, (_, x) => o[x] ?? '');
const rm = v => 'RM ' + v.toFixed(2);
function show(id) { for (const s of document.querySelectorAll('.scr')) s.hidden = s.id !== id; $('toast').classList.remove('on'); }
function toast(m) { const e = $('toast'); e.textContent = m; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 1600); }
function seg(el, opts, val, on) { el.innerHTML = opts.map(o => `<button type="button" data-v="${o}" aria-pressed="${o === val}">${t(o)}</button>`).join(''); el.onclick = e => { const b = e.target.closest('button'); if (b) { on(b.dataset.v); seg(el, opts, b.dataset.v, on); } }; }
function stampsTxt() { $('ptsN').textContent = stamps; $('ptsBig').textContent = points; $('ptsBar').style.width = (stamps * 10) + '%'; document.querySelector('[data-t=pts1]').textContent = t('pts1', {n: Math.max(0, 10 - stamps)}); }
function words() {
  document.documentElement.lang = L === 'zh' ? 'zh-CN' : L; document.title = (L === 'zh' ? '早安咖啡 Kopi Pagi' : 'Kopi Pagi');
  for (const e of document.querySelectorAll('[data-t]')) e.textContent = t(e.dataset.t);
  for (const b of document.querySelectorAll('.lang button')) b.setAttribute('aria-pressed', String(b.dataset.l === L));
  stampsTxt(); cats(); menu(); bar();
  if (!$('sPay').hidden) payScreen(); if (!$('sDone').hidden) steps(window._stage || 0);
  if ($('sheet').classList.contains('on')) sheetWords();
}
function cats() { $('cats').innerHTML = ['c_kopi', 'c_teh', 'c_food'].map(c => `<button type="button" data-c="${c}" aria-pressed="${c === cat}">${t(c)}</button>`).join(''); }
function menu() { $('menu').innerHTML = MENU.filter(m => m.c === cat).map(m => `<li><button type="button" class="item" data-id="${m.id}"><span class="pic" style="background:${m.bg}">${m.pic}</span><span><h3>${m.n[L]}</h3><p>${m.d[L]}</p>${m.fav ? `<span class="tag">${t('fav')}</span>` : ''}</span><span class="pr">${rm(m.p)}<small aria-hidden="true">+</small></span></button></li>`).join(''); }
function bar() { const n = cart.reduce((a, c) => a + c.q, 0), s = total(); $('cartN').textContent = n; $('cartSum').textContent = t('items', {n}) + ' · ' + rm(s.sum); $('cart').classList.toggle('on', n > 0 && !$('sHome').hidden); }
// the 10th cup is free: when this order holds the 10th stamp, its cheapest drink costs nothing
function total() { const sub = cart.reduce((a, c) => a + c.p * c.q, 0), drinks = cart.filter(c => c.temp !== -1), cups = drinks.reduce((a, c) => a + c.q, 0);
  const free = cups && stamps + cups >= 10 ? Math.min(...drinks.map(c => c.p)) : 0; return {sub, free, cups, sum: Math.max(0, sub - free)}; }
function sheetWords() { const m = cur; $('shPic').style.background = m.bg; $('shPic').innerHTML = m.pic; $('shName').textContent = m.n[L]; $('shDesc').textContent = m.d[L] + ' · ' + rm(m.p);
  $('optTemp').hidden = m.temp === -1;
  if (m.temp !== -1) seg($('segTemp'), m.temp ? ['hot', 'iced'] : ['iced'], temp, v => { temp = v; });
  seg($('segSugar'), m.temp === -1 ? ['none', 'norm'] : ['less', 'norm', 'more'], sugar, v => { sugar = v; });
  $('qN').textContent = qty; $('addGo').textContent = t('add', {p: rm(m.p * qty)}); }
function openSheet(id) { cur = MENU.find(m => m.id === id); temp = cur.temp === 0 ? 'iced' : 'hot'; sugar = cur.temp === -1 ? 'none' : 'norm'; qty = 1; sheetWords(); $('dim').classList.add('on'); $('sheet').classList.add('on'); $('addGo').focus({preventScroll: true}); }
function closeSheet() { $('dim').classList.remove('on'); $('sheet').classList.remove('on'); }
function add() { const key = cur.id + temp + sugar, have = cart.find(c => c.key === key); if (have) have.q += qty; else cart.push({key, id: cur.id, p: cur.p, q: qty, temp: cur.temp === -1 ? -1 : temp, sugar}); closeSheet(); bar(); toast(t('added', {x: cur.n[L]})); }
function payScreen() {
  seg($('when'), ['now', 'in15', 'in30'], when, v => { when = v; });
  const s = total();
  $('lines').innerHTML = cart.map(c => { const m = MENU.find(x => x.id === c.id); const o = [c.temp !== -1 ? t(c.temp) : '', t(c.sugar)].filter(Boolean).join(' · '); return `<div class="line"><span>${c.q} × ${m.n[L]}<small>${o}</small></span><b>${rm(c.p * c.q)}</b></div>`; }).join('') +
    `<div class="line"><span>${t('sub')}</span><span>${rm(s.sub)}</span></div>` + (s.free ? `<div class="line"><span>${t('disc')}</span><span>− ${rm(s.free)}</span></div>` : '') + `<div class="line tot"><span>${t('total')}</span><span>${rm(s.sum)}</span></div>`;
  const PAY = {tng: '#1C5FD4', duit: '#E2286D', card: '#14221D'};
  $('payBy').innerHTML = Object.keys(PAY).map(k => `<button type="button" data-v="${k}" aria-pressed="${k === payBy}"><i style="background:${PAY[k]}"></i>${t(k)}</button>`).join('');
  $('payBy').onclick = e => { const b = e.target.closest('button'); if (b) { payBy = b.dataset.v; payScreen(); } };
  $('payGo').textContent = t('pay', {p: rm(s.sum)}); $('payGo').disabled = !cart.length;
}
function steps(k) { window._stage = k; $('steps').innerHTML = [1, 2, 3].map(i => `<li class="${i <= k + 1 ? 'on' : ''}${i === k + 1 ? ' now' : ''}"><span class="dot">${i <= k ? '✓' : i}</span><span><b>${t('s' + i)}</b><small>${t('s' + i + 'd')}</small></span></li>`).join('');
  $('eta').textContent = k >= 2 ? t('ready') : t('eta', {m: k ? 3 : 6}); }
function pay() { $('paying').classList.add('on'); timers.push(setTimeout(() => { $('paying').classList.remove('on');
  const s = total(), earn = Math.round(s.sum);
  $('qNo').textContent = 'A' + (20 + Math.floor(Math.random() * 70)); $('earnN').textContent = '+' + earn; $('earn').classList.remove('on');
  stamps = s.free ? stamps + s.cups - 10 : stamps + s.cups; points += earn; cart = []; show('sDone'); steps(0); bar();
  timers.push(setTimeout(() => steps(1), 2600), setTimeout(() => { steps(2); $('earn').classList.add('on'); stampsTxt(); }, 5600)); }, 1300)); }
// wiring
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.l) { L = b.dataset.l; words(); return; }
  if (b.dataset.c) { cat = b.dataset.c; cats(); menu(); return; }
  if (b.dataset.id) { openSheet(b.dataset.id); return; }
});
$('dim').onclick = closeSheet;
$('qMinus').onclick = () => { qty = Math.max(1, qty - 1); sheetWords(); };
$('qPlus').onclick = () => { qty = Math.min(9, qty + 1); sheetWords(); };
$('addGo').onclick = add;
$('cartGo').onclick = () => { show('sPay'); payScreen(); bar(); };
$('back1').onclick = () => { show('sHome'); bar(); };
$('payGo').onclick = pay;
$('again').onclick = () => { timers.forEach(clearTimeout); timers = []; show('sHome'); bar(); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
// a page that holds this app can set its language: postMessage({lang}) or ?lang=
addEventListener('message', e => { const l = e.data && e.data.lang; if (['zh', 'en', 'ms'].includes(l) && l !== L) { L = l; words(); } });
words(); show('sHome');
// ?auto=1: the app plays itself (a page shows it as a moving picture); any touch hands it back to the visitor
if (Q.get('auto') === '1') {
  const tap = $('tap'); let stop = false;
  const at = (el) => { if (!el) return; const r = el.getBoundingClientRect(); tap.style.left = (r.left + r.width / 2) + 'px'; tap.style.top = (r.top + r.height / 2) + 'px'; tap.classList.add('on'); setTimeout(() => tap.classList.remove('on'), 260); el.click(); };
  const S = [[1200, () => at(document.querySelector('[data-id=kopi]'))], [1400, () => at(document.querySelector('#segTemp [data-v=iced]'))], [900, () => at(document.querySelector('#segSugar [data-v=less]'))],
    [900, () => at($('addGo'))], [1300, () => at(document.querySelector('[data-c=c_food]'))], [1100, () => at(document.querySelector('[data-id=kaya]'))], [1200, () => at($('addGo'))],
    [1500, () => at($('cartGo'))], [1500, () => at(document.querySelector('#when [data-v=in15]'))], [1100, () => at($('payGo'))], [9800, () => at($('again'))], [600, () => { cat = 'c_kopi'; cats(); menu(); }]];
  const run = (i = 0) => { if (stop) return; const [d, f] = S[i % S.length]; setTimeout(() => { if (!stop) { f(); run(i + 1); } }, d); };
  addEventListener('pointerdown', e => { if (e.isTrusted) stop = true; }, {capture: true}); run();
}
})();
</script>
